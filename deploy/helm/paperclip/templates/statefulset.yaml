apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "paperclip.fullname" . }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "paperclip.headlessServiceName" . }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "paperclip.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "paperclip.selectorLabels" . | nindent 8 }}
        {{- with .Values.pod.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.pod.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "paperclip.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      shareProcessNamespace: {{ .Values.pod.shareProcessNamespace }}
      securityContext:
        {{- toYaml .Values.pod.securityContext | nindent 8 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      initContainers:
        - name: seed
          image: {{ include "paperclip.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.pod.containerSecurityContext | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # BASE and INSTANCE_ID arrive through the env below rather than
              # being templated into this script. Helm's `quote` only escapes
              # quotes and backslashes, so a value holding $(...) or backticks
              # would still be substituted by the shell; env values are not
              # shell-interpreted at all.
              INST="${PAPERCLIP_BASE_PATH}/instances/${PAPERCLIP_INSTANCE_ID}"
              mkdir -p "${INST}/secrets"
              # Write the seed through verbatim. The server reads this file with
              # readFileSync(path, "utf8") and, when it generates the key itself,
              # writes `randomBytes(32).toString("base64")` as utf8 text. Decoding
              # to raw binary here would leave bytes that do not survive the utf8
              # read, and startup fails with an invalid-master-key error.
              if [ -n "${PAPERCLIP_MASTER_KEY_SEED:-}" ] && [ ! -f "${INST}/secrets/master.key" ]; then
                printf '%s' "${PAPERCLIP_MASTER_KEY_SEED}" > "${INST}/secrets/master.key"
                chmod 0600 "${INST}/secrets/master.key"
              fi
          env:
            - name: PAPERCLIP_BASE_PATH
              value: {{ .Values.persistence.mountPath | quote }}
            - name: PAPERCLIP_INSTANCE_ID
              value: {{ .Values.env.instanceId | quote }}
            {{- /* secret.yaml only writes masterKey into the Secret it renders
                   itself, so referencing the key against a user-supplied
                   existingSecret would wedge the pod on an unresolvable
                   secretKeyRef. The seed script tolerates the var being unset. */}}
            {{- if and .Values.secret.masterKey (not .Values.secret.existingSecret) }}
            - name: PAPERCLIP_MASTER_KEY_SEED
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.secretName" . }}
                  key: masterKey
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
      containers:
        - name: paperclip
          image: {{ include "paperclip.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.pod.containerSecurityContext | nindent 12 }}
          workingDir: /app
          command: ["node"]
          args:
            - --import
            - ./server/node_modules/tsx/dist/loader.mjs
            - server/dist/index.js
          ports:
            - name: http
              containerPort: {{ .Values.env.port }}
              protocol: TCP
          env:
            - name: HOST
              value: {{ .Values.env.host | quote }}
            - name: PORT
              value: {{ .Values.env.port | quote }}
            - name: SERVE_UI
              value: {{ .Values.env.serveUi | quote }}
            - name: PAPERCLIP_HOME
              value: {{ .Values.persistence.mountPath | quote }}
            - name: PAPERCLIP_INSTANCE_ID
              value: {{ .Values.env.instanceId | quote }}
            - name: PAPERCLIP_ALLOWED_HOSTNAMES
              value: {{ include "paperclip.allowedHostnames" . | quote }}
            - name: PAPERCLIP_AGENT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.secretName" . }}
                  key: agentJwtSecret
            {{- with .Values.env.extra }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- include "paperclip.probeHttpGet" . | nindent 12 }}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- include "paperclip.probeHttpGet" . | nindent 12 }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          startupProbe:
            {{- include "paperclip.probeHttpGet" . | nindent 12 }}
            {{- toYaml .Values.probes.startup | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not .Values.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "paperclip.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
