suite: statefulset
release:
  name: paperclip
templates:
  - templates/statefulset.yaml
tests:
  - it: binds the StatefulSet to the headless Service
    asserts:
      - equal:
          path: spec.serviceName
          value: paperclip-headless

  - it: always allows 127.0.0.1 so agents reach the local API
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERCLIP_ALLOWED_HOSTNAMES
            value: "127.0.0.1"

  - it: keeps 127.0.0.1 first when extra allowed hostnames are configured
    set:
      env.extraAllowedHostnames:
        - foo.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERCLIP_ALLOWED_HOSTNAMES
            value: "127.0.0.1,foo.example.com"

  - it: seeds the master key from the generated Secret when one is rendered
    set:
      secret.masterKey: c2VlZA==
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: PAPERCLIP_MASTER_KEY_SEED
            valueFrom:
              secretKeyRef:
                name: paperclip-credentials
                key: masterKey

  # secret.yaml only writes `masterKey` into the Secret it renders itself, so
  # referencing the key against a user-supplied Secret would leave the pod
  # stuck on an unresolvable secretKeyRef.
  - it: does not reference masterKey when an existing Secret is supplied
    set:
      secret.masterKey: c2VlZA==
      secret.existingSecret: my-external-secret
    asserts:
      - notContains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: PAPERCLIP_MASTER_KEY_SEED
            valueFrom:
              secretKeyRef:
                name: my-external-secret
                key: masterKey
      - lengthEqual:
          path: spec.template.spec.initContainers[0].env
          count: 2

  # The server reads master.key as utf8 and writes base64 text when it
  # generates the key itself, so the seed must land in the file unchanged.
  # Decoding it to raw binary here yields bytes that do not survive that read.
  - it: writes the master key seed without base64-decoding it
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'printf ''%s'' "\$\{PAPERCLIP_MASTER_KEY_SEED\}" > '
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "base64 -d"

  # Helm's `quote` escapes quotes and backslashes but not $() or backticks, so
  # a templated value would still be command-substituted by the shell. These
  # values must reach the script through env, which is never shell-interpreted.
  - it: never templates instanceId or mountPath into the seed script
    set:
      env.instanceId: "$(touch /pwned)"
      persistence.mountPath: "/paperclip$(touch /pwned2)"
    asserts:
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "touch /pwned"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: PAPERCLIP_INSTANCE_ID
            value: "$(touch /pwned)"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: PAPERCLIP_BASE_PATH
            value: "/paperclip$(touch /pwned2)"
