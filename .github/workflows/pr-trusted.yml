name: Trusted PR CI

# Rollout is intentionally two-step: merge this reusable workflow first, then
# replace pr.yml with an immutable-SHA caller so the active CI definition cannot
# drift from this file.
on:
  workflow_call:

permissions:
  actions: read
  contents: read
  pull-requests: read

# Test reporters write local artifacts only. The workflow_run exporter owns
# the Honeycomb credential, so fork PRs cannot execute with it.
env:
  PAPERCLIP_CI_PROFILE_DIR: ${{ github.workspace }}/.ci-profile

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    uses: paperclipai/paperclip/.github/workflows/ci-routing.yml@master

  policy:
    needs: [gate]
    runs-on: ${{ needs.gate.outputs.runner }}
    timeout-minutes: 10

    env:
      PAPERCLIP_CI_PROFILE: ${{ needs.gate.outputs.profile_ci }}
      PAPERCLIP_CI_PROFILE_JOB: policy

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize CI profile
        continue-on-error: true
        if: env.PAPERCLIP_CI_PROFILE == 'true'
        run: node scripts/ci-profile/initialize.mjs

      - name: Select compatible Node test command
        run: |
          # A rerun can use this trusted workflow with a pre-feature checkout.
          if [[ -f scripts/ci-profile/node-test.mjs ]]; then
            echo 'CI_NODE_TEST=scripts/ci-profile/node-test.mjs' >> "$GITHUB_ENV"
          else
            echo 'CI_NODE_TEST=--test' >> "$GITHUB_ENV"
          fi

      - name: Block manual lockfile edits
        if: >-
          github.head_ref != 'chore/refresh-lockfile' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          # Diff the PR branch against its merge base so recent base-branch commits
          # do not masquerade as changes made by the PR itself.
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          if printf '%s\n' "$changed" | grep -qx 'pnpm-lock.yaml'; then
            echo "Do not commit pnpm-lock.yaml in pull requests. CI owns lockfile updates."
            exit 1
          fi

      - name: Setup Node.js for pnpm bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
        with:
          version: 9.15.4
          run_install: false

      - name: Validate migration ordering against target branch
        run: >-
          node .github/scripts/check-pr-migration-order.mjs
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

      - name: Validate Dockerfile deps stage
        run: node ./scripts/check-docker-deps-stage.mjs

      - name: Validate Node version policy
        run: pnpm check:node-version

      - name: Reject git push in adapter/runtime code
        run: node ./scripts/check-no-git-push.mjs

      - name: Test no-git-push check
        run: node "$CI_NODE_TEST" ./scripts/check-no-git-push.test.mjs

      - name: Validate feature module boundaries
        run: pnpm check:module-boundaries

      - name: Test feature module boundary check
        run: node "$CI_NODE_TEST" ./scripts/check-module-boundaries.test.mjs

      - name: Test PR quality-gate scripts
        run: node "$CI_NODE_TEST" '.github/scripts/tests/*.test.mjs'

      - name: Test general-server shard partition
        run: node "$CI_NODE_TEST" ./scripts/__tests__/run-vitest-stable-shard.test.mjs

      - name: Test e2e shard partition
        run: node "$CI_NODE_TEST" ./scripts/__tests__/e2e-shard.test.mjs

      - name: Test release verify workflow wiring
        run: node "$CI_NODE_TEST" ./scripts/__tests__/release-verify-workflow.test.mjs ./scripts/__tests__/prepare-runner-release-image.test.mjs ./scripts/cloud-source-verification.test.mjs ./scripts/standard-image-contract.test.mjs

      - name: Test standalone package build concurrency
        run: node "$CI_NODE_TEST" ./scripts/__tests__/build-standalone-concurrency.test.mjs

      - name: Validate release package manifest
        run: node ./scripts/release-package-map.mjs check

      - name: Verify release package bootstrap for changed manifests
        run: |
          mapfile -t changed_paths < <(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          PAPERCLIP_RELEASE_BOOTSTRAP_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            node ./scripts/check-release-package-bootstrap.mjs "${changed_paths[@]}"

      # Each lane resolves a stale lockfile inline; this early check still
      # fails fast when the merge tree cannot resolve at all.
      - name: Validate dependency resolution
        run: pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile

      - name: Upload CI profile timings
        continue-on-error: true
        if: always() && env.PAPERCLIP_CI_PROFILE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-profile-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: .ci-profile/*.ndjson
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  typecheck_release_registry:
    name: Typecheck + Release Registry
    needs: [gate]
    if: ${{ needs.gate.outputs.full_ci == 'true' }}
    runs-on: ${{ needs.gate.outputs.runner }}
    timeout-minutes: 20

    env:
      PAPERCLIP_CI_PROFILE: ${{ needs.gate.outputs.profile_ci }}
      PAPERCLIP_CI_PROFILE_JOB: Typecheck + Release Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CI profile
        continue-on-error: true
        if: env.PAPERCLIP_CI_PROFILE == 'true'
        run: node scripts/ci-profile/initialize.mjs

      - name: Setup Node.js for pnpm bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
        with:
          version: 9.15.4

      # Share the checked-in lockfile key with master. PR merge refs must not
      # save full copies of the store or evict the post-merge build caches.
      - name: Restore materialized dependencies and shared builds
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') != ''
        uses: ./.github/actions/setup-ci-dependencies

      - name: Locate pnpm store
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        id: pnpm_store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "arch=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.pnpm_store.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-cache-${{ runner.os }}-${{ steps.pnpm_store.outputs.arch }}-pnpm-

      - name: Install dependencies
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        # Manifest-changing and stacked PRs can hold a pnpm-lock.yaml that is
        # stale for the merge tree. Resolve it inline instead of waiting on a
        # policy-job artifact: that dependency put the policy job's queue and
        # runtime (~60s) on every lane's critical path, and policy still
        # validates resolution as a required check in parallel.
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo '::notice title=Lockfile::checked-in lockfile is stale for this merge tree; resolving it inline'
            pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
            pnpm install --frozen-lockfile
          fi

      # typecheck:build-gaps builds @paperclipai/server, whose build script
      # rebuilds the Runner release binary; without the shared Rust cache that
      # is a ~3m40s cold compile of all third-party crates (run 35036001734,
      # 2026-09-15). Same restore-only contract as Verify Paperclip Runner.

      # rust-cache hashes its absolute cache paths into the entry's version,
      # and GitHub only serves an entry whose key and version both match. The
      # target directory sits under the checkout, and the checkout root
      # differs by runner: /home/runner/_work on the RunsOn fleets that write
      # this cache against /home/runner/work on GitHub-hosted runners. Every
      # key input agreed, yet all 25 completed pull requests on 2026-09-28
      # logged "No cache found" (run 36424309181) and cold-compiled every
      # crate for ~4 minutes in four lanes. Point rust-cache at the same
      # directory through a checkout-independent path so both layouts hash
      # the same version. Keep this block identical in both workflows: the
      # reader and the writer must agree or the version matches nothing.
      - name: Pin the Runner Rust workspace path
        id: runner_rust_workspace
        run: |
          set -euo pipefail
          pinned="$HOME/paperclip-runner-rust"
          # A symlink here is removed as a link, never followed into the checkout.
          rm -rf "$pinned"
          ln -s "$GITHUB_WORKSPACE/packages/paperclip-runner/runner" "$pinned"
          echo "path=$pinned" >> "$GITHUB_OUTPUT"

      - name: Select the pinned Runner Rust toolchain
        working-directory: packages/paperclip-runner
        run: |
          set -uo pipefail

          # release-verify.yml runs on a single post-merge fleet image; the
          # gate here can route to ubuntu-latest or the public PR fleet, so
          # this tolerates an image without rustup instead of failing every
          # pull request. Without the pin the cache key simply will not match.
          if ! command -v rustup >/dev/null 2>&1; then
            echo '::notice title=Runner Rust cache::rustup is unavailable; building with the image default toolchain'
            exit 0
          fi

          rustup show
          toolchain="$(rustup show active-toolchain | awk '{print $1}')"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

          # rust-cache hashes every installed toolchain into the cache key, not
          # only the active one. Each runner image also ships its own stable
          # Rust, and those disagree across images: 1.98.0 on the RunsOn fleets
          # against 1.98.1 on ubuntu-latest. Two runners that agreed on the pin
          # therefore still computed different keys, and every GitHub-hosted
          # pull request missed this cache while the fleet hit it. Remove every
          # toolchain except the pin, so the key depends on the pinned compiler
          # and the lockfile alone rather than on what the image happens to
          # carry. Keep this block identical in both workflows: the reader and
          # the writer must agree or the key matches nothing.
          extra_toolchains="$(rustup toolchain list | awk '{print $1}' | grep -vx "$toolchain" || true)"
          if [ -n "$extra_toolchains" ]; then
            echo "$extra_toolchains" | xargs -n1 rustup toolchain uninstall \
              || echo '::notice title=Runner Rust cache::could not remove an extra toolchain; the cache key may not match'
          fi
          rustup toolchain list

      - name: Restore Runner Rust dependencies (read only)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ steps.runner_rust_workspace.outputs.path }} -> target
          shared-key: release-runner-v2
          # Mirror the master writer: these also feed the cache key.
          cache-workspace-crates: false
          cache-bin: false
          # Restore only. Never let a pull request evict master's entry.
          save-if: false

      # The Runner's own crate is the one thing the entry above leaves out:
      # rust-cache drops workspace crates when it saves, and a fresh checkout
      # would invalidate cargo's mtime fingerprints for them anyway. So this
      # job compiled paperclip-runner-core in release mode on every run,
      # 28-49s (runs 38169436532 to 38183149920, 2026-10-11), while 221 of
      # the 239 master commits of the preceding week left its inputs alone.
      # The master Rust lane in release-verify.yml saves that crate's release
      # artifacts (about 70 MB) under a key made from the compiler, the
      # checkout root and a hash of every input the build reads. A pull
      # request whose merge tree carries byte-identical inputs restores them
      # and marks them newer than the checkout, so cargo keeps them; any
      # other pull request misses and compiles exactly as before. Exact key
      # only: a prefix match would hand cargo another revision's output. The
      # path list and the key live in scripts/runner-release-crate-cache.mjs
      # and must match the writer's; a guard test holds them together.
      - name: Compute the Runner release crate cache key
        id: runner_release_crate_key
        run: echo "scope=$(node scripts/runner-release-crate-cache.mjs scope)" >> "$GITHUB_OUTPUT"

      - name: Restore the Runner release crate (read only)
        id: runner_release_crate
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/paperclip-runner/runner/target/release/.fingerprint/paperclip-runner-core-*
            packages/paperclip-runner/runner/target/release/deps/libpaperclip_runner_core-*
            packages/paperclip-runner/runner/target/release/deps/paperclip_runner_core-*.d
            packages/paperclip-runner/runner/target/release/deps/paperclip_runnerd-*
            packages/paperclip-runner/runner/target/release/paperclip-runnerd
            packages/paperclip-runner/runner/target/release/paperclip-runnerd.d
          key: runner-release-crate-v1-${{ steps.runner_release_crate_key.outputs.scope }}-${{ hashFiles('packages/paperclip-runner/rust-toolchain.toml', 'packages/paperclip-runner/runner/Cargo.toml', 'packages/paperclip-runner/runner/Cargo.lock', 'packages/paperclip-runner/runner/crates/**', 'packages/paperclip-runner/protocol/**', 'packages/paperclip-runner/test-fixtures/**', 'packages/paperclip-runner/test/fixtures/**', 'tests/runner-e2e/fixtures/**') }}

      - name: Mark the restored Runner release crate current
        if: ${{ steps.runner_release_crate.outputs.cache-hit == 'true' }}
        run: node scripts/runner-release-crate-cache.mjs mark-current

      - name: Typecheck workspaces whose build scripts skip TypeScript
        run: pnpm run typecheck:build-gaps

      - name: Verify release registry test coverage
        run: pnpm run test:release-registry

      - name: Upload CI profile timings
        continue-on-error: true
        if: always() && env.PAPERCLIP_CI_PROFILE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-profile-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: .ci-profile/*.ndjson
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  general_tests:
    name: General tests (${{ matrix.group_label }})
    needs: [gate]
    if: ${{ needs.gate.outputs.full_ci == 'true' }}
    runs-on: ${{ needs.gate.outputs.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep twelve duration-balanced server shards. Each shard overlaps
          # at most two isolated fork workers; cases within a file stay serial.
          # The chat fixture keeps three independent database-backed shards.
          - group: general-server-without-chat
            group_label: server (1/12)
            shard_index: 0
            shard_count: 12
          - group: general-server-without-chat
            group_label: server (2/12)
            shard_index: 1
            shard_count: 12
          - group: general-server-without-chat
            group_label: server (3/12)
            shard_index: 2
            shard_count: 12
          - group: general-server-without-chat
            group_label: server (4/12)
            shard_index: 3
            shard_count: 12
          - group: general-server-without-chat
            group_label: server (5/12)
            shard_index: 4
            shard_count: 12
          - group: general-server-without-chat
            group_label: server (6/12)
            shard_index: 5
            shard_count: 12
          - group: general-server-without-chat
            group_label: server (7/12)
            shard_index: 6
            shard_count: 12
          - group: general-server-without-chat
            group_label: server (8/12)
            shard_index: 7
            shard_count: 12
          - group: general-server-without-chat
            group_label: server (9/12)
            shard_index: 8
            shard_count: 12
          - group: general-server-without-chat
            group_label: server (10/12)
            shard_index: 9
            shard_count: 12
          - group: general-server-without-chat
            group_label: server (11/12)
            shard_index: 10
            shard_count: 12
          - group: general-server-without-chat
            group_label: server (12/12)
            shard_index: 11
            shard_count: 12
          - group: general-chat
            group_label: chat (1/3)
            shard_index: 0
            shard_count: 3
          - group: general-chat
            group_label: chat (2/3)
            shard_index: 1
            shard_count: 3
          - group: general-chat
            group_label: chat (3/3)
            shard_index: 2
            shard_count: 3
          # workspaces-a was the slowest check in the fully-green PR run
          # 31371439296 (2026-08-10) at 319s, with the ui project's single
          # vitest invocation accounting for ~224s and the paperclipai CLI
          # ~37s. Two shards use Vitest's native --shard on each project's
          # file list (ui: 439 files, cli: 54), bringing each job to roughly
          # half the suite time (~130s + setup) without a duration manifest.
          - group: general-workspaces-a
            group_label: workspaces-a (1/2)
            shard_index: 0
            shard_count: 2
          - group: general-workspaces-a
            group_label: workspaces-a (2/2)
            shard_index: 1
            shard_count: 2
          # workspaces-b became the slowest check (499-593s) once the server
          # shards were rebalanced: the db project alone was 168-250s of its
          # 436-513s of vitest time (PR runs 38084171761, 38083084276 and
          # 38083020834, 2026-10-10). The db project now runs as its own
          # workspaces-c lane; the rest of workspaces-b is ~265-275s of
          # vitest time, so both jobs land near 300-350s with setup.
          - group: general-workspaces-b
            group_label: workspaces-b
          - group: general-workspaces-c
            group_label: workspaces-c

    env:
      PAPERCLIP_CI_PROFILE: ${{ needs.gate.outputs.profile_ci }}
      PAPERCLIP_CI_PROFILE_JOB: General tests (${{ matrix.group_label }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CI profile
        continue-on-error: true
        if: env.PAPERCLIP_CI_PROFILE == 'true'
        run: node scripts/ci-profile/initialize.mjs

      - name: Setup Node.js for pnpm bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
        with:
          version: 9.15.4

      # Share the checked-in lockfile key with master. PR merge refs must not
      # save full copies of the store or evict the post-merge build caches.
      - name: Restore materialized dependencies and shared builds
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') != ''
        uses: ./.github/actions/setup-ci-dependencies

      - name: Locate pnpm store
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        id: pnpm_store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "arch=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.pnpm_store.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-cache-${{ runner.os }}-${{ steps.pnpm_store.outputs.arch }}-pnpm-

      - name: Install dependencies
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        # Manifest-changing and stacked PRs can hold a pnpm-lock.yaml that is
        # stale for the merge tree. Resolve it inline instead of waiting on a
        # policy-job artifact: that dependency put the policy job's queue and
        # runtime (~60s) on every lane's critical path, and policy still
        # validates resolution as a required check in parallel.
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo '::notice title=Lockfile::checked-in lockfile is stale for this merge tree; resolving it inline'
            pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
            pnpm install --frozen-lockfile
          fi

      - name: Run grouped general test suites
        run: |
          if [ -n "${{ matrix.shard_count }}" ]; then
            pnpm test:run:general -- --group '${{ matrix.group }}' \
              --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}
          else
            pnpm test:run:general -- --group '${{ matrix.group }}'
          fi

      - name: Upload CI profile timings
        continue-on-error: true
        if: always() && env.PAPERCLIP_CI_PROFILE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-profile-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: .ci-profile/*.ndjson
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  docker_context_integrity:
    name: Docker context integrity
    needs: gate
    if: ${{ needs.gate.outputs.full_ci == 'true' }}
    runs-on: ${{ needs.gate.outputs.runner }}
    timeout-minutes: 15

    env:
      PAPERCLIP_CI_PROFILE: ${{ needs.gate.outputs.profile_ci }}
      PAPERCLIP_CI_PROFILE_JOB: Docker context integrity

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Not every runner the gate can select ships the Buildx plugin —
      # the image-build workflows set it up explicitly, so this lane does
      # too rather than failing before it checks anything.
      - name: Initialize CI profile
        continue-on-error: true
        if: env.PAPERCLIP_CI_PROFILE == 'true'
        run: node scripts/ci-profile/initialize.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2
        with:
          version: v5.5.1

      - name: Verify Compose signing secret forwarding
        run: node --test scripts/docker-compose-secrets.test.mjs

      # Same .dockerignore semantics as the real image builds: a
      # context-slimming change that strips a committed build input must
      # fail here, on the pull request, instead of failing every
      # post-merge image build. (2026-09-04: a new **/*.md ignore rule
      # stripped the committed capability contract out of the context;
      # every Docker build on master failed its drift check and no cloud
      # image published for eight hours while PR CI stayed green.)
      - name: Run generated-file drift checks against the Docker build context
        run: docker buildx build --file .github/docker-context-checks.Dockerfile .

      - name: Upload CI profile timings
        continue-on-error: true
        if: always() && env.PAPERCLIP_CI_PROFILE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-profile-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
