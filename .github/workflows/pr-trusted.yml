          status="$RUNNER_TEMP/public-install-npm-cache.status"
          if [ -f "$RUNNER_TEMP/public-install-npm-cache.log" ]; then
            # Normally finished long before this; never let it hold the lane.
            for _ in $(seq 180); do [ -f "$status" ] && break; sleep 1; done
            if [ "$(cat "$status" 2>/dev/null)" = 0 ]; then
              tail -n 1 "$RUNNER_TEMP/public-install-npm-cache.log"
            else
              echo '::notice title=Public-install npm cache::warm-up did not finish cleanly; the verifier fetches what is missing'
              tail -n 20 "$RUNNER_TEMP/public-install-npm-cache.log"
            fi
            export PAPERCLIP_PUBLIC_INSTALL_NPM_CACHE="$RUNNER_TEMP/public-install-npm-cache"
          fi
          node scripts/verify-grok-npm-install.mjs

      - name: Upload CI profile timings
        continue-on-error: true
        if: always() && env.PAPERCLIP_CI_PROFILE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-profile-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: .ci-profile/*.ndjson
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  verify_serialized_server:
    name: Verify serialized server suites (${{ matrix.shard_label }})
    needs: [gate]
    if: ${{ needs.gate.outputs.full_ci == 'true' }}
    runs-on: ${{ needs.gate.outputs.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shards are balanced by recorded duration
          # (scripts/serialized-shard-durations.json, refreshed 2026-09-12);
          # round-robin used to cluster the heavy suites on one runner (291s
          # vs 170-201s in run 32012408876, 2026-08-17). The suite total has
          # since grown to ~1926s recorded: five shards ran ~390s of tests
          # each while the rebalanced general/e2e lanes run ~210-260s, so
          # nine shards level this lane to ~214s and keep it off the
          # critical path.
          - shard_index: 0
            shard_count: 9
            shard_label: 1/9
          - shard_index: 1
            shard_count: 9
            shard_label: 2/9
          - shard_index: 2
            shard_count: 9
            shard_label: 3/9
          - shard_index: 3
            shard_count: 9
            shard_label: 4/9
          - shard_index: 4
            shard_count: 9
            shard_label: 5/9
          - shard_index: 5
            shard_count: 9
            shard_label: 6/9
          - shard_index: 6
            shard_count: 9
            shard_label: 7/9
          - shard_index: 7
            shard_count: 9
            shard_label: 8/9
          - shard_index: 8
            shard_count: 9
            shard_label: 9/9

    env:
      PAPERCLIP_CI_PROFILE: ${{ needs.gate.outputs.profile_ci }}
      PAPERCLIP_CI_PROFILE_JOB: Verify serialized server suites (${{ matrix.shard_label }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CI profile
        continue-on-error: true
        if: env.PAPERCLIP_CI_PROFILE == 'true'
        run: node scripts/ci-profile/initialize.mjs

      - name: Setup Node.js for pnpm bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
        with:
          version: 9.15.4

      # Share the checked-in lockfile key with master. PR merge refs must not
      # save full copies of the store or evict the post-merge build caches.
      - name: Restore materialized dependencies and shared builds
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') != ''
        uses: ./.github/actions/setup-ci-dependencies

      - name: Locate pnpm store
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        id: pnpm_store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "arch=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.pnpm_store.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-cache-${{ runner.os }}-${{ steps.pnpm_store.outputs.arch }}-pnpm-

      - name: Install dependencies
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        # Manifest-changing and stacked PRs can hold a pnpm-lock.yaml that is
        # stale for the merge tree. Resolve it inline instead of waiting on a
        # policy-job artifact: that dependency put the policy job's queue and
        # runtime (~60s) on every lane's critical path, and policy still
        # validates resolution as a required check in parallel.
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo '::notice title=Lockfile::checked-in lockfile is stale for this merge tree; resolving it inline'
            pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
            pnpm install --frozen-lockfile
          fi

      - name: Run serialized server test shard
        run: pnpm test:run:serialized -- --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}

      - name: Upload CI profile timings
        continue-on-error: true
        if: always() && env.PAPERCLIP_CI_PROFILE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-profile-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: .ci-profile/*.ndjson
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  canary_dry_run:
    name: Canary Dry Run
    needs: [gate]
    if: ${{ needs.gate.outputs.full_ci == 'true' }}
    runs-on: ${{ needs.gate.outputs.runner }}
    timeout-minutes: 20

    env:
      PAPERCLIP_CI_PROFILE: ${{ needs.gate.outputs.profile_ci }}
      PAPERCLIP_CI_PROFILE_JOB: Canary Dry Run

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CI profile
        continue-on-error: true
        if: env.PAPERCLIP_CI_PROFILE == 'true'
        run: node scripts/ci-profile/initialize.mjs

      - name: Setup Node.js for pnpm bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
        with:
          version: 9.15.4

      # Share the checked-in lockfile key with master. PR merge refs must not
      # save full copies of the store or evict the post-merge build caches.
      - name: Restore materialized dependencies and shared builds
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') != ''
        uses: ./.github/actions/setup-ci-dependencies

      - name: Locate pnpm store
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        id: pnpm_store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "arch=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.pnpm_store.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-cache-${{ runner.os }}-${{ steps.pnpm_store.outputs.arch }}-pnpm-

      - name: Install dependencies
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        # Manifest-changing and stacked PRs can hold a pnpm-lock.yaml that is
        # stale for the merge tree. Resolve it inline instead of waiting on a
        # policy-job artifact: that dependency put the policy job's queue and
        # runtime (~60s) on every lane's critical path, and policy still
        # validates resolution as a required check in parallel.
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo '::notice title=Lockfile::checked-in lockfile is stale for this merge tree; resolving it inline'
            pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
            pnpm install --frozen-lockfile
          fi

      # release.sh's Step 2/7 workspace build reaches the Runner package's
      # build:binary step; without the shared Rust cache that is a ~3m40s cold
      # compile of all third-party crates (run 35036001734, 2026-09-15). Same
      # restore-only contract as Verify Paperclip Runner.

      # rust-cache hashes its absolute cache paths into the entry's version,
      # and GitHub only serves an entry whose key and version both match. The
      # target directory sits under the checkout, and the checkout root
      # differs by runner: /home/runner/_work on the RunsOn fleets that write
      # this cache against /home/runner/work on GitHub-hosted runners. Every
      # key input agreed, yet all 25 completed pull requests on 2026-09-28
      # logged "No cache found" (run 36424309181) and cold-compiled every
      # crate for ~4 minutes in four lanes. Point rust-cache at the same
      # directory through a checkout-independent path so both layouts hash
      # the same version. Keep this block identical in both workflows: the
      # reader and the writer must agree or the version matches nothing.
      - name: Pin the Runner Rust workspace path
        id: runner_rust_workspace
        run: |
          set -euo pipefail
          pinned="$HOME/paperclip-runner-rust"
          # A symlink here is removed as a link, never followed into the checkout.
          rm -rf "$pinned"
          ln -s "$GITHUB_WORKSPACE/packages/paperclip-runner/runner" "$pinned"
          echo "path=$pinned" >> "$GITHUB_OUTPUT"

      - name: Select the pinned Runner Rust toolchain
        working-directory: packages/paperclip-runner
        run: |
          set -uo pipefail

          # release-verify.yml runs on a single post-merge fleet image; the
          # gate here can route to ubuntu-latest or the public PR fleet, so
          # this tolerates an image without rustup instead of failing every
          # pull request. Without the pin the cache key simply will not match.
          if ! command -v rustup >/dev/null 2>&1; then
            echo '::notice title=Runner Rust cache::rustup is unavailable; building with the image default toolchain'
            exit 0
          fi

          rustup show
          toolchain="$(rustup show active-toolchain | awk '{print $1}')"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

          # rust-cache hashes every installed toolchain into the cache key, not
          # only the active one. Each runner image also ships its own stable
          # Rust, and those disagree across images: 1.98.0 on the RunsOn fleets
          # against 1.98.1 on ubuntu-latest. Two runners that agreed on the pin
          # therefore still computed different keys, and every GitHub-hosted
          # pull request missed this cache while the fleet hit it. Remove every
          # toolchain except the pin, so the key depends on the pinned compiler
          # and the lockfile alone rather than on what the image happens to
          # carry. Keep this block identical in both workflows: the reader and
          # the writer must agree or the key matches nothing.
          extra_toolchains="$(rustup toolchain list | awk '{print $1}' | grep -vx "$toolchain" || true)"
          if [ -n "$extra_toolchains" ]; then
            echo "$extra_toolchains" | xargs -n1 rustup toolchain uninstall \
              || echo '::notice title=Runner Rust cache::could not remove an extra toolchain; the cache key may not match'
          fi
          rustup toolchain list

      - name: Restore Runner Rust dependencies (read only)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ steps.runner_rust_workspace.outputs.path }} -> target
          shared-key: release-runner-v2
          # Mirror the master writer: these also feed the cache key.
          cache-workspace-crates: false
          cache-bin: false
          # Restore only. Never let a pull request evict master's entry.
          save-if: false

      # The Runner's own crate is the one thing the entry above leaves out:
      # rust-cache drops workspace crates when it saves, and a fresh checkout
      # would invalidate cargo's mtime fingerprints for them anyway. So this
      # job compiled paperclip-runner-core in release mode on every run,
      # 28-49s (runs 38169436532 to 38183149920, 2026-10-11), while 221 of
      # the 239 master commits of the preceding week left its inputs alone.
      # The master Rust lane in release-verify.yml saves that crate's release
      # artifacts (about 70 MB) under a key made from the compiler, the
      # checkout root and a hash of every input the build reads. A pull
      # request whose merge tree carries byte-identical inputs restores them
      # and marks them newer than the checkout, so cargo keeps them; any
      # other pull request misses and compiles exactly as before. Exact key
      # only: a prefix match would hand cargo another revision's output. The
      # path list and the key live in scripts/runner-release-crate-cache.mjs
      # and must match the writer's; a guard test holds them together.
      - name: Compute the Runner release crate cache key
        id: runner_release_crate_key
        run: echo "scope=$(node scripts/runner-release-crate-cache.mjs scope)" >> "$GITHUB_OUTPUT"

      - name: Restore the Runner release crate (read only)
        id: runner_release_crate
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/paperclip-runner/runner/target/release/.fingerprint/paperclip-runner-core-*
            packages/paperclip-runner/runner/target/release/deps/libpaperclip_runner_core-*
            packages/paperclip-runner/runner/target/release/deps/paperclip_runner_core-*.d
            packages/paperclip-runner/runner/target/release/deps/paperclip_runnerd-*
            packages/paperclip-runner/runner/target/release/paperclip-runnerd
            packages/paperclip-runner/runner/target/release/paperclip-runnerd.d
          key: runner-release-crate-v1-${{ steps.runner_release_crate_key.outputs.scope }}-${{ hashFiles('packages/paperclip-runner/rust-toolchain.toml', 'packages/paperclip-runner/runner/Cargo.toml', 'packages/paperclip-runner/runner/Cargo.lock', 'packages/paperclip-runner/runner/crates/**', 'packages/paperclip-runner/protocol/**', 'packages/paperclip-runner/test-fixtures/**', 'packages/paperclip-runner/test/fixtures/**', 'tests/runner-e2e/fixtures/**') }}

      - name: Mark the restored Runner release crate current
        if: ${{ steps.runner_release_crate.outputs.cache-hit == 'true' }}
        run: node scripts/runner-release-crate-cache.mjs mark-current

      # `release.sh` always executes its Step 2/7 workspace build, even when
      # `--skip-verify` bypasses the initial verification gate. release.sh
      # also requires a clean working tree, and the install step may have
      # resolved a stale lockfile in place (manifest-changing or stacked
      # PRs), so stage any changed lockfile into an ephemeral local commit:
      # release.sh then sees a clean tree and its workspace build sees a
      # lockfile that matches the manifests.
      - name: Release canary dry run via release.sh internal build
        run: |
          git checkout -B master HEAD
          if git diff --quiet pnpm-lock.yaml; then
            git checkout -- pnpm-lock.yaml
          else
            git add pnpm-lock.yaml
            git -c user.email=ci@paperclip.local -c user.name=CI \
              commit --no-verify -m "ci(canary): stage regenerated lockfile"
          fi
          ./scripts/release.sh canary --skip-verify --dry-run

      # The clean public npm install verification for the built-in Grok
      # provider used to run here, after the dry run. It only needs `pnpm
      # build` output, which the Build lane also produces, so it moved there:
      # see "Verify built-in Grok from a clean public npm install" in `build`.

      - name: Upload CI profile timings
        continue-on-error: true
        if: always() && env.PAPERCLIP_CI_PROFILE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-profile-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: .ci-profile/*.ndjson
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  e2e_shards:
    name: e2e shard (${{ matrix.shard_label }})
    needs: [gate]
    if: ${{ needs.gate.outputs.full_ci == 'true' }}
    runs-on: ${{ needs.gate.outputs.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Playwright lane is pinned to workers=1 (tests/e2e/playwright.config.ts)
          # because every spec shares one throwaway server and some toggle
          # instance-level flags, so it can only be parallelized across runners.
          # Each shard boots its own server, which keeps that isolation intact.
          # The catalog has grown to ~1694s of serial spec time (mean of runs
          # 35036001734 and 35024948947, 2026-09-15): with three shards and
          # stale durations the worst shard ran 745s of specs while the best
          # ran 277s. The former floors — chat-adapters-ui at ~442s and
          # agent-chat at ~310s — are each split into two specs, so eight
          # shards with refreshed durations level to ~212s each; the heaviest
          # remaining single spec is chat-adapters-ui-messaging at ~242s.
          - shard_index: 0
            shard_count: 8
            shard_label: 1/8
          - shard_index: 1
            shard_count: 8
            shard_label: 2/8
          - shard_index: 2
            shard_count: 8
            shard_label: 3/8
          - shard_index: 3
            shard_count: 8
            shard_label: 4/8
          - shard_index: 4
            shard_count: 8
            shard_label: 5/8
          - shard_index: 5
            shard_count: 8
            shard_label: 6/8
          - shard_index: 6
            shard_count: 8
            shard_label: 7/8
          - shard_index: 7
            shard_count: 8
            shard_label: 8/8

    env:
      PAPERCLIP_CI_PROFILE: ${{ needs.gate.outputs.profile_ci }}
      PAPERCLIP_CI_PROFILE_JOB: e2e shard (${{ matrix.shard_label }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CI profile
        continue-on-error: true
        if: env.PAPERCLIP_CI_PROFILE == 'true'
        run: node scripts/ci-profile/initialize.mjs

      - name: Setup Node.js for pnpm bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
        with:
          version: 9.15.4

      # Share the checked-in lockfile key with master. PR merge refs must not
      # save full copies of the store or evict the post-merge build caches.
      - name: Restore materialized dependencies and shared builds
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') != ''
        uses: ./.github/actions/setup-ci-dependencies

      - name: Locate pnpm store
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        id: pnpm_store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "arch=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.pnpm_store.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-cache-${{ runner.os }}-${{ steps.pnpm_store.outputs.arch }}-pnpm-

      - name: Install dependencies
        if: hashFiles('.github/actions/setup-ci-dependencies/action.yml') == ''
        # Manifest-changing and stacked PRs can hold a pnpm-lock.yaml that is
        # stale for the merge tree. Resolve it inline instead of waiting on a
        # policy-job artifact: that dependency put the policy job's queue and
        # runtime (~60s) on every lane's critical path, and policy still
        # validates resolution as a required check in parallel.
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo '::notice title=Lockfile::checked-in lockfile is stale for this merge tree; resolving it inline'
            pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
            pnpm install --frozen-lockfile
          fi

      - name: Verify runner Chrome
        # GitHub's Ubuntu runner image already ships Google Chrome, so use that
        # directly for the headless e2e lane instead of downloading Playwright
        # browser bundles inside the 30 minute job budget.
        run: google-chrome --version

      - name: Generate Paperclip config
        run: |
          mkdir -p ~/.paperclip/instances/default
          cat > ~/.paperclip/instances/default/config.json << 'CONF'
          {
            "$meta": { "version": 1, "updatedAt": "2026-01-01T00:00:00.000Z", "source": "onboard" },
            "database": { "mode": "embedded-postgres" },
            "logging": { "mode": "file" },
            "server": { "deploymentMode": "local_trusted", "host": "127.0.0.1", "port": 3100 },
            "auth": { "baseUrlMode": "auto" },
            "storage": { "provider": "local_disk" },
            "secrets": { "provider": "local_encrypted", "strictMode": false }
          }
          CONF

      - name: Run e2e tests
        env:
          PAPERCLIP_E2E_SKIP_LLM: "true"
          PAPERCLIP_PLAYWRIGHT_CHANNEL: "chrome"
        run: |
          # Playwright's own --shard balances by test count, and one spec
          # (smoke-lab) is ~40% of the lane's wall clock. Partition by recorded
          # spec duration instead so both runners finish together.
          specs="$(node ./scripts/e2e-shard.mjs \
            --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }})"
          echo "shard ${{ matrix.shard_label }} specs: $specs"
          # specs is an intentional argument list.
          # shellcheck disable=SC2086
          pnpm run test:e2e $specs

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard_index }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14

      - name: Upload CI profile timings
        continue-on-error: true
        if: always() && env.PAPERCLIP_CI_PROFILE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-profile-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: .ci-profile/*.ndjson
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  e2e:
    # Preserve the legacy required-check name while the specs run sharded
    # across the matrix above (same pattern as the `verify` aggregate).
    name: e2e
    if: ${{ always() }}
    needs: [gate, policy, e2e_shards]
    runs-on: ${{ needs.gate.outputs.runner }}
    timeout-minutes: 5

    steps:
      - name: Fail if any e2e shard failed
        env:
          FULL_CI: ${{ needs.gate.outputs.full_ci }}
          POLICY_RESULT: ${{ needs.policy.result }}
          E2E_SHARDS_RESULT: ${{ needs.e2e_shards.result }}
        run: |
          test "$POLICY_RESULT" = "success"
          case "$FULL_CI" in
            true) test "$E2E_SHARDS_RESULT" = "success" ;;
            false) test "$E2E_SHARDS_RESULT" = "skipped" ;;
            *)
              echo "Invalid full_ci decision: $FULL_CI" >&2
              exit 1
              ;;
          esac
