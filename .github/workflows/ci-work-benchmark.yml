name: CI work benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/actions/setup-ci-dependencies/**
      - .github/workflows/ci-work-benchmark.yml
      - scripts/ci-dependency-cache.mjs
      - .github/workflows/pr-trusted.yml
      - .github/workflows/release-verify.yml
      - scripts/runner-debug-crate-cache.mjs
      - scripts/benchmark-ci-work.mjs
      - scripts/run-vitest-stable.mjs
      - server/src/__tests__/setup-supertest.ts
      - server/src/__tests__/workspace-runtime.test.ts
      - server/src/services/workspace-git-snapshot-streaming.test.ts

permissions:
  contents: read

concurrency:
  group: ci-work-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  paired:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'profile-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'profile-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: candidate
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false

      - name: Select changed server test work
        id: test_scope
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD -- \
            scripts/benchmark-ci-work.mjs \
            scripts/run-vitest-stable.mjs \
            server/src/__tests__/setup-supertest.ts \
            server/src/__tests__/workspace-runtime.test.ts \
            server/src/services/workspace-git-snapshot-streaming.test.ts)
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
          run_install: false

      - name: Start cold setup measurement
        run: echo "CI_COLD_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Qualify candidate dependency setup
        uses: ./candidate/.github/actions/setup-ci-dependencies
        with:
          working-directory: candidate
          restore-cache: 'false'

      - name: Record cold setup and compute qualification keys
        id: qualification
        run: |
          echo "CI_COLD_SECONDS=$(($(date +%s) - CI_COLD_STARTED))" >> "$GITHUB_ENV"
          node scripts/ci-dependency-cache.mjs

      - name: Save PR-scoped qualification dependencies
        if: steps.qualification.outputs.cacheable == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.qualification.outputs.dependency-key }}
          path: ${{ steps.qualification.outputs.dependency-paths }}

      - name: Save PR-scoped qualification builds
        if: steps.qualification.outputs.cacheable == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.qualification.outputs.build-key }}
          path: ${{ steps.qualification.outputs.build-paths }}

      - name: Remove materialized outputs before restore
        if: steps.qualification.outputs.cacheable == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { rmSync } from 'node:fs';
          const plan = JSON.parse(execFileSync(process.execPath, ['scripts/ci-dependency-cache.mjs'], {
            env: { ...process.env, GITHUB_OUTPUT: '' }, encoding: 'utf8',
          }));
          for (const directory of [...plan.dependencyPaths, 'packages/shared/dist', 'packages/plugins/sdk/dist']) {
            rmSync(directory, { recursive: true, force: true });
          }
          NODE
          echo "CI_WARM_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Qualify a real warm restore
        if: steps.qualification.outputs.cacheable == 'true'
        id: warm
        uses: ./candidate/.github/actions/setup-ci-dependencies
        with:
          working-directory: candidate

      - name: Verify exact cache hits and record setup comparison
        if: steps.qualification.outputs.cacheable == 'true'
        env:
          DEPS_RESTORED: ${{ steps.warm.outputs.dependencies-restored }}
          BUILDS_RESTORED: ${{ steps.warm.outputs.builds-restored }}
          OUTPUT: ${{ runner.temp }}/ci-work-benchmark
        run: |
          test "$DEPS_RESTORED" = true
          test "$BUILDS_RESTORED" = true
          mkdir -p "$OUTPUT"
          warm_seconds=$(($(date +%s) - CI_WARM_STARTED))
          printf '{"coldSeconds":%s,"warmSeconds":%s}\n' "$CI_COLD_SECONDS" "$warm_seconds" > "$OUTPUT/dependency-setup.json"
          echo "Dependency setup: ${CI_COLD_SECONDS}s cold, ${warm_seconds}s with exact materialized restores." >> "$GITHUB_STEP_SUMMARY"

      - name: Explain disabled materialized reuse
        if: steps.qualification.outputs.cacheable != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-work-benchmark"
          echo "Materialized dependency reuse is disabled by an unmodelled install hook. Retaining cold setup and comparing test commands only." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare unchanged baseline
        if: steps.test_scope.outputs.run == 'true'
        run: |
          base_sha=$(git rev-parse HEAD^1)
          git worktree add --detach ../baseline "$base_sha"
          cd ../baseline
          if ! pnpm install --frozen-lockfile; then
            pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
            pnpm install --frozen-lockfile
          fi
          pnpm run preflight:workspace-links
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps

      - name: Compare complete commands and executed case inventories
        if: steps.test_scope.outputs.run == 'true'
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/ci-work-benchmark
        run: |
          node scripts/benchmark-ci-work.mjs ../baseline "$BENCHMARK_OUTPUT"
          cat "$BENCHMARK_OUTPUT/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise restored dependencies for cache-only changes
        if: steps.test_scope.outputs.run != 'true' && steps.qualification.outputs.cacheable == 'true'
        run: pnpm exec vitest run --project @paperclipai/shared

      - name: Retain timings, inventories and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-work-benchmark
          path: ${{ runner.temp }}/ci-work-benchmark
          retention-days: 14

  rust_prime:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'profile-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'profile-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Select the pinned compiler and workspace path
        id: workspace
        working-directory: packages/paperclip-runner
        run: |
          toolchain=$(rustup show active-toolchain | awk '{print $1}')
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          rustup toolchain list | awk '{print $1}' | grep -vx "$toolchain" | xargs -r -n1 rustup toolchain uninstall || true
          pinned="$HOME/paperclip-runner-rust"
          ln -s "$GITHUB_WORKSPACE/packages/paperclip-runner/runner" "$pinned"
          echo "path=$pinned" >> "$GITHUB_OUTPUT"
      - name: Qualify the dependency cache
        id: dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ steps.workspace.outputs.path }} -> target
          shared-key: qualification-${{ github.run_id }}-${{ github.run_attempt }}-${{ hashFiles('packages/paperclip-runner/runner/Cargo.toml', '.cargo/config', '.cargo/config.toml', 'packages/.cargo/config', 'packages/.cargo/config.toml', 'packages/paperclip-runner/.cargo/config', 'packages/paperclip-runner/.cargo/config.toml', 'packages/paperclip-runner/runner/.cargo/config', 'packages/paperclip-runner/runner/.cargo/config.toml') }}
          cache-workspace-crates: false
          cache-bin: false
          save-if: 'true'
      - name: Build the exact debug units
        working-directory: packages/paperclip-runner
        run: cargo build --manifest-path runner/Cargo.toml --locked --workspace --bins
      - name: Compute workspace artifact identity
        id: debug
        run: node scripts/runner-debug-crate-cache.mjs plan
      - name: Save workspace artifacts in this PR only
        id: artifacts
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: qualification-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.debug.outputs.key }}
          path: ${{ steps.debug.outputs.paths }}

  rust_restore:
    needs: rust_prime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Select the pinned compiler and workspace path
        id: workspace
        working-directory: packages/paperclip-runner
        run: |
          toolchain=$(rustup show active-toolchain | awk '{print $1}')
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          rustup toolchain list | awk '{print $1}' | grep -vx "$toolchain" | xargs -r -n1 rustup toolchain uninstall || true
          pinned="$HOME/paperclip-runner-rust"
          ln -s "$GITHUB_WORKSPACE/packages/paperclip-runner/runner" "$pinned"
          echo "path=$pinned" >> "$GITHUB_OUTPUT"
      - name: Qualify the dependency cache
        id: dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ steps.workspace.outputs.path }} -> target
          shared-key: qualification-${{ github.run_id }}-${{ github.run_attempt }}-${{ hashFiles('packages/paperclip-runner/runner/Cargo.toml', '.cargo/config', '.cargo/config.toml', 'packages/.cargo/config', 'packages/.cargo/config.toml', 'packages/paperclip-runner/.cargo/config', 'packages/paperclip-runner/.cargo/config.toml', 'packages/paperclip-runner/runner/.cargo/config', 'packages/paperclip-runner/runner/.cargo/config.toml') }}
          cache-workspace-crates: false
          cache-bin: false
          save-if: 'false'
      - name: Compute workspace artifact identity
        id: debug
        run: node scripts/runner-debug-crate-cache.mjs plan
      - name: Restore workspace artifacts in this PR only
        id: artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: qualification-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.debug.outputs.key }}
          path: ${{ steps.debug.outputs.paths }}
      - name: Verify fresh-host cache reuse
        env:
          DEPENDENCIES_HIT: ${{ steps.dependencies.outputs.cache-hit }}
          ARTIFACTS_HIT: ${{ steps.artifacts.outputs.cache-hit }}
        run: |
          test "$DEPENDENCIES_HIT" = true
          test "$ARTIFACTS_HIT" = true
          node scripts/runner-debug-crate-cache.mjs mark-current
          cd packages/paperclip-runner
          started=$(date +%s)
          cargo build --manifest-path runner/Cargo.toml --locked --workspace --bins --message-format=json > "$RUNNER_TEMP/rust-restored-build.jsonl"
          echo "Restored Rust build: $(($(date +%s) - started)) seconds." >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const artifacts = readFileSync(`${process.env.RUNNER_TEMP}/rust-restored-build.jsonl`, 'utf8')
            .trim().split('\n').map(line => JSON.parse(line)).filter(row => row.reason === 'compiler-artifact');
          if (!artifacts.length || artifacts.some(row => !row.fresh)) {
            throw new Error(`Cache hit rebuilt units: ${JSON.stringify(artifacts.filter(row => !row.fresh).map(row => row.package_id))}`);
          }
          console.log(`All ${artifacts.length} Cargo units were fresh on a new host.`);
          NODE
      - name: Retain Cargo reuse evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-cache-qualification
          path: ${{ runner.temp }}/rust-restored-build.jsonl
          retention-days: 14
