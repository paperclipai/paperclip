# Upstream sync — paperclipai/paperclip master -> our bermont overlay
#
# Weekly job that merges upstream/master into the production `bermont` branch and
# opens a PR for review. bermont carries the Bermont overlay (migration renumbering,
# CI hardenings) on top of upstream; this keeps the divergence small and reviewable
# instead of letting upstream drift for months.
#
# Lives on `master` because GitHub only runs `schedule:` triggers from the default
# branch — the job itself operates on `bermont`, not master.
#
# Idempotent: if upstream/master is already contained in bermont, the run exits
# early with no branch and no PR. On merge conflicts it aborts cleanly and fails
# the run (conflicts need a human) rather than pushing a broken tree.
#
# The PR is opened with a bermont-clawsweeper App token (NOT GITHUB_TOKEN): the
# fork's GITHUB_TOKEN cannot create PRs ("Resource not accessible by integration"),
# and App-installation tokens also trigger `pr.yml` on the PR. Requires the
# CLAWSWEEPER_APP_PRIVATE_KEY repo secret (1Password: Bermont Digital /
# "GitHub App — bermont-clawsweeper" / pem) and the App installed on this repo.
name: Upstream sync

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read # the job mints a scoped App token for its own writes

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/master into bermont
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: automation/upstream-sync
      UPSTREAM_URL: https://github.com/paperclipai/paperclip.git
      HAS_APP_KEY: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Require bermont-clawsweeper key
        if: env.HAS_APP_KEY != 'true'
        run: |
          echo "::error::CLAWSWEEPER_APP_PRIVATE_KEY is not set. This workflow opens its PR with the bermont-clawsweeper App token (GITHUB_TOKEN cannot create PRs on this fork). Provision the secret from 1Password (Bermont Digital / 'GitHub App — bermont-clawsweeper' / pem) and install the App on this repo."
          exit 1

      - name: Mint bermont-clawsweeper token (contents + PRs write)
        id: app_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: Iv23liwPWAIcc4PAk2Dt
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: valkyriweb
          repositories: paperclip
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout bermont (full history)
        uses: actions/checkout@v6
        with:
          ref: bermont
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Fetch upstream + bermont
        run: |
          set -euo pipefail
          git config user.name "bermont-clawsweeper[bot]"
          git config user.email "bermont-clawsweeper[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream master
          git fetch --no-tags origin bermont

      - name: Skip if already in sync
        id: gate
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/master origin/bermont; then
            echo "bermont already contains upstream/master — nothing to sync."
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream/master onto bermont
        id: merge
        if: steps.gate.outputs.synced == 'false'
        run: |
          set -euo pipefail
          git checkout -B "$SYNC_BRANCH" origin/bermont
          if git merge --no-edit --no-ff upstream/master; then
            echo "Merge clean."
          else
            echo "::error::Merge conflict syncing upstream/master into bermont — needs manual resolution."
            git merge --abort
            exit 1
          fi
          git push --force-with-lease origin "$SYNC_BRANCH"

      - name: Open / update sync PR
        if: steps.gate.outputs.synced == 'false'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          ahead="$(git rev-list --count origin/bermont..upstream/master)"
          body_file="$RUNNER_TEMP/sync-pr-body.md"
          {
            echo "Automated weekly merge of \`upstream/master\` (paperclipai/paperclip) into the \`bermont\` production overlay."
            echo
            echo "- Upstream commits not yet in bermont: **${ahead}**"
            echo
            echo "Review the diff for overlay-relevant changes (migrations, CI, Dockerfile), then merge to ship via the lue-kube image autobump."
          } > "$body_file"

          if gh pr view "$SYNC_BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "Existing sync PR updated via force-push."
          else
            gh pr create --base bermont --head "$SYNC_BRANCH" \
              --title "chore: sync upstream/master into bermont" \
              --body-file "$body_file"
          fi
