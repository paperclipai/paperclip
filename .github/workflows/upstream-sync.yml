# Upstream sync — paperclipai/paperclip master -> our bermont overlay
#
# Weekly job that publishes upstream/master as a PR branch against the production
# `bermont` branch. It does not attempt the merge in CI: bermont carries the
# Bermont overlay (migration renumbering, CI hardenings), so upstream updates need
# a human/agent review session that resolves conflicts deliberately.
#
# Lives on `master` because GitHub only runs `schedule:` triggers from the default
# branch — the job itself operates on `bermont`, not master.
#
# Idempotent: if upstream/master is already contained in bermont, the run exits
# early with no branch and no PR. Otherwise it force-updates an automation branch
# to upstream/master and opens/reuses a PR as the review notice.
#
# The PR is opened with a bermont-clawsweeper App token (NOT GITHUB_TOKEN): the
# fork's GITHUB_TOKEN cannot create PRs ("Resource not accessible by integration"),
# and App-installation tokens also trigger `pr.yml` on the PR. Requires the
# CLAWSWEEPER_APP_PRIVATE_KEY repo secret (1Password: Bermont Digital /
# "GitHub App — bermont-clawsweeper" / private_key) and the App installed on this
# repo.
#
# PR detection/creation go through the REST pulls API, not `gh pr create`: gh's
# create path uses the GraphQL `createPullRequest` mutation, which fails for
# GitHub App installation tokens with "Resource not accessible by integration"
# even when the token carries pull_requests:write. The REST endpoint works.
name: Upstream sync

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read # the job mints a scoped App token for its own writes

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Open upstream/master update PR for bermont
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: automation/upstream-sync
      UPSTREAM_URL: https://github.com/paperclipai/paperclip.git
      HAS_APP_KEY: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Require bermont-clawsweeper key
        if: env.HAS_APP_KEY != 'true'
        run: |
          echo "::error::CLAWSWEEPER_APP_PRIVATE_KEY is not set. This workflow opens its PR with the bermont-clawsweeper App token (GITHUB_TOKEN cannot create PRs on this fork). Provision the secret from 1Password (Bermont Digital / 'GitHub App — bermont-clawsweeper' / private_key) and install the App on this repo."
          exit 1

      - name: Mint bermont-clawsweeper token (contents + PRs write)
        id: app_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: Iv23liwPWAIcc4PAk2Dt
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: valkyriweb
          repositories: paperclip
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout bermont (full history)
        uses: actions/checkout@v6
        with:
          ref: bermont
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Fetch upstream + bermont
        run: |
          set -euo pipefail
          git config user.name "bermont-clawsweeper[bot]"
          git config user.email "bermont-clawsweeper[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream master
          git fetch --no-tags origin bermont

      - name: Skip if already in sync
        id: gate
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/master origin/bermont; then
            echo "bermont already contains upstream/master — nothing to sync."
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update upstream snapshot branch
        if: steps.gate.outputs.synced == 'false'
        run: |
          set -euo pipefail
          git checkout -B "$SYNC_BRANCH" upstream/master
          git push --force-with-lease origin "$SYNC_BRANCH"

      - name: Open / update sync PR
        if: steps.gate.outputs.synced == 'false'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          ahead="$(git rev-list --count origin/bermont..upstream/master)"
          body_file="$RUNNER_TEMP/sync-pr-body.md"
          {
            echo "Automated weekly notice that \`upstream/master\` (paperclipai/paperclip) has updates not yet incorporated into the \`bermont\` production overlay."
            echo
            echo "- Upstream commits not yet in bermont: **${ahead}**"
            echo "- This PR branch points directly at \`upstream/master\`; the workflow intentionally does not attempt to merge it."
            echo
            echo "Review the upstream diff, pull this PR into an agent session, resolve any merge conflicts deliberately, then close/replace this notice PR once the resolved update lands in \`bermont\`."
          } > "$body_file"

          # Detect an existing open PR for this head via REST. (gh's GraphQL
          # lookups can also 403 under an App token; REST is the reliable path.)
          open_count="$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?base=bermont&state=open&head=${GITHUB_REPOSITORY_OWNER}:${SYNC_BRANCH}" \
            --jq 'length')"
          if [ "${open_count:-0}" -gt 0 ]; then
            echo "Existing sync PR already open for ${SYNC_BRANCH} — updated via force-push."
            exit 0
          fi

          # Create via REST, not `gh pr create` (GraphQL createPullRequest is not
          # accessible to App installation tokens). --field body=@file reads the body.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
            --raw-field title="chore: sync upstream/master into bermont" \
            --raw-field head="$SYNC_BRANCH" \
            --raw-field base="bermont" \
            --field "body=@${body_file}"
