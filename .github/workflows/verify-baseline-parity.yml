name: Verify Baseline Parity

on:
  push:
    branches:
      - six-4584-reliability

# This workflow is intentionally evidence-only. It has no deploy, publish,
# environment, secret, database, or image-generation steps.
permissions:
  contents: read

concurrency:
  group: verify-baseline-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: async-image-jobs-implementation
            sha: 52e5452d057b760f5f041ffe1201b8992f750d85

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Run focused async image-job tests
        run: |
          pnpm run preflight:workspace-links
          pnpm exec vitest run --project @paperclipai/server server/src/__tests__/issue-attachment-routes.test.ts --pool=forks --poolOptions.forks.isolate=true
          pnpm --filter @paperclipai/mcp-server exec vitest run src/tools.test.ts

      - name: Run full suite
        run: pnpm test:run
