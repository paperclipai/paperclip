name: CI

on:
  workflow_dispatch:
    inputs:
      provision_dokploy_ci_runner:
        description: Provision or repair the private Dokploy GitHub Actions runner
        required: true
        default: false
        type: boolean
      promote_prod:
        description: Deliberately promote the exact verified candidate to paper.zenova.id
        required: false
        default: false
        type: boolean
      candidate_sha:
        description: Full SHA already verified on paper-dev (required for production)
        required: false
        default: ""
        type: string
      production_ref:
        description: Immutable production branch/ref pointing at candidate_sha
        required: false
        default: ""
        type: string
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.provision_dokploy_ci_runner != true
    runs-on: ubuntu-latest
    # The upstream-resync candidate expands the workspace test surface. Keep
    # the complete typecheck → test → build gate intact instead of letting the
    # general, workspace, and serialized test suites race a healthy staging
    # deployment.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect managed-browser image changes
        id: browser_image_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -Eq '^(Dockerfile|scripts/browser/|scripts/docker-build-test\.sh$|scripts/docker-entrypoint\.sh$|scripts/smoke/camoufox-image\.sh$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Build and smoke-test managed browser image
        if: steps.browser_image_changes.outputs.changed == 'true'
        env:
          PAPERCLIP_DOCKER_REQUIRED: "1"
        run: ./scripts/docker-build-test.sh

  provision-dokploy-ci-runner:
    # Bootstrap stays GitHub-hosted: it creates the self-hosted runner used by
    # later trusted-branch validation jobs. It is never part of a push or PR.
    if: github.event_name == 'workflow_dispatch' && inputs.provision_dokploy_ci_runner == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Provision private trusted-branch runner
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.PAPERCLIP_RUNNER_ADMIN_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/provision-dokploy-ci-runner.sh

  deploy-dev:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to dev (paper-dev.zenova.id)
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: qmA6aVJHUf_gcNjCelCay
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          compose_json=$(curl -fsS \
            -H "X-API-Key: $DOKPLOY_API_KEY" \
            "https://dokploy.zenova.id/api/compose.one?composeId=$COMPOSE_ID")
          compose_env=$(printf '%s' "$compose_json" | jq -r '.env // ""')
          if [ -z "$compose_env" ]; then
            echo "Dokploy returned an empty compose environment; refusing to overwrite it"
            exit 1
          fi
          updated_env=$(printf '%s\n' "$compose_env" | awk -v sha="$CANDIDATE_SHA" '
            BEGIN { found = 0 }
            /^PAPERCLIP_BUILD_COMMIT=/ {
              if (!found) { print "PAPERCLIP_BUILD_COMMIT=" sha; found = 1 }
              next
            }
            { print }
            END { if (!found) print "PAPERCLIP_BUILD_COMMIT=" sha }
          ')
          curl -fsS -X POST \
            -H "X-API-Key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg composeId "$COMPOSE_ID" --arg env "$updated_env" '{composeId:$composeId,env:$env}')" \
            "https://dokploy.zenova.id/api/compose.saveEnvironment" >/dev/null
          curl -sf -X POST \
            -H "X-API-Key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg composeId "$COMPOSE_ID" '{composeId:$composeId}')" \
            "https://dokploy.zenova.id/api/compose.deploy"

      - name: Verify dev rollout and immutable revision
        run: node scripts/verify-deployment.mjs --url https://paper-dev.zenova.id --commit "$GITHUB_SHA" --timeout-seconds 900 --poll-seconds 10

      - name: Notify Telegram on dev deploy success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured; skipping notification"
            exit 0
          fi
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_TITLE=$(git log -1 --pretty=%s)
          MESSAGE=$(printf '\xE2\x9C\x85 Paperclip dev deploy succeeded \xE2\x80\x94 `%s` \xE2\x80\x94 `%s`' "$COMMIT_SHA" "$COMMIT_TITLE")
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" '{chat_id: $chat_id, text: $text, parse_mode: "Markdown", disable_web_page_preview: true}')" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

      - name: Notify Telegram on dev deploy failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured; skipping notification"
            exit 0
          fi
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MESSAGE=$(printf '\xF0\x9F\x9A\xA8 Paperclip dev deploy FAILED \xE2\x80\x94 `%s` \xE2\x80\x94 check: %s' "$COMMIT_SHA" "$RUN_URL")
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" '{chat_id: $chat_id, text: $text, parse_mode: "Markdown", disable_web_page_preview: true}')" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

  deploy-prod:
    needs: verify
    runs-on: ubuntu-latest
    # Production remains a deliberate operator action. It can only run from a
    # manual dispatch that names the exact SHA already checked on staging and
    # an immutable production ref pointing at that SHA; pushes cannot trigger it.
    if: github.event_name == 'workflow_dispatch' && inputs.promote_prod == true && inputs.candidate_sha == github.sha && inputs.production_ref != ''
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production (paper.zenova.id)
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: Gh67c1zKV7MsnPo_lZiPZ
          CANDIDATE_SHA: ${{ github.sha }}
          PRODUCTION_REF: ${{ inputs.production_ref }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "X-API-Key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg composeId "$COMPOSE_ID" --arg branch "$PRODUCTION_REF" '{composeId:$composeId,customGitBranch:$branch}')" \
            "https://dokploy.zenova.id/api/compose.update" >/dev/null
          compose_json=$(curl -fsS \
            -H "X-API-Key: $DOKPLOY_API_KEY" \
            "https://dokploy.zenova.id/api/compose.one?composeId=$COMPOSE_ID")
          compose_env=$(printf '%s' "$compose_json" | jq -r '.env // ""')
          if [ -z "$compose_env" ]; then
            echo "Dokploy returned an empty compose environment; refusing to overwrite it"
            exit 1
          fi
          updated_env=$(printf '%s\n' "$compose_env" | awk -v sha="$CANDIDATE_SHA" '
            BEGIN { found = 0 }
            /^PAPERCLIP_BUILD_COMMIT=/ {
              if (!found) { print "PAPERCLIP_BUILD_COMMIT=" sha; found = 1 }
              next
            }
            { print }
            END { if (!found) print "PAPERCLIP_BUILD_COMMIT=" sha }
          ')
          curl -fsS -X POST \
            -H "X-API-Key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg composeId "$COMPOSE_ID" --arg env "$updated_env" '{composeId:$composeId,env:$env}')" \
            "https://dokploy.zenova.id/api/compose.saveEnvironment" >/dev/null
          curl -sf -X POST \
            -H "X-API-Key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg composeId "$COMPOSE_ID" '{composeId:$composeId}')" \
            "https://dokploy.zenova.id/api/compose.deploy"

      - name: Verify production rollout and immutable revision
        run: node scripts/verify-deployment.mjs --url https://paper.zenova.id --commit "$GITHUB_SHA" --timeout-seconds 900 --poll-seconds 10

      - name: Notify Telegram on prod deploy success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured; skipping notification"
            exit 0
          fi
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_TITLE=$(git log -1 --pretty=%s)
          MESSAGE=$(printf '\xE2\x9C\x85 Paperclip prod deploy succeeded \xE2\x80\x94 `%s` \xE2\x80\x94 `%s`' "$COMMIT_SHA" "$COMMIT_TITLE")
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" '{chat_id: $chat_id, text: $text, parse_mode: "Markdown", disable_web_page_preview: true}')" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

      - name: Notify Telegram on prod deploy failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured; skipping notification"
            exit 0
          fi
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MESSAGE=$(printf '\xF0\x9F\x9A\xA8 Paperclip prod deploy FAILED \xE2\x80\x94 `%s` \xE2\x80\x94 check: %s' "$COMMIT_SHA" "$RUN_URL")
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" '{chat_id: $chat_id, text: $text, parse_mode: "Markdown", disable_web_page_preview: true}')" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
