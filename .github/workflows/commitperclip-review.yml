name: commitperclip PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Always runs from base branch context — never executes PR code.
# pull_request_target gives access to secrets for untrusted fork PRs.

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout base branch (never PR code)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      # GitHub's Dependency Graph API does not support forked repositories
      # (this repo is a fork of paperclipai/paperclip), so
      # actions/dependency-review-action fails unconditionally here with
      # "Dependency review is not supported on this repository." (KEWL-4373).
      # This step reproduces the useful part of that check without the graph
      # API: it audits the base and head lockfiles independently via `pnpm
      # audit` and fails only on HIGH/CRITICAL advisories newly introduced by
      # the PR. Pre-existing advisories already on the base branch are
      # reported but do not block — they are inherited debt, not this PR's.
      - name: Dependency audit (fork-safe alternative to dependency-review-action)
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin "$BASE_SHA" "$HEAD_SHA"

          audit_ids() {
            git show "$1:pnpm-lock.yaml" > pnpm-lock.yaml
            pnpm audit --audit-level=high --json 2>/dev/null | \
              python3 -c "import json,sys; d=json.load(sys.stdin); print('\n'.join(str(a['id']) for a in d.get('advisories', {}).values()))" \
              || true
          }

          BASE_IDS="$(audit_ids "$BASE_SHA" | sort -u)"
          HEAD_IDS="$(audit_ids "$HEAD_SHA" | sort -u)"
          git checkout -- pnpm-lock.yaml

          NEW_IDS="$(comm -13 <(echo "$BASE_IDS") <(echo "$HEAD_IDS") | sed '/^$/d')"

          if [ -n "$NEW_IDS" ]; then
            echo "New HIGH/CRITICAL advisory IDs introduced by this PR:"
            echo "$NEW_IDS"
            echo "Run 'pnpm audit --audit-level=high' locally against this branch for details."
            exit 1
          fi

          BASE_COUNT="$(echo "$BASE_IDS" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "No new HIGH/CRITICAL advisories introduced by this PR."
          echo "(Base branch carries $BASE_COUNT pre-existing HIGH/CRITICAL advisories — tracked separately, not blocking.)"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Generate commitperclip token
        id: token
        run: |
          TOKEN=$(node .github/scripts/get-bot-token.mjs)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> $GITHUB_OUTPUT
        env:
          COMMITPERCLIP_KEY: ${{ secrets.COMMITPERCLIP_KEY }}

      - name: Run quality gates
        id: quality
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: node .github/scripts/run-quality-gates.mjs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}

      - name: Fail if quality gates failed
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.quality.outcome == 'failure'
        run: |
          echo "One or more quality gates failed. See commitperclip comment on the PR for details."
          exit 1
