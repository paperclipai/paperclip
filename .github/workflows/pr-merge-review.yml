name: PR merge review notification

on:
  workflow_run:
    workflows:
      - PR
      - Runner Windows
      - Sentry SDK contract
      - Docker Runner check
      - Runner image
      - commitperclip PR Review
      - Storybook Visual
      - Storybook Deploy
      - CI work benchmark
      - Incremental CI qualification
      - Backup checkpoint qualification
      - PR review API access
    types: [completed]
  # External check providers and legacy commit statuses can finish after CI.
  # GitHub has no trigger-level filter for these events, so the job condition
  # below skips them before a runner is allocated. GitHub Actions check runs
  # are covered by the workflow_run list above.
  check_run:
    types: [completed]
  status:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  notify:
    # A skipped job does not take a runner. Only events that can complete a
    # green PR state schedule the job: successful, skipped, or neutral PR
    # workflow runs, the same results from non-Actions check providers (GitHub
    # Actions app 15368 checks arrive through workflow_run), and successful
    # commit statuses. One PR push previously queued about 60 runner jobs.
    if: >-
      github.repository == 'paperclipai/paperclip' &&
      ((github.event_name == 'workflow_run' &&
        (github.event.workflow_run.event == 'pull_request' ||
          github.event.workflow_run.event == 'pull_request_target') &&
        contains(fromJSON('["success","skipped","neutral"]'), github.event.workflow_run.conclusion)) ||
      (github.event_name == 'check_run' &&
        github.event.check_run.app.id != 15368 &&
        contains(fromJSON('["success","skipped","neutral"]'), github.event.check_run.conclusion)) ||
      (github.event_name == 'status' && github.event.state == 'success'))
    # Collapse bursts for one PR head to the latest event. The notifier reads
    # the current PR state, so the newest event subsumes older ones. Job-level
    # concurrency keeps skipped events from cancelling a scheduled notifier.
    concurrency:
      group: pr-merge-review-${{ github.event.workflow_run.head_sha || github.event.check_run.head_sha || github.event.sha }}
      cancel-in-progress: true
    # Community PR CI shares the GitHub-hosted queue. A CODEOWNER's own PR run
    # is notified from the reserved AWS metadata fleet so it never waits there.
    # This job runs only the master checkout below, never PR code. Check-run
    # and status events carry no verifiable author and stay GitHub-hosted.
    runs-on: ${{ vars.AWS_CI_SHORT_JOBS_ENABLED == 'true' && vars.AWS_CI_ENABLED == 'true' && vars.AWS_CI_ROUTING_USER_IDS_SOURCE != '' && vars.AWS_CI_TRUSTED_USER_IDS == vars.AWS_CI_ROUTING_USER_IDS_SOURCE && github.repository == 'paperclipai/paperclip' && github.repository_id == '1170821064' && github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.id == 1170821064 && contains(vars.AWS_CI_ROUTING_USER_IDS, format('|{0}|', github.event.workflow_run.actor.id)) && contains(vars.AWS_CI_ROUTING_USER_IDS, format('|{0}|', github.event.workflow_run.triggering_actor.id)) && 'runs-on/fleet=paperclip-ci-routing-x64/env=public-ci' || 'ubuntu-latest' }}
    timeout-minutes: 5
    # Restrict this environment to master. Repository secrets would also be
    # available to workflows changed by an in-repository PR.
    environment: pr-merge-review
    continue-on-error: true
    steps:
      # Only the trusted default-branch commit. Never use the PR SHA, caches,
      # artifacts, dependencies, or executable files from a pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Notify the advisory review routine
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PAPERCLIP_PR_REVIEW_WEBHOOK_URL: ${{ secrets.PAPERCLIP_PR_REVIEW_WEBHOOK_URL }}
          PAPERCLIP_PR_REVIEW_WEBHOOK_TOKEN: ${{ secrets.PAPERCLIP_PR_REVIEW_WEBHOOK_TOKEN }}
        run: node .github/scripts/notify-pr-merge-review.mjs
