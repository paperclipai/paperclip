name: Windows local AI credential safety

on:
  pull_request:
    paths:
      - .github/workflows/windows-local-ai-credential.yml
      - server/package.json
      - server/src/services/local-ai-credential-file.ts
      - server/src/__tests__/local-ai-credential-file.test.ts

permissions:
  contents: read

concurrency:
  group: windows-local-ai-credential-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows credential reader
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Windows credential reader
        run: pnpm --filter @paperclipai/server exec vitest run src/__tests__/local-ai-credential-file.test.ts