name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # Call this fork's own copy of pr-trusted.yml from master so the
    # workflow runs without cross-org restrictions. The AWS-runner guard
    # inside pr-trusted.yml routes to GitHub-hosted runners when the repo
    # is not paperclipai/paperclip, which is the case for this fork.
    uses: anhermon/paperclip/.github/workflows/pr-trusted.yml@master
