# EFS-backed storage for /paperclip. Used by docs/deploy/aws-eks.md.
# The efs-ap provisioning mode creates an EFS access point that forces
# UID/GID 1000, matching the `node` user in the Paperclip image.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: paperclip-efs
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: <EFS_ID>
  directoryPerms: "700"
  uid: "1000"
  gid: "1000"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperclip-data
  namespace: paperclip
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: paperclip-efs
  resources:
    requests:
      storage: 10Gi
