# TEMPLATE: install only after the founder approves the live migration.
# The credential source and service account must be provisioned by DevOps.
[Service]
User=paperclip-svc
Group=paperclip-svc
StateDirectory=paperclip
WorkingDirectory=/opt/paperclip/app
ExecStart=
ExecStart=/usr/bin/node /opt/paperclip/app/server/dist/index.js
LoadCredential=database-url:/etc/paperclip/credentials/service.url
Environment=PAPERCLIP_DATABASE_URL_FILE=%d/database-url
Environment=PAPERCLIP_HOME=/var/lib/paperclip
Environment=PAPERCLIP_CONFIG=/var/lib/paperclip/instances/default/config.json
