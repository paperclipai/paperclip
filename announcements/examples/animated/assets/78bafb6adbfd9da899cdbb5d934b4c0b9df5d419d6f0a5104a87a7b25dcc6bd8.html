<!doctype html>
<html><head><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,sans-serif;background:#14171c;color:#e9edf2;display:grid;place-items:center}
.scene{position:relative;width:100%;height:100%;min-height:90px;background:radial-gradient(ellipse at 50% 120%,#403762 0%,transparent 68%),linear-gradient(110deg,#181c22,#20242c)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:20px 20px}
.label{position:absolute;top:12%;left:7%;font-size:9px;letter-spacing:2px;color:#a9b0bf}.spark{display:inline-block;width:5px;height:5px;border-radius:50%;background:#ac9af7;margin-right:6px;box-shadow:0 0 10px #ac9af7}
.flow{position:absolute;inset:38% 7% 16%;display:flex;align-items:center;justify-content:space-between;gap:12px}.track{position:absolute;left:10%;right:10%;top:50%;height:1px;background:#505167}.packet{position:absolute;top:-2px;width:5px;height:5px;border-radius:50%;background:#c4b5fd;box-shadow:0 0 9px #b7a0fc;animation:travel 4.8s linear infinite}
.node{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;width:29%;height:42px;border:1px solid #4b4b60;border-radius:10px;background:#262834;box-shadow:0 4px 12px #0003;font-size:11px;font-weight:500;animation:breathe 4.8s ease-in-out infinite}.node:nth-of-type(3){animation-delay:1.6s}.node:nth-of-type(4){animation-delay:3.2s}.icon{width:15px;height:15px;fill:none;stroke:#c4b5fd;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@keyframes travel{0%{left:0;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:100%;opacity:0}}
@keyframes breathe{0%,65%,100%{transform:translateY(0);border-color:#4b4b60}15%,35%{transform:translateY(-3px);border-color:#a79ade;box-shadow:0 4px 20px #9580d52b}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style></head><body><div class="scene"><div class="grid"></div><div class="label"><span class="spark"></span>ONE IDEA. A WHOLE TEAM.</div><div class="flow"><div class="track"><div class="packet"></div></div><div class="node"><svg class="icon" viewBox="0 0 20 20"><path d="M6 8a4 4 0 1 1 8 0c0 2-2 2-2 5H8c0-3-2-3-2-5M8 16h4" /></svg>Plan</div><div class="node"><svg class="icon" viewBox="0 0 20 20"><path d="m6 6-4 4 4 4m8-8 4 4-4 4m-3-10-2 12" /></svg>Build</div><div class="node"><svg class="icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="m6 10 3 3 5-6"/></svg>Review</div></div></div></body></html>
