[package]
name = "paperclip-desktop"
version = "0.1.0"
description = "Paperclip desktop shell"
authors = ["Paperclip contributors"]
license = "Apache-2.0"
repository = "https://github.com/labz-apps/paperclip"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "paperclip_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tauri's async runtime does not re-export a timer, and the health gate polls.
# Tokio is already in the tree through Tauri, so this costs no new compile.
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
# Enabled by `tauri build`; keeps the custom protocol out of dev builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
