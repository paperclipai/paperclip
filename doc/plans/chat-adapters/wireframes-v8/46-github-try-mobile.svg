<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect x="0" y="0" width="375" height="812"/><rect x="0" y="0" width="375" height="56" rx="4" />
<text x="16" y="32" font-size="14" fill="#000" stroke="none" font-weight="600">‹  GitHub setup</text>
<text x="16" y="88" font-size="20" fill="#000" stroke="none" font-weight="700">Try Maya in GitHub</text>
<text x="16" y="116" font-size="12" fill="#666" stroke="none" >Start one task in an installed repository.</text>
<circle cx="32" cy="176" r="14" fill="#000"/>
<text x="32" y="181" font-size="12" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="56" y="181" font-size="12" fill="#000" stroke="none" >Agent selected</text>
<circle cx="32" cy="216" r="14" fill="#000"/>
<text x="32" y="221" font-size="12" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="56" y="221" font-size="12" fill="#000" stroke="none" >Connect GitHub App</text>
<circle cx="32" cy="256" r="14" fill="#fff"/>
<text x="32" y="261" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="700">3</text>
<text x="56" y="261" font-size="12" fill="#000" stroke="none" font-weight="700">Try Maya</text>
<text x="16" y="320" font-size="20" fill="#000" stroke="none" font-weight="700">Do this</text>
<circle cx="32" cy="360" r="14" fill="#fff"/>
<text x="32" y="365" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="356" font-size="12" fill="#000" stroke="none" font-weight="600">Open an issue or pull request</text>
<text x="56" y="376" font-size="12" fill="#666" stroke="none" >Use one of the repositories selected in</text>
<text x="56" y="392" font-size="12" fill="#666" stroke="none" >the customer-owned App installation.</text>
<line x1="56" y1="428" x2="359" y2="428" stroke="#e6e6e6"/>
<circle cx="32" cy="440" r="14" fill="#fff"/>
<text x="32" y="445" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="700">2</text>
<text x="56" y="436" font-size="12" fill="#000" stroke="none" font-weight="600">Mention Maya</text>
<text x="56" y="456" font-size="12" fill="#666" stroke="none" >Add a comment that directly mentions the</text>
<text x="56" y="472" font-size="12" fill="#666" stroke="none" >verified GitHub App bot.</text>
