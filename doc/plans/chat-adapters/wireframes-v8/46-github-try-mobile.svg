<text x="32" y="525" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="700">3</text>
<text x="56" y="516" font-size="12" fill="#000" stroke="none" font-weight="600">Continue the task</text>
<text x="56" y="536" font-size="12" fill="#666" stroke="none" >Add another comment in the same issue or</text>
<text x="56" y="552" font-size="12" fill="#666" stroke="none" >pull request without repeating the</text>
<text x="56" y="568" font-size="12" fill="#666" stroke="none" >mention.</text>
