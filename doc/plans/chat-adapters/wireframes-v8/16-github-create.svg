<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect x="0" y="0" width="1280" height="920"/><g data-region="global-sidebar"><text x="24" y="40" font-size="20" fill="#000" stroke="none" font-weight="700">Paperclip</text><circle cx="32" cy="72" r="6" fill="#e6e6e6"/><text x="56" y="80" font-size="14" fill="#666" stroke="none" >New Task</text>
<circle cx="32" cy="120" r="6" fill="#e6e6e6"/><text x="56" y="128" font-size="14" fill="#666" stroke="none" >Search</text>
<circle cx="32" cy="168" r="6" fill="#e6e6e6"/><text x="56" y="176" font-size="14" fill="#666" stroke="none" >Dashboard</text>
<circle cx="32" cy="216" r="6" fill="#e6e6e6"/><text x="56" y="224" font-size="14" fill="#666" stroke="none" >Inbox</text>
<circle cx="32" cy="264" r="6" fill="#e6e6e6"/><text x="56" y="272" font-size="14" fill="#666" stroke="none" >Tasks</text>
<circle cx="32" cy="312" r="6" fill="#e6e6e6"/><text x="56" y="320" font-size="14" fill="#666" stroke="none" >Projects</text>
<circle cx="32" cy="360" r="6" fill="#e6e6e6"/><text x="56" y="368" font-size="14" fill="#666" stroke="none" >Routines</text>
<circle cx="32" cy="408" r="6" fill="#e6e6e6"/><text x="56" y="416" font-size="14" fill="#666" stroke="none" >Artifacts</text>
<circle cx="32" cy="456" r="6" fill="#e6e6e6"/><text x="56" y="464" font-size="14" fill="#666" stroke="none" >Agents</text>
<circle cx="32" cy="504" r="6" fill="#e6e6e6"/><text x="56" y="512" font-size="14" fill="#666" stroke="none" >Skills</text>
<rect x="8" y="536" width="224" height="40" rx="4" fill="#e6e6e6"/><circle cx="32" cy="552" r="6" fill="#e6e6e6"/><text x="56" y="560" font-size="14" fill="#000" stroke="none" font-weight="600">Connectors</text>
<circle cx="32" cy="600" r="6" fill="#e6e6e6"/><text x="56" y="608" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="864" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="888" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="920" /></g><g data-region="topbar"><line x1="240" y1="64" x2="1280" y2="64" /><text x="264" y="40" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  GitHub  ›  Chat with an agent</text><circle cx="1240" cy="32" r="16" fill="#e6e6e6"/></g><text x="264" y="104" font-size="12" fill="#666" stroke="none" font-weight="700">SETUP</text><line x1="288" y1="152" x2="288" y2="312" /><circle cx="288" cy="152" r="16" fill="#000"/><text x="288" y="157" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text><text x="320" y="148" font-size="14" fill="#000" stroke="none" >Agent selected</text>
<circle cx="288" cy="232" r="16" fill="#fff"/><text x="288" y="237" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">2</text><text x="320" y="228" font-size="14" fill="#000" stroke="none" font-weight="700">Connect GitHub App</text>
<circle cx="288" cy="312" r="16" fill="#fff"/><text x="288" y="317" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">3</text><text x="320" y="308" font-size="14" fill="#666" stroke="none" >Try Maya</text><line x1="520" y1="64" x2="520" y2="920" /><text x="560" y="112" font-size="28" fill="#000" stroke="none" font-weight="700">Create or connect a GitHub App</text>
<text x="560" y="144" font-size="14" fill="#666" stroke="none" >Bring your own dedicated GitHub App and verify it with Paperclip.</text>
<text x="560" y="192" font-size="20" fill="#000" stroke="none" font-weight="700">Do this</text>
<circle cx="584" cy="248" r="16" fill="#fff"/>
<text x="584" y="253" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">1</text>
<text x="616" y="244" font-size="14" fill="#000" stroke="none" font-weight="600">Generate the webhook secret</text>
<text x="616" y="268" font-size="12" fill="#666" stroke="none" >Paperclip stores a random 32-byte secret and shows it once. Paste it with the</text>
<text x="616" y="284" font-size="12" fill="#666" stroke="none" >Paperclip webhook URL into GitHub and keep SSL verification enabled.</text>
<line x1="616" y1="312" x2="1224" y2="312" stroke="#e6e6e6"/>
<circle cx="584" cy="336" r="16" fill="#fff"/>
<text x="584" y="341" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">2</text>
<text x="616" y="332" font-size="14" fill="#000" stroke="none" font-weight="600">Set minimum permissions and events</text>
<text x="616" y="356" font-size="12" fill="#666" stroke="none" >Grant Metadata: read, Issues: read and write, and Pull requests: read and write.</text>
<text x="616" y="372" font-size="12" fill="#666" stroke="none" >Subscribe only to Issue comment and Pull request review comment.</text>
<line x1="616" y1="400" x2="1224" y2="400" stroke="#e6e6e6"/>
<circle cx="584" cy="424" r="16" fill="#fff"/>
<text x="584" y="429" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">3</text>
<text x="616" y="420" font-size="14" fill="#000" stroke="none" font-weight="600">Create and install the App</text>
<text x="616" y="444" font-size="12" fill="#666" stroke="none" >Choose the owning user or organization, keep user authorization off, then install</text>
<text x="616" y="460" font-size="12" fill="#666" stroke="none" >the App on only the repositories where people may mention the agent.</text>
<line x1="616" y1="488" x2="1224" y2="488" stroke="#e6e6e6"/>
<circle cx="584" cy="512" r="16" fill="#fff"/>
<text x="584" y="517" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">4</text>
<text x="616" y="508" font-size="14" fill="#000" stroke="none" font-weight="600">Return the App credentials</text>
<text x="616" y="532" font-size="12" fill="#666" stroke="none" >Paste the numeric App ID and private-key PEM into Paperclip. Connect remains</text>
<text x="616" y="548" font-size="12" fill="#666" stroke="none" >unavailable until GitHub has delivered a correctly signed webhook ping.</text>
<line x1="616" y1="576" x2="1224" y2="576" stroke="#e6e6e6"/>
<text x="560" y="600" font-size="12" fill="#666" stroke="none" font-weight="600">Paperclip webhook URL</text>
<text x="760" y="600" font-size="12" fill="#000" stroke="none" >https://paperclip.example/api/chat-webhooks/…/github</text>
<text x="560" y="640" font-size="12" fill="#666" stroke="none" font-weight="600">Webhook secret</text>
<text x="760" y="640" font-size="12" fill="#000" stroke="none" >Generated by Paperclip · shown once</text>
<text x="560" y="684" font-size="12" fill="#000" stroke="none" font-weight="600">GitHub App ID</text>
<rect x="760" y="664" width="464" height="40" rx="4" fill="#fff"/>
<text x="776" y="689" font-size="12" fill="#666" stroke="none" >123456</text>
<text x="560" y="740" font-size="12" fill="#000" stroke="none" font-weight="600">Private key (PEM)</text>
<rect x="760" y="720" width="464" height="40" rx="4" fill="#fff"/>
<text x="776" y="745" font-size="12" fill="#666" stroke="none" >Write-only PEM</text>
<rect x="560" y="792" width="213" height="48" rx="4" fill="#fff"/><text x="666.5" y="824" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Generate webhook secret</text>
<rect x="785" y="792" width="213" height="48" rx="4" fill="#fff"/><text x="891.5" y="824" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Open new GitHub App form</text>
<rect x="1010" y="792" width="213" height="48" rx="4" fill="#000"/><text x="1116.5" y="824" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Connect and verify</text><g data-region="annotations"><rect x="256" y="88" width="248" height="360" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="256" cy="88" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="256" y="92" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
<rect x="552" y="160" width="680" height="632" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="552" cy="160" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="552" y="164" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">2</text>
<rect x="552" y="776" width="680" height="80" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="552" cy="776" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="552" y="780" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text></g></svg>
