<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1176" viewBox="0 0 375 1176" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect x="0" y="0" width="375" height="1176"/><rect x="0" y="0" width="375" height="56" rx="4" /><text x="16" y="32" font-size="14" fill="#000" stroke="none" font-weight="600">‹  Maya on Teams</text><text x="359" y="32" font-size="12" fill="#666" stroke="none" text-anchor="end">Menu</text><rect x="16" y="72" width="343" height="48" rx="4" fill="#fff"/><text x="32" y="104" font-size="14" fill="#000" stroke="none" font-weight="600">Settings</text><text x="343" y="104" font-size="14" fill="#666" stroke="none" text-anchor="end">⌄</text>
<text x="16" y="160" font-size="20" fill="#000" stroke="none" font-weight="700">Microsoft Teams settings</text>
<text x="16" y="190" font-size="12" fill="#666" stroke="none" >Enable the Teams channels where Maya may</text>
<text x="16" y="206" font-size="12" fill="#666" stroke="none" >create and continue tasks.</text>
<text x="16" y="256" font-size="20" fill="#000" stroke="none" font-weight="700">Channels</text>
<text x="16" y="286" font-size="12" fill="#666" stroke="none" >Only channels in teams where Maya is installed</text>
<text x="16" y="302" font-size="12" fill="#666" stroke="none" >can be enabled.</text>
<line x1="16" y1="336" x2="359" y2="336" />
<text x="24" y="380" font-size="14" fill="#000" stroke="none" font-weight="600">Support / General · Acme</text>
<text x="24" y="404" font-size="12" fill="#666" stroke="none" >Installed in Teams · Enabled</text>
<rect x="287" y="364" width="64" height="48" rx="4" fill="#fff"/><rect x="303" y="376" width="48" height="24" rx="4" fill="#000"/><circle cx="335" cy="388" r="8" fill="#fff"/>
<line x1="24" y1="448" x2="351" y2="448" stroke="#e6e6e6"/>
