<line x1="24" y1="544" x2="351" y2="544" stroke="#e6e6e6"/>
<text x="24" y="572" font-size="14" fill="#000" stroke="none" font-weight="600">Product / General · Acme</text>
<text x="24" y="596" font-size="12" fill="#666" stroke="none" >Installed in Teams · Not enabled</text>
<rect x="287" y="556" width="64" height="48" rx="4" fill="#fff"/><rect x="303" y="568" width="48" height="24" rx="4" fill="#fff"/><circle cx="319" cy="580" r="8" fill="#000"/>
<rect x="16" y="656" width="343" height="48" rx="4" fill="#fff"/><text x="187.5" y="688" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Add Maya to another team  ↗</text>
<text x="16" y="724" font-size="12" fill="#666" stroke="none" >Opens Teams instructions. Channels in the</text>
<text x="16" y="740" font-size="12" fill="#666" stroke="none" >newly installed team appear here disabled.</text>
<text x="16" y="816" font-size="20" fill="#000" stroke="none" font-weight="700">Private conversations</text>
<line x1="16" y1="848" x2="359" y2="848" />
<text x="24" y="888" font-size="14" fill="#000" stroke="none" font-weight="600">Allow direct messages</text>
<text x="24" y="912" font-size="12" fill="#666" stroke="none" >People may start tasks in personal chats</text>
<text x="24" y="928" font-size="12" fill="#666" stroke="none" >with Maya.</text>
<rect x="287" y="872" width="64" height="48" rx="4" fill="#fff"/><rect x="303" y="884" width="48" height="24" rx="4" fill="#000"/><circle cx="335" cy="896" r="8" fill="#fff"/>
<line x1="24" y1="968" x2="351" y2="968" stroke="#e6e6e6"/>
<text x="24" y="992" font-size="14" fill="#000" stroke="none" font-weight="600">Allow group chats</text>
<text x="24" y="1016" font-size="12" fill="#666" stroke="none" >People may add Maya to a group chat and</text>
<text x="24" y="1032" font-size="12" fill="#666" stroke="none" >start tasks there.</text>
