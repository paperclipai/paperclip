<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect x="0" y="0" width="1280" height="880"/><text x="48" y="48" font-size="28" fill="#000" stroke="none" font-weight="700">Chat connector product flow</text><text x="48" y="80" font-size="14" fill="#666" stroke="none" >The provider grants availability; Paperclip grants permission to act.</text>
    <rect x="48" y="128" width="176" height="88" rx="4" fill="#e6e6e6"/><text x="64" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Connectors</text><text x="64" y="192" font-size="12" fill="#666" stroke="none" >Choose provider</text><line x1="224" y1="176" x2="264" y2="176" /><polygon points="264,176 256,168 256,184" fill="#000" stroke="none"/><rect x="264" y="128" width="192" height="88" rx="4" fill="#fff"/><text x="280" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Choose agent</text><text x="280" y="192" font-size="12" fill="#666" stroke="none" >Exactly once</text><line x1="456" y1="176" x2="496" y2="176" /><polygon points="496,176 488,168 488,184" fill="#000" stroke="none"/><rect x="496" y="128" width="208" height="88" rx="4" fill="#fff"/><text x="512" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Install or invite</text><text x="512" y="192" font-size="12" fill="#666" stroke="none" >Provider ceiling</text><line x1="704" y1="176" x2="744" y2="176" /><polygon points="744,176 736,168 736,184" fill="#000" stroke="none"/><rect x="744" y="128" width="208" height="88" rx="4" fill="#fff"/><text x="760" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Test destination</text><text x="760" y="192" font-size="12" fill="#666" stroke="none" >Enabled first</text><line x1="952" y1="176" x2="992" y2="176" /><polygon points="992,176 984,168 984,184" fill="#000" stroke="none"/><rect x="992" y="128" width="192" height="88" rx="4" fill="#e6e6e6"/><text x="1008" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Active</text><text x="1008" y="192" font-size="12" fill="#666" stroke="none" >Ready</text>
    <text x="48" y="304" font-size="12" fill="#666" stroke="none" font-weight="700">ENDPOINT MANAGEMENT</text><rect x="48" y="336" width="232" height="88" rx="4" fill="#e6e6e6"/><text x="64" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">Settings</text><text x="64" y="400" font-size="12" fill="#666" stroke="none" >Where it may work</text><rect x="304" y="336" width="232" height="88" rx="4" fill="#fff"/><text x="320" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">Access</text><text x="320" y="400" font-size="12" fill="#666" stroke="none" >Who people are</text><rect x="560" y="336" width="232" height="88" rx="4" fill="#fff"/><text x="576" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">Conversations</text><text x="576" y="400" font-size="12" fill="#666" stroke="none" >Provider ↔ task</text><rect x="816" y="336" width="232" height="88" rx="4" fill="#fff"/><text x="832" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">Activity</text><text x="832" y="400" font-size="12" fill="#666" stroke="none" >Health + repair</text>
    <text x="48" y="512" font-size="12" fill="#666" stroke="none" font-weight="700">RESOURCE LIFECYCLE</text><rect x="48" y="544" width="232" height="88" rx="4" fill="#fff"/><text x="64" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Invited / installed</text><text x="64" y="608" font-size="12" fill="#666" stroke="none" >Available</text><line x1="280" y1="588" x2="320" y2="588" /><polygon points="320,588 312,580 312,596" fill="#000" stroke="none"/><rect x="320" y="544" width="232" height="88" rx="4" fill="#fff"/><text x="336" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Enabled in Settings</text><text x="336" y="608" font-size="12" fill="#666" stroke="none" >Eligible</text><line x1="552" y1="588" x2="592" y2="588" /><polygon points="592,588 584,580 584,596" fill="#000" stroke="none"/><rect x="592" y="544" width="232" height="88" rx="4" fill="#fff"/><text x="608" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Conversation</text><text x="608" y="608" font-size="12" fill="#666" stroke="none" >One task</text><line x1="824" y1="588" x2="864" y2="588" /><polygon points="864,588 856,580 856,596" fill="#000" stroke="none"/><rect x="864" y="544" width="232" height="88" rx="4" fill="#fff"/><text x="880" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Task output</text><text x="880" y="608" font-size="12" fill="#666" stroke="none" >Safe publication</text>
    <text x="48" y="720" font-size="20" fill="#000" stroke="none" font-weight="700">Fixed behavior</text><text x="48" y="752" font-size="14" fill="#666" stroke="none" >Invitation alone creates no task. Removed provider access makes the resource unavailable; history stays linked and read-only.</text>
    <g data-region="annotations"><rect x="40" y="120" width="1152" height="112" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="40" cy="120" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="40" y="124" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
<rect x="40" y="328" width="1016" height="112" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="40" cy="328" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="40" y="332" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">2</text>
<rect x="40" y="536" width="1064" height="112" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="40" cy="536" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="40" y="540" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text>
<rect x="40" y="704" width="1152" height="80" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="40" cy="704" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="40" y="708" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">4</text></g></svg>
