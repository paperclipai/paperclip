<circle cx="32" cy="574" r="6" fill="#e6e6e6"/><text x="52" y="579" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="1200" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="1228" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1256" /></g><g><line x1="240" y1="60" x2="1280" y2="60" /><text x="264" y="36" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  Maya on Slack  ›  Access</text><circle cx="1240" cy="30" r="16" fill="#e6e6e6"/></g><g data-region="connector-navigation"><text x="264" y="96" font-size="12" fill="#666" stroke="none" >‹  All connectors</text><circle cx="280" cy="136" r="16" fill="#e6e6e6"/><text x="312" y="144" font-size="14" fill="#000" stroke="none" font-weight="700">Maya on Slack</text><text x="280" y="192" font-size="14" fill="#666" stroke="none" >Settings</text>
<rect x="256" y="216" width="208" height="40" rx="4" fill="#e6e6e6"/><text x="280" y="240" font-size="14" fill="#000" stroke="none" font-weight="600">Access</text>
<text x="280" y="288" font-size="14" fill="#666" stroke="none" >Conversations</text>
<text x="280" y="336" font-size="14" fill="#666" stroke="none" >Activity</text><line x1="480" y1="64" x2="480" y2="1256" /></g><text x="504" y="108" font-size="28" fill="#000" stroke="none" font-weight="700">Slack access</text><text x="504" y="138" font-size="14" fill="#666" stroke="none" >External identities, linked Paperclip users, sponsored guests, and effective authority.</text><text x="504" y="198" font-size="20" fill="#000" stroke="none" font-weight="700">Endpoint sponsor</text>
<text x="504" y="223" font-size="12" fill="#666" stroke="none" >The sponsor supplies the upper bound for restricted guests.</text>
