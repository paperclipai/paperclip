<text x="520" y="294" font-size="12" fill="#666" stroke="none" >Dana · Company admin</text>
<rect x="1032" y="258" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="288" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Change sponsor</text>
<line x1="520" y1="318" x2="1208" y2="318" stroke="#e6e6e6"/>
<text x="520" y="344" font-size="14" fill="#000" stroke="none" font-weight="600">Endpoint scope</text>
<text x="520" y="366" font-size="12" fill="#666" stroke="none" >Support project · #customer-support and #incidents</text>
<rect x="1032" y="330" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="360" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">View scope</text>
<text x="504" y="420" font-size="20" fill="#000" stroke="none" font-weight="700">Linked Slack people</text>
<text x="504" y="445" font-size="12" fill="#666" stroke="none" >Linked identities act as their mapped Paperclip users.</text>
<line x1="504" y1="468" x2="1224" y2="468" />
