<text x="520" y="588" font-size="12" fill="#666" stroke="none" >sam@acme.com · Viewer · confirmed Sep 4</text>
<rect x="1032" y="552" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="582" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Revoke</text>
<line x1="520" y1="612" x2="1208" y2="612" stroke="#e6e6e6"/>
<text x="520" y="638" font-size="14" fill="#000" stroke="none" font-weight="600">Link another person</text>
<text x="520" y="660" font-size="12" fill="#666" stroke="none" >Send an expiring sign-in and company-confirmation link.</text>
<rect x="1032" y="624" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="654" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Create link</text>
<text x="504" y="714" font-size="20" fill="#000" stroke="none" font-weight="700">Unlinked people</text>
<text x="504" y="739" font-size="12" fill="#666" stroke="none" >Unlinked Slack users are sponsored external principals, not anonymous admins.</text>
<line x1="504" y1="762" x2="1224" y2="762" />
<text x="520" y="788" font-size="14" fill="#000" stroke="none" font-weight="600">Restricted guest profile</text>
<text x="520" y="810" font-size="12" fill="#666" stroke="none" >Comment, attach files, and receive safe output inside allowed tasks.</text>
<rect x="1032" y="774" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="804" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Default</text>
<line x1="520" y1="834" x2="1208" y2="834" stroke="#e6e6e6"/>
<text x="520" y="860" font-size="14" fill="#000" stroke="none" font-weight="600">Governance</text>
<text x="520" y="882" font-size="12" fill="#666" stroke="none" >No approvals, budget changes, hiring, permissions, connection changes,</text>
<text x="520" y="898" font-size="12" fill="#666" stroke="none" >or reassignment.</text>
<rect x="1032" y="846" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="876" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Denied</text>
<text x="504" y="936" font-size="20" fill="#000" stroke="none" font-weight="700">Slack identity rules</text>
<text x="504" y="961" font-size="12" fill="#666" stroke="none" >Workspace ID plus Slack user ID is authoritative; display names and email hints are not.</text>
<line x1="504" y1="984" x2="1224" y2="984" />
<text x="520" y="1010" font-size="14" fill="#000" stroke="none" font-weight="600">Bots and apps</text>
<text x="520" y="1032" font-size="12" fill="#666" stroke="none" >Ignored unless an explicit audited endpoint-to-endpoint route permits</text>
<text x="520" y="1048" font-size="12" fill="#666" stroke="none" >them.</text>
<rect x="1032" y="996" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1026" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Guarded</text>
<line x1="520" y1="1056" x2="1208" y2="1056" stroke="#e6e6e6"/>
<text x="520" y="1082" font-size="14" fill="#000" stroke="none" font-weight="600">Identity audit</text>
<text x="520" y="1104" font-size="12" fill="#666" stroke="none" >Every message records external ID, link state, sponsor, and effective</text>
<text x="520" y="1120" font-size="12" fill="#666" stroke="none" >authority.</text>
