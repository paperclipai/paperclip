<rect x="256" y="312" width="208" height="40" rx="4" fill="#e6e6e6"/><text x="280" y="336" font-size="14" fill="#000" stroke="none" font-weight="600">Activity</text><line x1="480" y1="64" x2="480" y2="1200" /></g><text x="504" y="108" font-size="28" fill="#000" stroke="none" font-weight="700">GitHub activity</text><text x="504" y="138" font-size="14" fill="#666" stroke="none" >Inspect provider health, deliveries, callbacks, publications, and retries.</text>
    <text x="504" y="204" font-size="20" fill="#000" stroke="none" font-weight="700">Provider and delivery health</text><text x="504" y="228" font-size="12" fill="#666" stroke="none" >Current checks across the provider, credentials, ingress, and permission surface.</text><line x1="504" y1="272" x2="1224" y2="272" /><text x="520" y="250" font-size="14" fill="#000" stroke="none" font-weight="700">GitHub API · healthy</text><text x="1208" y="250" font-size="14" fill="#000" stroke="none" text-anchor="end">●</text><line x1="520" y1="266" x2="1208" y2="266" stroke="#e6e6e6"/>
<text x="520" y="298" font-size="14" fill="#666" stroke="none" >Webhook signature · healthy</text><text x="1208" y="298" font-size="14" fill="#000" stroke="none" text-anchor="end">●</text><line x1="520" y1="314" x2="1208" y2="314" stroke="#e6e6e6"/>
<text x="520" y="346" font-size="14" fill="#666" stroke="none" >Installation · active</text><text x="1208" y="346" font-size="14" fill="#000" stroke="none" text-anchor="end">●</text><line x1="520" y1="362" x2="1208" y2="362" stroke="#e6e6e6"/>
<text x="520" y="394" font-size="14" fill="#666" stroke="none" >Rate limit · 4,284 remaining</text><text x="1208" y="394" font-size="14" fill="#000" stroke="none" text-anchor="end">●</text><line x1="520" y1="410" x2="1208" y2="410" stroke="#e6e6e6"/>
    <text x="504" y="478" font-size="20" fill="#000" stroke="none" font-weight="700">Delivery ledger</text><text x="504" y="502" font-size="12" fill="#666" stroke="none" >Inbound events, callbacks, and outbound publications in chronological order.</text><line x1="504" y1="520" x2="1224" y2="520" /><text x="520" y="548" font-size="14" fill="#000" stroke="none" font-weight="700">Inbound delivery</text><text x="720" y="548" font-size="12" fill="#666" stroke="none" >3b12a · issue_comment · acme/api#418</text><text x="1208" y="548" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Delivered · 3m</text><text x="520" y="576" font-size="12" fill="#666" stroke="none" >ID and payload details are redacted until opened by an authorized operator.</text>
<line x1="520" y1="606" x2="1208" y2="606" stroke="#e6e6e6"/><text x="520" y="634" font-size="14" fill="#000" stroke="none" font-weight="700">Outbound publication</text><text x="720" y="634" font-size="12" fill="#666" stroke="none" >Pub91B · GFM comment edit</text><text x="1208" y="634" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Delivered · 2m</text><text x="520" y="662" font-size="12" fill="#666" stroke="none" >ID and payload details are redacted until opened by an authorized operator.</text>
<line x1="520" y1="692" x2="1208" y2="692" stroke="#e6e6e6"/><text x="520" y="720" font-size="14" fill="#000" stroke="none" font-weight="700">Inbound delivery</text><text x="720" y="720" font-size="12" fill="#666" stroke="none" >3b129 · paperclip-maya[bot] self comment</text><text x="1208" y="720" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Suppressed · 8m</text><text x="520" y="748" font-size="12" fill="#666" stroke="none" >ID and payload details are redacted until opened by an authorized operator.</text>
<line x1="520" y1="778" x2="1208" y2="778" stroke="#e6e6e6"/><text x="520" y="806" font-size="14" fill="#000" stroke="none" font-weight="700">Provider health</text><text x="720" y="806" font-size="12" fill="#666" stroke="none" >Installation permission comparison</text><text x="1208" y="806" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">No drift · 14m</text><text x="520" y="834" font-size="12" fill="#666" stroke="none" >ID and payload details are redacted until opened by an authorized operator.</text>
    <text x="504" y="900" font-size="20" fill="#000" stroke="none" font-weight="700">Failure handling</text><text x="504" y="928" font-size="14" fill="#666" stroke="none" >Replay re-runs authorization and deduplication. Sensitive provider payload fields remain redacted.</text><rect x="520" y="970" width="176" height="48" rx="6" fill="#fff"/><text x="608" y="1000" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Open redacted detail</text><rect x="712" y="970" width="176" height="48" rx="6" fill="#fff"/><text x="800" y="1000" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Replay failed</text>
    <text x="504" y="1070" font-size="20" fill="#000" stroke="none" font-weight="700">Provider limits and drift</text><text x="504" y="1098" font-size="14" fill="#666" stroke="none" >Rate limits, permission changes, uninstall/revocation, and relay state create explicit ledger events.</text>
