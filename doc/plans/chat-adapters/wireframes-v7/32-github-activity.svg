<circle cx="32" cy="574" r="6" fill="#e6e6e6"/><text x="52" y="579" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="1144" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="1172" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1200" /></g><g><line x1="240" y1="60" x2="1280" y2="60" /><text x="264" y="36" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  Maya on GitHub  ›  Activity</text><circle cx="1240" cy="30" r="16" fill="#e6e6e6"/></g><g data-region="connector-navigation"><text x="264" y="96" font-size="12" fill="#666" stroke="none" >‹  All connectors</text><circle cx="280" cy="136" r="16" fill="#e6e6e6"/><text x="312" y="144" font-size="14" fill="#000" stroke="none" font-weight="700">Maya on GitHub</text><text x="280" y="192" font-size="14" fill="#666" stroke="none" >Settings</text>
