<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1320" viewBox="0 0 375 1320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect width="375" height="1320"/><rect x="0" y="0" width="375" height="56" rx="6" /><text x="16" y="35" font-size="14" fill="#000" stroke="none" font-weight="600">‹  Conversation example</text><text x="359" y="35" font-size="12" fill="#666" stroke="none" text-anchor="end">Menu</text><text x="16" y="84" font-size="12" fill="#666" stroke="none" font-weight="600">Behavior walkthrough · not a product page</text><text x="16" y="116" font-size="20" fill="#000" stroke="none" font-weight="700">How Telegram conversations work</text><text x="16" y="156" font-size="14" fill="#000" stroke="none" font-weight="700">What Ari sees · Telegram · DM / group / forum</text><rect x="16" y="176" width="343" height="476" rx="6" /><rect x="24" y="242" width="327" height="88" rx="6" fill="#fff"/><text x="40" y="264" font-size="12" fill="#666" stroke="none" font-weight="600">DM</text><text x="40" y="288" font-size="12" fill="#000" stroke="none" font-weight="600">First message → one active Paperclip issue</text><text x="40" y="312" font-size="12" fill="#666" stroke="none" >New task or /new starts another</text>
<rect x="24" y="344" width="327" height="88" rx="6" fill="#fff"/><text x="40" y="366" font-size="12" fill="#666" stroke="none" font-weight="600">Group</text><text x="40" y="390" font-size="12" fill="#000" stroke="none" font-weight="600">@maya starts; reply to Maya continues</text><text x="40" y="414" font-size="12" fill="#666" stroke="none" >Privacy-on unrelated traffic is unseen</text>
<rect x="24" y="446" width="327" height="88" rx="6" fill="#fff"/><text x="40" y="468" font-size="12" fill="#666" stroke="none" font-weight="600">Forum</text><text x="40" y="492" font-size="12" fill="#000" stroke="none" font-weight="600">Topic 381 → one Paperclip issue</text><text x="40" y="516" font-size="12" fill="#666" stroke="none" >Uses stable message_thread_id</text>
<rect x="48" y="548" width="303" height="88" rx="6" fill="#e6e6e6"/><text x="64" y="570" font-size="12" fill="#666" stroke="none" font-weight="600">Maya</text><text x="64" y="594" font-size="12" fill="#000" stroke="none" font-weight="600">Working… then one rate-safe final response</text><text x="64" y="618" font-size="12" fill="#666" stroke="none" >Post/edit + inline buttons</text>
    <text x="16" y="700" font-size="20" fill="#000" stroke="none" font-weight="700">What Paperclip creates</text><rect x="16" y="724" width="343" height="320" rx="6" fill="#e6e6e6"/><text x="36" y="752" font-size="14" fill="#000" stroke="none" font-weight="700">PAP-1854 · Active Telegram task</text>
<line x1="32" y1="796" x2="343" y2="796" stroke="#fff"/><text x="36" y="788" font-size="12" fill="#666" stroke="none" >Assigned to Maya · locked</text>
<line x1="32" y1="832" x2="343" y2="832" stroke="#fff"/><text x="36" y="824" font-size="12" fill="#666" stroke="none" >Source · DM, group, or topic</text>
<line x1="32" y1="868" x2="343" y2="868" stroke="#fff"/><text x="36" y="860" font-size="12" fill="#666" stroke="none" >Boundary · Explicit and visible</text>
<line x1="32" y1="904" x2="343" y2="904" stroke="#fff"/><text x="36" y="896" font-size="12" fill="#666" stroke="none" >Status · Working</text>
<line x1="32" y1="940" x2="343" y2="940" stroke="#fff"/><text x="36" y="932" font-size="12" fill="#666" stroke="none" >Publication · Editing</text><rect x="36" y="972" width="303" height="48" rx="6" fill="#fff"/><text x="187.5" y="1002" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Open task</text>
    <text x="16" y="1080" font-size="20" fill="#000" stroke="none" font-weight="700">Behavior that stays true</text><circle cx="28" cy="1120" r="7" fill="#e6e6e6"/><text x="48" y="1124" font-size="12" fill="#000" stroke="none" >The UI always names the active task in</text>
<text x="48" y="1140" font-size="12" fill="#000" stroke="none" >linear chats.</text>
<circle cx="28" cy="1182" r="7" fill="#e6e6e6"/><text x="48" y="1186" font-size="12" fill="#000" stroke="none" >Callback IDs are opaque; Paperclip</text>
<text x="48" y="1202" font-size="12" fill="#000" stroke="none" >reauthorizes actions.</text>
<circle cx="28" cy="1244" r="7" fill="#e6e6e6"/><text x="48" y="1248" font-size="12" fill="#000" stroke="none" >Unsupported/governed actions use reply or</text>
<text x="48" y="1264" font-size="12" fill="#000" stroke="none" >DM + link.</text>
