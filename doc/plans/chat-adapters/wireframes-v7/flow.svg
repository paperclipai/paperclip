<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect x="0" y="0" width="1280" height="880"/><text x="48" y="48" font-size="28" fill="#000" stroke="none" font-weight="700">Chat connector product flow</text><text x="48" y="80" font-size="14" fill="#666" stroke="none" >Configuration is limited to destination reach.</text>
    <rect x="48" y="128" width="176" height="88" rx="4" fill="#e6e6e6"/><text x="64" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Connectors</text><text x="64" y="192" font-size="12" fill="#666" stroke="none" >Choose provider</text><line x1="224" y1="176" x2="264" y2="176" /><polygon points="264,176 256,168 256,184" fill="#000" stroke="none"/><rect x="264" y="128" width="192" height="88" rx="4" fill="#fff"/><text x="280" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Purpose</text><text x="280" y="192" font-size="12" fill="#666" stroke="none" >If dual-surface</text><line x1="456" y1="176" x2="496" y2="176" /><polygon points="496,176 488,168 488,184" fill="#000" stroke="none"/><rect x="496" y="128" width="184" height="88" rx="4" fill="#fff"/><text x="512" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Choose agent</text><text x="512" y="192" font-size="12" fill="#666" stroke="none" >Once</text><line x1="680" y1="176" x2="720" y2="176" /><polygon points="720,176 712,168 712,184" fill="#000" stroke="none"/><rect x="720" y="128" width="216" height="88" rx="4" fill="#fff"/><text x="736" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Provider setup</text><text x="736" y="192" font-size="12" fill="#666" stroke="none" >Minimum actions</text><line x1="936" y1="176" x2="976" y2="176" /><polygon points="976,176 968,168 968,184" fill="#000" stroke="none"/><rect x="976" y="128" width="208" height="88" rx="4" fill="#e6e6e6"/><text x="992" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Test</text><text x="992" y="192" font-size="12" fill="#666" stroke="none" >Real message</text>
    <text x="48" y="304" font-size="12" fill="#666" stroke="none" font-weight="700">ENDPOINT MANAGEMENT</text><rect x="48" y="336" width="232" height="88" rx="4" fill="#e6e6e6"/><text x="64" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">Settings</text><text x="64" y="400" font-size="12" fill="#666" stroke="none" >Reach only</text><rect x="304" y="336" width="232" height="88" rx="4" fill="#fff"/><text x="320" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">Access</text><text x="320" y="400" font-size="12" fill="#666" stroke="none" >Identity + authority</text><rect x="560" y="336" width="232" height="88" rx="4" fill="#fff"/><text x="576" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">Conversations</text><text x="576" y="400" font-size="12" fill="#666" stroke="none" >Bindings</text><rect x="816" y="336" width="232" height="88" rx="4" fill="#fff"/><text x="832" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">Activity</text><text x="832" y="400" font-size="12" fill="#666" stroke="none" >Health + repair</text>
    <text x="48" y="512" font-size="12" fill="#666" stroke="none" font-weight="700">FIXED PRODUCT BEHAVIOR</text><rect x="48" y="544" width="232" height="88" rx="4" fill="#fff"/><text x="64" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Activation</text><text x="64" y="608" font-size="12" fill="#666" stroke="none" >Mention starts task</text><rect x="304" y="544" width="232" height="88" rx="4" fill="#fff"/><text x="320" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Continuation</text><text x="320" y="608" font-size="12" fill="#666" stroke="none" >Replies stay bound</text><rect x="560" y="544" width="232" height="88" rx="4" fill="#fff"/><text x="576" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Delivery</text><text x="576" y="608" font-size="12" fill="#666" stroke="none" >Instance-selected</text><rect x="816" y="544" width="232" height="88" rx="4" fill="#fff"/><text x="832" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Capabilities</text><text x="832" y="608" font-size="12" fill="#666" stroke="none" >Maximum safe set</text>
    <text x="48" y="720" font-size="20" fill="#000" stroke="none" font-weight="700">Removed</text><text x="48" y="752" font-size="14" fill="#666" stroke="none" >Overview tab, task-boundary settings, delivery-path settings, credential rows, drift rows, and immutable provider identity fields.</text>
