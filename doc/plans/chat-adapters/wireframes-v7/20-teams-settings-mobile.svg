<line x1="24" y1="752" x2="351" y2="752" stroke="#e6e6e6"/>
<text x="24" y="776" font-size="14" fill="#000" stroke="none" font-weight="600">Allow group chats</text>
<text x="24" y="800" font-size="12" fill="#666" stroke="none" >People can add Maya to a group chat and</text>
<text x="24" y="816" font-size="12" fill="#666" stroke="none" >start a task there.</text>
