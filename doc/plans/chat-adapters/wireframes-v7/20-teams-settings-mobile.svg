<rect x="24" y="368" width="24" height="24" rx="4" fill="#000"/>
<text x="36" y="384" font-size="12" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="64" y="376" font-size="14" fill="#000" stroke="none" font-weight="600">Support / General · Acme</text>
<text x="64" y="400" font-size="12" fill="#666" stroke="none" >Maya is installed in this team</text>
<rect x="16" y="448" width="343" height="48" rx="4" fill="#fff"/><text x="187.5" y="480" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Edit allowed channels</text>
<text x="16" y="560" font-size="20" fill="#000" stroke="none" font-weight="700">Private conversations</text>
<text x="16" y="584" font-size="12" fill="#666" stroke="none" >Choose which non-channel conversations may</text>
<text x="16" y="600" font-size="12" fill="#666" stroke="none" >start work.</text>
<line x1="16" y1="640" x2="359" y2="640" />
<text x="24" y="680" font-size="14" fill="#000" stroke="none" font-weight="600">Allow direct messages</text>
<text x="24" y="704" font-size="12" fill="#666" stroke="none" >A person can start a task in a personal</text>
<text x="24" y="720" font-size="12" fill="#666" stroke="none" >chat with Maya.</text>
