<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1680" viewBox="0 0 1280 1680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect width="1280" height="1680"/><g><text x="24" y="38" font-size="20" fill="#000" stroke="none" font-weight="700">Paperclip</text><circle cx="32" cy="68" r="6" fill="#e6e6e6"/><text x="52" y="73" font-size="14" fill="#666" stroke="none" >New Task</text>
<circle cx="32" cy="114" r="6" fill="#e6e6e6"/><text x="52" y="119" font-size="14" fill="#666" stroke="none" >Search</text>
<circle cx="32" cy="160" r="6" fill="#e6e6e6"/><text x="52" y="165" font-size="14" fill="#666" stroke="none" >Dashboard</text>
<circle cx="32" cy="206" r="6" fill="#e6e6e6"/><text x="52" y="211" font-size="14" fill="#666" stroke="none" >Inbox</text>
<circle cx="32" cy="252" r="6" fill="#e6e6e6"/><text x="52" y="257" font-size="14" fill="#666" stroke="none" >Tasks</text>
<circle cx="32" cy="298" r="6" fill="#e6e6e6"/><text x="52" y="303" font-size="14" fill="#666" stroke="none" >Projects</text>
<circle cx="32" cy="344" r="6" fill="#e6e6e6"/><text x="52" y="349" font-size="14" fill="#666" stroke="none" >Routines</text>
<circle cx="32" cy="390" r="6" fill="#e6e6e6"/><text x="52" y="395" font-size="14" fill="#666" stroke="none" >Artifacts</text>
<circle cx="32" cy="436" r="6" fill="#e6e6e6"/><text x="52" y="441" font-size="14" fill="#666" stroke="none" >Agents</text>
<circle cx="32" cy="482" r="6" fill="#e6e6e6"/><text x="52" y="487" font-size="14" fill="#666" stroke="none" >Skills</text>
<rect x="12" y="510" width="216" height="38" rx="6" fill="#e6e6e6"/><circle cx="32" cy="528" r="6" fill="#e6e6e6"/><text x="52" y="533" font-size="14" fill="#000" stroke="none" font-weight="600">Connectors</text>
<circle cx="32" cy="574" r="6" fill="#e6e6e6"/><text x="52" y="579" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="1624" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="1652" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1680" /></g><g><line x1="240" y1="60" x2="1280" y2="60" /><text x="264" y="36" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  Maya on Microsoft Teams  ›  Settings</text><circle cx="1240" cy="30" r="16" fill="#e6e6e6"/></g><g><text x="264" y="94" font-size="12" fill="#666" stroke="none" >‹  All connectors</text><circle cx="280" cy="132" r="18" fill="#e6e6e6"/><text x="308" y="138" font-size="14" fill="#000" stroke="none" font-weight="700">Maya on Teams</text><text x="280" y="194" font-size="14" fill="#666" stroke="none" >Overview</text>
<rect x="252" y="216" width="216" height="40" rx="6" fill="#e6e6e6"/><text x="280" y="242" font-size="14" fill="#000" stroke="none" font-weight="600">Settings</text>
<text x="280" y="290" font-size="14" fill="#666" stroke="none" >Access</text>
<text x="280" y="338" font-size="14" fill="#666" stroke="none" >Conversations</text>
<text x="280" y="386" font-size="14" fill="#666" stroke="none" >Activity</text><line x1="480" y1="60" x2="480" y2="1680" /></g><text x="504" y="108" font-size="28" fill="#000" stroke="none" font-weight="700">Microsoft Teams settings</text><text x="504" y="138" font-size="14" fill="#666" stroke="none" >Configure chat scopes and add privileged Graph access only when needed.</text><text x="504" y="200" font-size="20" fill="#000" stroke="none" font-weight="700">Tenant and conversation reach</text><text x="504" y="224" font-size="12" fill="#666" stroke="none" >The installed Teams app and Paperclip allowlist jointly determine reach.</text><line x1="504" y1="240" x2="1224" y2="240" /><text x="520" y="262" font-size="14" fill="#000" stroke="none" font-weight="600">Tenant</text><text x="520" y="283" font-size="12" fill="#666" stroke="none" >Single-tenant or multi-tenant bot installation.</text><rect x="1024" y="244" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="274" font-size="12" fill="#000" stroke="none" font-weight="600">Acme</text><text x="1192" y="274" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="296" x2="1208" y2="296" stroke="#e6e6e6"/><text x="520" y="318" font-size="14" fill="#000" stroke="none" font-weight="600">Teams and channels</text><text x="520" y="339" font-size="12" fill="#666" stroke="none" >Allowed team/channel installations for Maya.</text><rect x="1024" y="300" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="330" font-size="12" fill="#000" stroke="none" font-weight="600">1 channel</text><text x="1192" y="330" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="352" x2="1208" y2="352" stroke="#e6e6e6"/><text x="520" y="374" font-size="14" fill="#000" stroke="none" font-weight="600">Personal scope</text><text x="520" y="395" font-size="12" fill="#666" stroke="none" >Allow direct messages to create active tasks.</text><rect x="1024" y="356" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="386" font-size="12" fill="#000" stroke="none" font-weight="600">On</text><text x="1192" y="386" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="408" x2="1208" y2="408" stroke="#e6e6e6"/><text x="520" y="430" font-size="14" fill="#000" stroke="none" font-weight="600">Group chats</text><text x="520" y="451" font-size="12" fill="#666" stroke="none" >Allow installed group chats to create active tasks.</text><rect x="1024" y="412" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="442" font-size="12" fill="#000" stroke="none" font-weight="600">On</text><text x="1192" y="442" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<text x="504" y="496" font-size="20" fill="#000" stroke="none" font-weight="700">Conversation and task boundaries</text><text x="504" y="520" font-size="12" fill="#666" stroke="none" >The Teams conversation type selects the native boundary.</text><line x1="504" y1="536" x2="1224" y2="536" /><text x="520" y="558" font-size="14" fill="#000" stroke="none" font-weight="600">Channel posts</text><text x="520" y="579" font-size="12" fill="#666" stroke="none" >A root mention and its replies map to one issue.</text><rect x="1024" y="540" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="570" font-size="12" fill="#000" stroke="none" font-weight="600">Post thread</text><text x="1192" y="570" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="592" x2="1208" y2="592" stroke="#e6e6e6"/><text x="520" y="614" font-size="14" fill="#000" stroke="none" font-weight="600">DM and group chat</text><text x="520" y="635" font-size="12" fill="#666" stroke="none" >One active issue until the person chooses New task.</text><rect x="1024" y="596" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="626" font-size="12" fill="#000" stroke="none" font-weight="600">Active task</text><text x="1192" y="626" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="648" x2="1208" y2="648" stroke="#e6e6e6"/><text x="520" y="670" font-size="14" fill="#000" stroke="none" font-weight="600">Unmentioned replies</text><text x="520" y="691" font-size="12" fill="#666" stroke="none" >Use when delivered; otherwise tell people to mention Maya.</text><rect x="1024" y="652" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="682" font-size="12" fill="#000" stroke="none" font-weight="600">Detect</text><text x="1192" y="682" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<text x="504" y="736" font-size="20" fill="#000" stroke="none" font-weight="700">Responses and interactions</text><text x="504" y="760" font-size="12" fill="#666" stroke="none" >Start with mention-only delivery; add broader listening only when justified.</text><line x1="504" y1="776" x2="1224" y2="776" /><text x="520" y="798" font-size="14" fill="#000" stroke="none" font-weight="600">Message visibility</text><text x="520" y="819" font-size="12" fill="#666" stroke="none" >Receive direct mentions under the basic installation.</text><rect x="1024" y="780" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="810" font-size="12" fill="#000" stroke="none" font-weight="600">Mention only</text><text x="1192" y="810" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="832" x2="1208" y2="832" stroke="#e6e6e6"/><text x="520" y="854" font-size="14" fill="#000" stroke="none" font-weight="600">All-message/history RSC</text><text x="520" y="875" font-size="12" fill="#666" stroke="none" >Per-team or chat grant that changes ambient visibility.</text><rect x="1024" y="836" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="866" font-size="12" fill="#000" stroke="none" font-weight="600">Off</text><text x="1192" y="866" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="888" x2="1208" y2="888" stroke="#e6e6e6"/><text x="520" y="910" font-size="14" fill="#000" stroke="none" font-weight="600">Streaming</text><text x="520" y="931" font-size="12" fill="#666" stroke="none" >Native in DM; buffered or edited in groups/channels.</text><rect x="1024" y="892" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="922" font-size="12" fill="#000" stroke="none" font-weight="600">Automatic</text><text x="1192" y="922" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="944" x2="1208" y2="944" stroke="#e6e6e6"/><text x="520" y="966" font-size="14" fill="#000" stroke="none" font-weight="600">Cards and task modules</text><text x="520" y="987" font-size="12" fill="#666" stroke="none" >Adaptive Cards, actions, and validated modal flow.</text><rect x="1024" y="948" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="978" font-size="12" fill="#000" stroke="none" font-weight="600">On</text><text x="1192" y="978" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="1000" x2="1208" y2="1000" stroke="#e6e6e6"/><text x="520" y="1022" font-size="14" fill="#000" stroke="none" font-weight="600">Files and private replies</text><text x="520" y="1043" font-size="12" fill="#666" stroke="none" >Bounded files; targeted reply with DM/text fallback.</text><rect x="1024" y="1004" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="1034" font-size="12" fill="#000" stroke="none" font-weight="600">On</text><text x="1192" y="1034" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<text x="504" y="1088" font-size="20" fill="#000" stroke="none" font-weight="700">Microsoft identity and consent</text><text x="504" y="1112" font-size="12" fill="#666" stroke="none" >Basic live conversation does not depend on broad Graph permissions.</text><line x1="504" y1="1128" x2="1224" y2="1128" /><text x="520" y="1150" font-size="14" fill="#000" stroke="none" font-weight="600">Bot authentication</text><text x="520" y="1171" font-size="12" fill="#666" stroke="none" >Exactly one client secret or federated workload identity.</text><rect x="1024" y="1132" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="1162" font-size="12" fill="#000" stroke="none" font-weight="600">Federated</text><text x="1192" y="1162" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="1184" x2="1208" y2="1184" stroke="#e6e6e6"/><text x="520" y="1206" font-size="14" fill="#000" stroke="none" font-weight="600">Tenant mode</text><text x="520" y="1227" font-size="12" fill="#666" stroke="none" >Tenant ID is required for a single-tenant app.</text><rect x="1024" y="1188" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="1218" font-size="12" fill="#000" stroke="none" font-weight="600">Single</text><text x="1192" y="1218" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="1240" x2="1208" y2="1240" stroke="#e6e6e6"/><text x="520" y="1262" font-size="14" fill="#000" stroke="none" font-weight="600">User directory</text><text x="520" y="1283" font-size="12" fill="#666" stroke="none" >User.Read.All requires Entra application admin consent.</text><rect x="1024" y="1244" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="1274" font-size="12" fill="#000" stroke="none" font-weight="600">Not granted</text><text x="1192" y="1274" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="1296" x2="1208" y2="1296" stroke="#e6e6e6"/><text x="520" y="1318" font-size="14" fill="#000" stroke="none" font-weight="600">DM history</text><text x="520" y="1339" font-size="12" fill="#666" stroke="none" >Chat.Read.All is privileged and separately consented.</text><rect x="1024" y="1300" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="1330" font-size="12" fill="#000" stroke="none" font-weight="600">Off</text><text x="1192" y="1330" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<text x="504" y="1384" font-size="20" fill="#000" stroke="none" font-weight="700">Fallbacks</text><text x="504" y="1408" font-size="12" fill="#666" stroke="none" >Tell the operator and participant exactly what Teams can deliver.</text><line x1="504" y1="1424" x2="1224" y2="1424" /><text x="520" y="1446" font-size="14" fill="#000" stroke="none" font-weight="600">Missing delivery or feature</text><text x="520" y="1467" font-size="12" fill="#666" stroke="none" >Require a mention, request scoped RSC, or use targeted message → DM → normal text and link.</text><rect x="1024" y="1428" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="1458" font-size="12" fill="#000" stroke="none" font-weight="600">Explain</text><text x="1192" y="1458" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text><rect x="1048" y="1608" width="176" height="48" rx="6" fill="#000"/><text x="1136" y="1638" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Save changes</text><text x="504" y="1638" font-size="12" fill="#666" stroke="none" >Internal reasoning and tool traces are never published.</text><g data-region="annotations"><rect x="496" y="168" width="736" height="304" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="168" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="172" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
<rect x="496" y="464" width="736" height="248" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="464" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="468" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">2</text>
<rect x="496" y="704" width="736" height="360" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="704" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="708" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text>
<rect x="496" y="1056" width="736" height="304" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="1056" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="1060" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">4</text>
<rect x="496" y="1352" width="736" height="136" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="1352" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="1356" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">5</text></g></svg>
