<text x="24" y="1079" font-size="12" fill="#666" stroke="none" >private-chat draft previews opt</text><rect x="239" y="1030" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1060" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Post/edit</text>
<line x1="24" y1="1100" x2="351" y2="1100" stroke="#e6e6e6"/><text x="24" y="1124" font-size="14" fill="#000" stroke="none" font-weight="600">Buttons</text><text x="24" y="1145" font-size="12" fill="#666" stroke="none" >Inline callbacks and URL buttons</text>
<text x="24" y="1161" font-size="12" fill="#666" stroke="none" >with opaque short IDs.</text><rect x="239" y="1112" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1142" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">On</text>
<line x1="24" y1="1182" x2="351" y2="1182" stroke="#e6e6e6"/><text x="24" y="1206" font-size="14" fill="#000" stroke="none" font-weight="600">Files and media</text><text x="24" y="1227" font-size="12" fill="#666" stroke="none" >Bounded documents, photos,</text>
<text x="24" y="1243" font-size="12" fill="#666" stroke="none" >audio, video, and media groups.</text><rect x="239" y="1194" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1224" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">On</text>
<line x1="24" y1="1264" x2="351" y2="1264" stroke="#e6e6e6"/><text x="24" y="1288" font-size="14" fill="#000" stroke="none" font-weight="600">Unavailable features</text><text x="24" y="1309" font-size="12" fill="#666" stroke="none" >No ephemeral, modal, select, or</text>
<text x="24" y="1325" font-size="12" fill="#666" stroke="none" >full thread listing.</text><rect x="239" y="1276" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1306" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Text fallback</text>
<text x="16" y="1376" font-size="20" fill="#000" stroke="none" font-weight="700">Bot security and delivery</text><text x="16" y="1402" font-size="12" fill="#666" stroke="none" >Webhook and polling are mutually exclusive delivery mod…</text><line x1="16" y1="1416" x2="359" y2="1416" /><text x="24" y="1440" font-size="14" fill="#000" stroke="none" font-weight="600">Production delivery</text><text x="24" y="1461" font-size="12" fill="#666" stroke="none" >HTTPS webhook plus secret-token</text>
<text x="24" y="1477" font-size="12" fill="#666" stroke="none" >verification.</text><rect x="239" y="1428" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1458" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Webhook</text>
