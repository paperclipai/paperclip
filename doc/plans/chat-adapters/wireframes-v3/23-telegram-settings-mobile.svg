<text x="24" y="845" font-size="12" fill="#666" stroke="none" >forum topic maps directly.</text><rect x="239" y="796" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="826" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Addressed</text>
<text x="16" y="896" font-size="20" fill="#000" stroke="none" font-weight="700">Responses and interactions</text><text x="16" y="922" font-size="12" fill="#666" stroke="none" >Telegram output is rate-aware and varies between privat…</text><line x1="16" y1="936" x2="359" y2="936" /><text x="24" y="960" font-size="14" fill="#000" stroke="none" font-weight="600">Acknowledgement</text><text x="24" y="981" font-size="12" fill="#666" stroke="none" >Typing indicator or reaction</text>
<text x="24" y="997" font-size="12" fill="#666" stroke="none" >after durable acceptance.</text><rect x="239" y="948" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="978" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Typing</text>
