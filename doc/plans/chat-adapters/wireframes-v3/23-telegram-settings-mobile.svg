<svg xmlns="http://www.w3.org/2000/svg" width="375" height="2112" viewBox="0 0 375 2112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect width="375" height="2112"/><rect x="0" y="0" width="375" height="56" rx="6" /><text x="16" y="35" font-size="14" fill="#000" stroke="none" font-weight="600">‹  Maya on Telegram</text><text x="359" y="35" font-size="12" fill="#666" stroke="none" text-anchor="end">Menu</text><text x="16" y="92" font-size="20" fill="#000" stroke="none" font-weight="700">Telegram settings</text><text x="16" y="120" font-size="12" fill="#666" stroke="none" >Provider-specific settings</text><text x="16" y="182" font-size="20" fill="#000" stroke="none" font-weight="700">Chats, topics, and people</text><text x="16" y="208" font-size="12" fill="#666" stroke="none" >Allowed IDs narrow the bot token's reach while Telegram…</text><line x1="16" y1="222" x2="359" y2="222" /><text x="24" y="246" font-size="14" fill="#000" stroke="none" font-weight="600">Allowed chats</text><text x="24" y="267" font-size="12" fill="#666" stroke="none" >Groups and private chats that</text>
<text x="24" y="283" font-size="12" fill="#666" stroke="none" >may activate Maya.</text><rect x="239" y="234" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="264" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">2 chats</text>
