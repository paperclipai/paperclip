<text x="24" y="1641" font-size="12" fill="#666" stroke="none" >pending updates and errors.</text><rect x="239" y="1592" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1622" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Healthy</text>
<line x1="24" y1="1662" x2="351" y2="1662" stroke="#e6e6e6"/><text x="24" y="1686" font-size="14" fill="#000" stroke="none" font-weight="600">Flood and bot routes</text><text x="24" y="1707" font-size="12" fill="#666" stroke="none" >Rate-safe cadence; bot-to-bot</text>
<text x="24" y="1723" font-size="12" fill="#666" stroke="none" >routes remain off.</text><rect x="239" y="1674" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1704" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Guarded</text>
<text x="16" y="1774" font-size="20" fill="#000" stroke="none" font-weight="700">Fallbacks</text><text x="16" y="1800" font-size="12" fill="#666" stroke="none" >Privacy and platform limits are visible behavior, not s…</text><line x1="16" y1="1814" x2="359" y2="1814" /><text x="24" y="1838" font-size="14" fill="#000" stroke="none" font-weight="600">Unaddressed or governed action</text><text x="24" y="1859" font-size="12" fill="#666" stroke="none" >Ignore unrelated group traffic;</text>
<text x="24" y="1875" font-size="12" fill="#666" stroke="none" >use a normal reply or DM plus a</text><rect x="239" y="1826" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1856" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Explain</text><rect x="16" y="2040" width="343" height="48" rx="6" fill="#000"/><text x="187.5" y="2070" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Save changes</text><g data-region="annotations"><rect x="8" y="152" width="359" height="406" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="152" r="9" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="156" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
