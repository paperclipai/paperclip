<text x="24" y="763" font-size="12" fill="#666" stroke="none" >/close ends the active issue.</text><rect x="239" y="714" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="744" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Commands</text>
