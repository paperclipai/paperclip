<text x="24" y="447" font-size="12" fill="#666" stroke="none" >before Paperclip identity rules.</text><rect x="239" y="398" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="428" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">All scoped</text>
<line x1="24" y1="468" x2="351" y2="468" stroke="#e6e6e6"/><text x="24" y="492" font-size="14" fill="#000" stroke="none" font-weight="600">Privacy mode</text><text x="24" y="513" font-size="12" fill="#666" stroke="none" >Keep BotFather privacy on for</text>
<text x="24" y="529" font-size="12" fill="#666" stroke="none" >ordinary groups.</text><rect x="239" y="480" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="510" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">On</text>
<text x="16" y="580" font-size="20" fill="#000" stroke="none" font-weight="700">Conversation and task boundaries</text><text x="16" y="606" font-size="12" fill="#666" stroke="none" >Linear chats need an explicit active task instead of a …</text><line x1="16" y1="620" x2="359" y2="620" /><text x="24" y="644" font-size="14" fill="#000" stroke="none" font-weight="600">Direct messages</text><text x="24" y="665" font-size="12" fill="#666" stroke="none" >First message creates the active</text>
<text x="24" y="681" font-size="12" fill="#666" stroke="none" >issue.</text><rect x="239" y="632" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="662" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Active task</text>
