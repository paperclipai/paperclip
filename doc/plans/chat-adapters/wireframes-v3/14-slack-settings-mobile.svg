<text x="24" y="1325" font-size="12" fill="#666" stroke="none" >denial with DM fallback.</text><rect x="239" y="1276" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1306" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">On</text>
