    <text x="48" y="486" font-size="12" fill="#666" stroke="none" font-weight="700">EACH PROVIDER</text><rect x="48" y="512" width="216" height="88" rx="6" fill="#e6e6e6"/><text x="64" y="544" font-size="14" fill="#000" stroke="none" font-weight="700">External setup</text><text x="64" y="570" font-size="12" fill="#666" stroke="none" >Provider-owned handoff</text><line x1="264" y1="556" x2="304" y2="556" /><polygon points="304,556 295,550 295,562" fill="#000" stroke="none"/><rect x="304" y="512" width="216" height="88" rx="6" fill="#fff"/><text x="320" y="544" font-size="14" fill="#000" stroke="none" font-weight="700">Settings</text><text x="320" y="570" font-size="12" fill="#666" stroke="none" >Vertical sections</text><line x1="520" y1="556" x2="560" y2="556" /><polygon points="560,556 551,550 551,562" fill="#000" stroke="none"/><rect x="560" y="512" width="240" height="88" rx="6" fill="#fff"/><text x="576" y="544" font-size="14" fill="#000" stroke="none" font-weight="700">Conversation example</text><text x="576" y="570" font-size="12" fill="#666" stroke="none" >What people see</text>
