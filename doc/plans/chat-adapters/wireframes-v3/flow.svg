<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect width="1280" height="900"/><text x="48" y="48" font-size="28" fill="#000" stroke="none" font-weight="700">Chat connectors · consolidated review flow</text><text x="48" y="76" font-size="14" fill="#666" stroke="none" >One shared start, then provider-specific setup and settings; shared Paperclip operations appear once.</text>
