<svg xmlns="http://www.w3.org/2000/svg" width="375" height="2112" viewBox="0 0 375 2112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect width="375" height="2112"/><rect x="0" y="0" width="375" height="56" rx="6" /><text x="16" y="35" font-size="14" fill="#000" stroke="none" font-weight="600">‹  Maya on GitHub</text><text x="359" y="35" font-size="12" fill="#666" stroke="none" text-anchor="end">Menu</text><text x="16" y="92" font-size="20" fill="#000" stroke="none" font-weight="700">GitHub conversation settings</text><text x="16" y="120" font-size="12" fill="#666" stroke="none" >Provider-specific settings</text><text x="16" y="182" font-size="20" fill="#000" stroke="none" font-weight="700">Repositories and conversation surfaces</text><text x="16" y="208" font-size="12" fill="#666" stroke="none" >Paperclip narrows the repositories selected in the GitH…</text><line x1="16" y1="222" x2="359" y2="222" /><text x="24" y="246" font-size="14" fill="#000" stroke="none" font-weight="600">GitHub installation</text><text x="24" y="267" font-size="12" fill="#666" stroke="none" >The App installation and its</text>
<text x="24" y="283" font-size="12" fill="#666" stroke="none" >selected repositories.</text><rect x="239" y="234" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="264" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Acme org</text>
<line x1="24" y1="304" x2="351" y2="304" stroke="#e6e6e6"/><text x="24" y="328" font-size="14" fill="#000" stroke="none" font-weight="600">Allowed repositories</text><text x="24" y="349" font-size="12" fill="#666" stroke="none" >Only these installed</text>
<text x="24" y="365" font-size="12" fill="#666" stroke="none" >repositories may activate Maya.</text><rect x="239" y="316" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="346" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">2 repos</text>
<line x1="24" y1="386" x2="351" y2="386" stroke="#e6e6e6"/><text x="24" y="410" font-size="14" fill="#000" stroke="none" font-weight="600">Conversation types</text><text x="24" y="431" font-size="12" fill="#666" stroke="none" >Issues, PR conversations, and</text>
<text x="24" y="447" font-size="12" fill="#666" stroke="none" >inline review threads.</text><rect x="239" y="398" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="428" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">3 types</text>
<line x1="24" y1="468" x2="351" y2="468" stroke="#e6e6e6"/><text x="24" y="492" font-size="14" fill="#000" stroke="none" font-weight="600">GitHub host</text><text x="24" y="513" font-size="12" fill="#666" stroke="none" >GitHub.com or a verified</text>
<text x="24" y="529" font-size="12" fill="#666" stroke="none" >Enterprise Server base URL.</text><rect x="239" y="480" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="510" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">GitHub.com</text>
<text x="16" y="580" font-size="20" fill="#000" stroke="none" font-weight="700">Conversation and task boundaries</text><text x="16" y="606" font-size="12" fill="#666" stroke="none" >GitHub already owns the native thread; Paperclip never …</text><line x1="16" y1="620" x2="359" y2="620" /><text x="24" y="644" font-size="14" fill="#000" stroke="none" font-weight="600">Activation</text><text x="24" y="665" font-size="12" fill="#666" stroke="none" >A direct @maya comment binds the</text>
<text x="24" y="681" font-size="12" fill="#666" stroke="none" >addressed object or thread.</text><rect x="239" y="632" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="662" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Mention</text>
<line x1="24" y1="702" x2="351" y2="702" stroke="#e6e6e6"/><text x="24" y="726" font-size="14" fill="#000" stroke="none" font-weight="600">Pull requests</text><text x="24" y="747" font-size="12" fill="#666" stroke="none" >PR conversation and inline</text>
<text x="24" y="763" font-size="12" fill="#666" stroke="none" >review threads stay distinct.</text><rect x="239" y="714" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="744" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Separate</text>
<line x1="24" y1="784" x2="351" y2="784" stroke="#e6e6e6"/><text x="24" y="808" font-size="14" fill="#000" stroke="none" font-weight="600">Additional automation</text><text x="24" y="829" font-size="12" fill="#666" stroke="none" >Labels or trusted authors can</text>
<text x="24" y="845" font-size="12" fill="#666" stroke="none" >start work only if enabled.</text><rect x="239" y="796" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="826" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Off</text>
<text x="16" y="896" font-size="20" fill="#000" stroke="none" font-weight="700">Responses and interactions</text><text x="16" y="922" font-size="12" fill="#666" stroke="none" >Use GitHub-native comments and make unsupported chat fe…</text><line x1="16" y1="936" x2="359" y2="936" /><text x="24" y="960" font-size="14" fill="#000" stroke="none" font-weight="600">Acknowledgement</text><text x="24" y="981" font-size="12" fill="#666" stroke="none" >Add a reaction after the webhook</text>
<text x="24" y="997" font-size="12" fill="#666" stroke="none" >delivery is accepted.</text><rect x="239" y="948" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="978" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Reaction</text>
<line x1="24" y1="1018" x2="351" y2="1018" stroke="#e6e6e6"/><text x="24" y="1042" font-size="14" fill="#000" stroke="none" font-weight="600">Progress</text><text x="24" y="1063" font-size="12" fill="#666" stroke="none" >Edit one GFM comment at a coarse</text>
<text x="24" y="1079" font-size="12" fill="#666" stroke="none" >cadence.</text><rect x="239" y="1030" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1060" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">One comment</text>
<line x1="24" y1="1100" x2="351" y2="1100" stroke="#e6e6e6"/><text x="24" y="1124" font-size="14" fill="#000" stroke="none" font-weight="600">Final response</text><text x="24" y="1145" font-size="12" fill="#666" stroke="none" >Complete the same comment or</text>
<text x="24" y="1161" font-size="12" fill="#666" stroke="none" >post one final comment.</text><rect x="239" y="1112" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1142" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Edit</text>
<line x1="24" y1="1182" x2="351" y2="1182" stroke="#e6e6e6"/><text x="24" y="1206" font-size="14" fill="#000" stroke="none" font-weight="600">Files</text><text x="24" y="1227" font-size="12" fill="#666" stroke="none" >Publish signed Paperclip</text>
<text x="24" y="1243" font-size="12" fill="#666" stroke="none" >artifact links; no adapter</text><rect x="239" y="1194" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1224" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Links</text>
<line x1="24" y1="1264" x2="351" y2="1264" stroke="#e6e6e6"/><text x="24" y="1288" font-size="14" fill="#000" stroke="none" font-weight="600">Governed actions</text><text x="24" y="1309" font-size="12" fill="#666" stroke="none" >Send users to authenticated</text>
<text x="24" y="1325" font-size="12" fill="#666" stroke="none" >Paperclip pages.</text><rect x="239" y="1276" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1306" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Links</text>
<text x="16" y="1376" font-size="20" fill="#000" stroke="none" font-weight="700">App security and delivery</text><text x="16" y="1402" font-size="12" fill="#666" stroke="none" >The chat App has no implicit repository-code authority.</text><line x1="16" y1="1416" x2="359" y2="1416" /><text x="24" y="1440" font-size="14" fill="#000" stroke="none" font-weight="600">App permissions</text><text x="24" y="1461" font-size="12" fill="#666" stroke="none" >Issues and Pull requests write;</text>
<text x="24" y="1477" font-size="12" fill="#666" stroke="none" >Metadata read.</text><rect x="239" y="1428" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1458" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Minimum</text>
<line x1="24" y1="1498" x2="351" y2="1498" stroke="#e6e6e6"/><text x="24" y="1522" font-size="14" fill="#000" stroke="none" font-weight="600">Code/tool access</text><text x="24" y="1543" font-size="12" fill="#666" stroke="none" >Contents and code actions</text>
<text x="24" y="1559" font-size="12" fill="#666" stroke="none" >require a separate tool</text><rect x="239" y="1510" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1540" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Separate</text>
<line x1="24" y1="1580" x2="351" y2="1580" stroke="#e6e6e6"/><text x="24" y="1604" font-size="14" fill="#000" stroke="none" font-weight="600">Webhook</text><text x="24" y="1625" font-size="12" fill="#666" stroke="none" >Verify signature and delivery</text>
<text x="24" y="1641" font-size="12" fill="#666" stroke="none" >ID; suppress self messages.</text><rect x="239" y="1592" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1622" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Healthy</text>
<line x1="24" y1="1662" x2="351" y2="1662" stroke="#e6e6e6"/><text x="24" y="1686" font-size="14" fill="#000" stroke="none" font-weight="600">Installation health</text><text x="24" y="1707" font-size="12" fill="#666" stroke="none" >Track suspension, permission</text>
<text x="24" y="1723" font-size="12" fill="#666" stroke="none" >drift, and rate limits.</text><rect x="239" y="1674" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1704" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Healthy</text>
<text x="16" y="1774" font-size="20" fill="#000" stroke="none" font-weight="700">Fallbacks</text><text x="16" y="1800" font-size="12" fill="#666" stroke="none" >GitHub is asynchronous and comment-shaped.</text><line x1="16" y1="1814" x2="359" y2="1814" /><text x="24" y="1838" font-size="14" fill="#000" stroke="none" font-weight="600">Unsupported chat features</text><text x="24" y="1859" font-size="12" fill="#666" stroke="none" >No native stream, DM, ephemeral,</text>
<text x="24" y="1875" font-size="12" fill="#666" stroke="none" >modal, or SDK button: use GFM</text><rect x="239" y="1826" width="112" height="48" rx="6" fill="#fff"/><text x="295" y="1856" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Explain</text><rect x="16" y="2040" width="343" height="48" rx="6" fill="#000"/><text x="187.5" y="2070" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Save changes</text><g data-region="annotations"><rect x="8" y="152" width="359" height="406" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="152" r="9" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="156" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
