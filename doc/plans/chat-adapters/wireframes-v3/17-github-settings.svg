<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1680" viewBox="0 0 1280 1680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect width="1280" height="1680"/><g><text x="24" y="38" font-size="20" fill="#000" stroke="none" font-weight="700">Paperclip</text><circle cx="32" cy="68" r="6" fill="#e6e6e6"/><text x="52" y="73" font-size="14" fill="#666" stroke="none" >New Task</text>
<circle cx="32" cy="114" r="6" fill="#e6e6e6"/><text x="52" y="119" font-size="14" fill="#666" stroke="none" >Search</text>
<circle cx="32" cy="160" r="6" fill="#e6e6e6"/><text x="52" y="165" font-size="14" fill="#666" stroke="none" >Dashboard</text>
<circle cx="32" cy="206" r="6" fill="#e6e6e6"/><text x="52" y="211" font-size="14" fill="#666" stroke="none" >Inbox</text>
<circle cx="32" cy="252" r="6" fill="#e6e6e6"/><text x="52" y="257" font-size="14" fill="#666" stroke="none" >Tasks</text>
<circle cx="32" cy="298" r="6" fill="#e6e6e6"/><text x="52" y="303" font-size="14" fill="#666" stroke="none" >Projects</text>
<circle cx="32" cy="344" r="6" fill="#e6e6e6"/><text x="52" y="349" font-size="14" fill="#666" stroke="none" >Routines</text>
<circle cx="32" cy="390" r="6" fill="#e6e6e6"/><text x="52" y="395" font-size="14" fill="#666" stroke="none" >Artifacts</text>
<circle cx="32" cy="436" r="6" fill="#e6e6e6"/><text x="52" y="441" font-size="14" fill="#666" stroke="none" >Agents</text>
<circle cx="32" cy="482" r="6" fill="#e6e6e6"/><text x="52" y="487" font-size="14" fill="#666" stroke="none" >Skills</text>
<rect x="12" y="510" width="216" height="38" rx="6" fill="#e6e6e6"/><circle cx="32" cy="528" r="6" fill="#e6e6e6"/><text x="52" y="533" font-size="14" fill="#000" stroke="none" font-weight="600">Connectors</text>
<circle cx="32" cy="574" r="6" fill="#e6e6e6"/><text x="52" y="579" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="1624" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="1652" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1680" /></g><g><line x1="240" y1="60" x2="1280" y2="60" /><text x="264" y="36" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  Maya on GitHub  ›  Settings</text><circle cx="1240" cy="30" r="16" fill="#e6e6e6"/></g><g><text x="264" y="94" font-size="12" fill="#666" stroke="none" >‹  All connectors</text><circle cx="280" cy="132" r="18" fill="#e6e6e6"/><text x="308" y="138" font-size="14" fill="#000" stroke="none" font-weight="700">Maya on GitHub</text><text x="280" y="194" font-size="14" fill="#666" stroke="none" >Overview</text>
<rect x="252" y="216" width="216" height="40" rx="6" fill="#e6e6e6"/><text x="280" y="242" font-size="14" fill="#000" stroke="none" font-weight="600">Settings</text>
<text x="280" y="290" font-size="14" fill="#666" stroke="none" >Access</text>
<text x="280" y="338" font-size="14" fill="#666" stroke="none" >Conversations</text>
<text x="280" y="386" font-size="14" fill="#666" stroke="none" >Activity</text><line x1="480" y1="60" x2="480" y2="1680" /></g><text x="504" y="108" font-size="28" fill="#000" stroke="none" font-weight="700">GitHub conversation settings</text><text x="504" y="138" font-size="14" fill="#666" stroke="none" >Choose repositories, activation surfaces, and comment behavior.</text><text x="504" y="200" font-size="20" fill="#000" stroke="none" font-weight="700">Repositories and conversation surfaces</text><text x="504" y="224" font-size="12" fill="#666" stroke="none" >Paperclip narrows the repositories selected in the GitHub App installation.</text><line x1="504" y1="240" x2="1224" y2="240" /><text x="520" y="262" font-size="14" fill="#000" stroke="none" font-weight="600">GitHub installation</text><text x="520" y="283" font-size="12" fill="#666" stroke="none" >The App installation and its selected repositories.</text><rect x="1024" y="244" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="274" font-size="12" fill="#000" stroke="none" font-weight="600">Acme org</text><text x="1192" y="274" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="296" x2="1208" y2="296" stroke="#e6e6e6"/><text x="520" y="318" font-size="14" fill="#000" stroke="none" font-weight="600">Allowed repositories</text><text x="520" y="339" font-size="12" fill="#666" stroke="none" >Only these installed repositories may activate Maya.</text><rect x="1024" y="300" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="330" font-size="12" fill="#000" stroke="none" font-weight="600">2 repos</text><text x="1192" y="330" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="352" x2="1208" y2="352" stroke="#e6e6e6"/><text x="520" y="374" font-size="14" fill="#000" stroke="none" font-weight="600">Conversation types</text><text x="520" y="395" font-size="12" fill="#666" stroke="none" >Issues, PR conversations, and inline review threads.</text><rect x="1024" y="356" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="386" font-size="12" fill="#000" stroke="none" font-weight="600">3 types</text><text x="1192" y="386" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="408" x2="1208" y2="408" stroke="#e6e6e6"/><text x="520" y="430" font-size="14" fill="#000" stroke="none" font-weight="600">GitHub host</text><text x="520" y="451" font-size="12" fill="#666" stroke="none" >GitHub.com or a verified Enterprise Server base URL.</text><rect x="1024" y="412" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="442" font-size="12" fill="#000" stroke="none" font-weight="600">GitHub.com</text><text x="1192" y="442" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<text x="504" y="496" font-size="20" fill="#000" stroke="none" font-weight="700">Conversation and task boundaries</text><text x="504" y="520" font-size="12" fill="#666" stroke="none" >GitHub already owns the native thread; Paperclip never manufactures another.</text><line x1="504" y1="536" x2="1224" y2="536" /><text x="520" y="558" font-size="14" fill="#000" stroke="none" font-weight="600">Activation</text><text x="520" y="579" font-size="12" fill="#666" stroke="none" >A direct @maya comment binds the addressed object or thread.</text><rect x="1024" y="540" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="570" font-size="12" fill="#000" stroke="none" font-weight="600">Mention</text><text x="1192" y="570" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="592" x2="1208" y2="592" stroke="#e6e6e6"/><text x="520" y="614" font-size="14" fill="#000" stroke="none" font-weight="600">Pull requests</text><text x="520" y="635" font-size="12" fill="#666" stroke="none" >PR conversation and inline review threads stay distinct.</text><rect x="1024" y="596" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="626" font-size="12" fill="#000" stroke="none" font-weight="600">Separate</text><text x="1192" y="626" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="648" x2="1208" y2="648" stroke="#e6e6e6"/><text x="520" y="670" font-size="14" fill="#000" stroke="none" font-weight="600">Additional automation</text><text x="520" y="691" font-size="12" fill="#666" stroke="none" >Labels or trusted authors can start work only if enabled.</text><rect x="1024" y="652" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="682" font-size="12" fill="#000" stroke="none" font-weight="600">Off</text><text x="1192" y="682" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<text x="504" y="736" font-size="20" fill="#000" stroke="none" font-weight="700">Responses and interactions</text><text x="504" y="760" font-size="12" fill="#666" stroke="none" >Use GitHub-native comments and make unsupported chat features explicit.</text><line x1="504" y1="776" x2="1224" y2="776" /><text x="520" y="798" font-size="14" fill="#000" stroke="none" font-weight="600">Acknowledgement</text><text x="520" y="819" font-size="12" fill="#666" stroke="none" >Add a reaction after the webhook delivery is accepted.</text><rect x="1024" y="780" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="810" font-size="12" fill="#000" stroke="none" font-weight="600">Reaction</text><text x="1192" y="810" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="832" x2="1208" y2="832" stroke="#e6e6e6"/><text x="520" y="854" font-size="14" fill="#000" stroke="none" font-weight="600">Progress</text><text x="520" y="875" font-size="12" fill="#666" stroke="none" >Edit one GFM comment at a coarse cadence.</text><rect x="1024" y="836" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="866" font-size="12" fill="#000" stroke="none" font-weight="600">One comment</text><text x="1192" y="866" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="888" x2="1208" y2="888" stroke="#e6e6e6"/><text x="520" y="910" font-size="14" fill="#000" stroke="none" font-weight="600">Final response</text><text x="520" y="931" font-size="12" fill="#666" stroke="none" >Complete the same comment or post one final comment.</text><rect x="1024" y="892" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="922" font-size="12" fill="#000" stroke="none" font-weight="600">Edit</text><text x="1192" y="922" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="944" x2="1208" y2="944" stroke="#e6e6e6"/><text x="520" y="966" font-size="14" fill="#000" stroke="none" font-weight="600">Files</text><text x="520" y="987" font-size="12" fill="#666" stroke="none" >Publish signed Paperclip artifact links; no adapter upload.</text><rect x="1024" y="948" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="978" font-size="12" fill="#000" stroke="none" font-weight="600">Links</text><text x="1192" y="978" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="1000" x2="1208" y2="1000" stroke="#e6e6e6"/><text x="520" y="1022" font-size="14" fill="#000" stroke="none" font-weight="600">Governed actions</text><text x="520" y="1043" font-size="12" fill="#666" stroke="none" >Send users to authenticated Paperclip pages.</text><rect x="1024" y="1004" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="1034" font-size="12" fill="#000" stroke="none" font-weight="600">Links</text><text x="1192" y="1034" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<text x="504" y="1088" font-size="20" fill="#000" stroke="none" font-weight="700">App security and delivery</text><text x="504" y="1112" font-size="12" fill="#666" stroke="none" >The chat App has no implicit repository-code authority.</text><line x1="504" y1="1128" x2="1224" y2="1128" /><text x="520" y="1150" font-size="14" fill="#000" stroke="none" font-weight="600">App permissions</text><text x="520" y="1171" font-size="12" fill="#666" stroke="none" >Issues and Pull requests write; Metadata read.</text><rect x="1024" y="1132" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="1162" font-size="12" fill="#000" stroke="none" font-weight="600">Minimum</text><text x="1192" y="1162" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="1184" x2="1208" y2="1184" stroke="#e6e6e6"/><text x="520" y="1206" font-size="14" fill="#000" stroke="none" font-weight="600">Code/tool access</text><text x="520" y="1227" font-size="12" fill="#666" stroke="none" >Contents and code actions require a separate tool connection.</text><rect x="1024" y="1188" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="1218" font-size="12" fill="#000" stroke="none" font-weight="600">Separate</text><text x="1192" y="1218" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="1240" x2="1208" y2="1240" stroke="#e6e6e6"/><text x="520" y="1262" font-size="14" fill="#000" stroke="none" font-weight="600">Webhook</text><text x="520" y="1283" font-size="12" fill="#666" stroke="none" >Verify signature and delivery ID; suppress self messages.</text><rect x="1024" y="1244" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="1274" font-size="12" fill="#000" stroke="none" font-weight="600">Healthy</text><text x="1192" y="1274" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<line x1="520" y1="1296" x2="1208" y2="1296" stroke="#e6e6e6"/><text x="520" y="1318" font-size="14" fill="#000" stroke="none" font-weight="600">Installation health</text><text x="520" y="1339" font-size="12" fill="#666" stroke="none" >Track suspension, permission drift, and rate limits.</text><rect x="1024" y="1300" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="1330" font-size="12" fill="#000" stroke="none" font-weight="600">Healthy</text><text x="1192" y="1330" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text>
<text x="504" y="1384" font-size="20" fill="#000" stroke="none" font-weight="700">Fallbacks</text><text x="504" y="1408" font-size="12" fill="#666" stroke="none" >GitHub is asynchronous and comment-shaped.</text><line x1="504" y1="1424" x2="1224" y2="1424" /><text x="520" y="1446" font-size="14" fill="#000" stroke="none" font-weight="600">Unsupported chat features</text><text x="520" y="1467" font-size="12" fill="#666" stroke="none" >No native stream, DM, ephemeral, modal, or SDK button: use GFM text plus a Paperclip link.</text><rect x="1024" y="1428" width="184" height="48" rx="6" fill="#fff"/><text x="1040" y="1458" font-size="12" fill="#000" stroke="none" font-weight="600">Explain</text><text x="1192" y="1458" font-size="12" fill="#666" stroke="none" text-anchor="end">⌄</text><rect x="1048" y="1608" width="176" height="48" rx="6" fill="#000"/><text x="1136" y="1638" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Save changes</text><text x="504" y="1638" font-size="12" fill="#666" stroke="none" >Internal reasoning and tool traces are never published.</text><g data-region="annotations"><rect x="496" y="168" width="736" height="304" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="168" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="172" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
<rect x="496" y="464" width="736" height="248" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="464" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="468" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">2</text>
<rect x="496" y="704" width="736" height="360" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="704" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="708" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text>
<rect x="496" y="1056" width="736" height="304" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="1056" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="1060" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">4</text>
<rect x="496" y="1352" width="736" height="136" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="1352" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="1356" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">5</text></g></svg>
