<text x="264" y="1112" font-size="12" fill="#666" stroke="none" >Progress is saved automatically.</text><text x="560" y="112" font-size="28" fill="#000" stroke="none" font-weight="700">Connect an existing GitHub App</text>
<text x="560" y="144" font-size="14" fill="#666" stroke="none" >Advanced path for organizations that already own and govern the dedicated chat App.</text>
<text x="560" y="192" font-size="14" fill="#000" stroke="none" font-weight="600">GitHub App ID</text><rect x="560" y="208" width="640" height="48" rx="4" fill="#fff"/><text x="576" y="238" font-size="14" fill="#666" stroke="none" >123456</text><text x="560" y="280" font-size="12" fill="#666" stroke="none" >Identifies the customer-owned App registration.</text>
<text x="560" y="328" font-size="14" fill="#000" stroke="none" font-weight="600">Private key</text><rect x="560" y="344" width="640" height="48" rx="4" fill="#fff"/><text x="576" y="374" font-size="14" fill="#666" stroke="none" >Choose PEM file</text><text x="560" y="416" font-size="12" fill="#666" stroke="none" >Signs installation-token requests; uploaded once into the secret store.</text>
<text x="560" y="464" font-size="14" fill="#000" stroke="none" font-weight="600">Webhook secret</text><rect x="560" y="480" width="640" height="48" rx="4" fill="#fff"/><text x="576" y="510" font-size="14" fill="#666" stroke="none" >••••••••••••</text><text x="560" y="552" font-size="12" fill="#666" stroke="none" >Verifies inbound GitHub webhook signatures.</text>
<text x="560" y="600" font-size="14" fill="#000" stroke="none" font-weight="600">GitHub host</text><rect x="560" y="616" width="640" height="48" rx="4" fill="#fff"/><text x="576" y="646" font-size="14" fill="#666" stroke="none" >https://github.com</text><text x="560" y="688" font-size="12" fill="#666" stroke="none" >Change only for GitHub Enterprise Server.</text>
<text x="560" y="744" font-size="20" fill="#000" stroke="none" font-weight="700">Required App configuration</text>
<text x="560" y="768" font-size="12" fill="#666" stroke="none" >Paperclip verifies rather than asks the user to re-enter provider configuration.</text>
<line x1="560" y1="792" x2="1224" y2="792" />
<text x="576" y="816" font-size="14" fill="#000" stroke="none" font-weight="600">Webhook and events</text>
<text x="576" y="838" font-size="12" fill="#666" stroke="none" >Paperclip callback · issue comments · PR review comments</text>
<text x="1208" y="820" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Will verify</text>
<line x1="576" y1="864" x2="1208" y2="864" stroke="#e6e6e6"/>
<text x="576" y="888" font-size="14" fill="#000" stroke="none" font-weight="600">Permissions</text>
<text x="576" y="910" font-size="12" fill="#666" stroke="none" >Issues write · Pull requests write · Metadata read</text>
<text x="1208" y="892" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Will verify</text>
