<text x="576" y="734" font-size="12" fill="#666" stroke="none" >Mention @maya_acme_bot; replies to Maya continue the active task.</text>
<text x="1208" y="716" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Addressed</text>
