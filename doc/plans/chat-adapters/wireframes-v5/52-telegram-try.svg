<text x="560" y="864" font-size="20" fill="#000" stroke="none" font-weight="700">Live verification</text>
<text x="560" y="888" font-size="12" fill="#666" stroke="none" >Paperclip records the first stable chat/user IDs and verifies a safe reply, post/edit</text>
