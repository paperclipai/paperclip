<line x1="288" y1="152" x2="288" y2="472" />
<circle cx="288" cy="152" r="16" fill="#000"/>
<text x="288" y="157" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="320" y="148" font-size="14" fill="#000" stroke="none" >Agent selected</text>
<circle cx="288" cy="232" r="16" fill="#000"/>
<text x="288" y="237" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="320" y="228" font-size="14" fill="#000" stroke="none" >Register Teams bot</text>
<circle cx="288" cy="312" r="16" fill="#000"/>
<text x="288" y="317" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="320" y="308" font-size="14" fill="#000" stroke="none" >Connect identity</text>
<circle cx="288" cy="392" r="16" fill="#fff"/>
<text x="288" y="397" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">4</text>
<text x="320" y="388" font-size="14" fill="#000" stroke="none" font-weight="700">Install app</text>
<circle cx="288" cy="472" r="16" fill="#fff"/>
<text x="288" y="477" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">5</text>
<text x="320" y="468" font-size="14" fill="#666" stroke="none" >Try Maya</text>
<text x="264" y="872" font-size="12" fill="#666" stroke="none" >Progress is saved automatically.</text><text x="560" y="112" font-size="28" fill="#000" stroke="none" font-weight="700">Install Maya in Microsoft Teams</text>
<text x="560" y="144" font-size="14" fill="#666" stroke="none" >Download the generated app package and let Microsoft apply tenant and scope policy.</text>
<text x="560" y="200" font-size="20" fill="#000" stroke="none" font-weight="700">Package ready</text>
<text x="560" y="224" font-size="12" fill="#666" stroke="none" >Paperclip inserted Maya's immutable identity, bot App ID, supported scopes, commands, and</text>
<text x="560" y="240" font-size="12" fill="#666" stroke="none" >icons into a validated Teams package.</text>
<line x1="560" y1="248" x2="1224" y2="248" />
<text x="576" y="272" font-size="14" fill="#000" stroke="none" font-weight="600">Agent</text>
<text x="576" y="294" font-size="12" fill="#666" stroke="none" >Maya · permanently assigned</text>
<text x="1208" y="276" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Locked</text>
<line x1="576" y1="320" x2="1208" y2="320" stroke="#e6e6e6"/>
<text x="576" y="344" font-size="14" fill="#000" stroke="none" font-weight="600">Package</text>
<text x="576" y="366" font-size="12" fill="#666" stroke="none" >maya-paperclip-teams.zip</text>
<text x="1208" y="348" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Validated</text>
<line x1="576" y1="392" x2="1208" y2="392" stroke="#e6e6e6"/>
<text x="576" y="416" font-size="14" fill="#000" stroke="none" font-weight="600">Scopes</text>
<text x="576" y="438" font-size="12" fill="#666" stroke="none" >Personal, team, and group chat</text>
<text x="1208" y="420" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Included</text>
<text x="560" y="496" font-size="20" fill="#000" stroke="none" font-weight="700">Install through Microsoft Teams</text>
<text x="560" y="520" font-size="12" fill="#666" stroke="none" >Tenant policy determines whether the operator can upload directly or must send the package</text>
<text x="560" y="536" font-size="12" fill="#666" stroke="none" >to an administrator.</text>
<line x1="560" y1="544" x2="1224" y2="544" />
<text x="576" y="568" font-size="14" fill="#000" stroke="none" font-weight="600">Self-service tenant</text>
<text x="576" y="590" font-size="12" fill="#666" stroke="none" >Upload the package under Manage your apps, then add it to the</text>
<text x="576" y="606" font-size="12" fill="#666" stroke="none" >intended scope.</text>
<text x="1208" y="572" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">In Teams</text>
<line x1="576" y1="616" x2="1208" y2="616" stroke="#e6e6e6"/>
<text x="576" y="640" font-size="14" fill="#000" stroke="none" font-weight="600">Admin-managed tenant</text>
<text x="576" y="662" font-size="12" fill="#666" stroke="none" >Send the same package to the Teams administrator for approval and</text>
<text x="576" y="678" font-size="12" fill="#666" stroke="none" >distribution.</text>
<text x="1208" y="644" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Admin action</text>
<line x1="576" y1="688" x2="1208" y2="688" stroke="#e6e6e6"/>
<text x="576" y="712" font-size="14" fill="#000" stroke="none" font-weight="600">No extra credentials</text>
<text x="576" y="734" font-size="12" fill="#666" stroke="none" >The package contains public IDs and presentation metadata, not the</text>
<text x="576" y="750" font-size="12" fill="#666" stroke="none" >client secret.</text>
<text x="1208" y="716" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Safe to share</text><rect x="560" y="832" width="208" height="48" rx="4" fill="#fff"/><text x="664" y="862" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Open Teams</text><rect x="784" y="832" width="440" height="48" rx="4" fill="#000"/><text x="1004" y="862" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Download Teams package</text><g data-region="annotations"><rect x="256" y="88" width="248" height="520" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="256" cy="88" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="256" y="92" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
