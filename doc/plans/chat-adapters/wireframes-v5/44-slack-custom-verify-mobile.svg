<text x="24" y="910" font-size="12" fill="#666" stroke="none" >Mention, message, interaction, and command</text>
<text x="24" y="926" font-size="12" fill="#666" stroke="none" >callbacks reach Paperclip.</text>
<text x="351" y="960" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Passed</text>
<text x="16" y="1008" font-size="20" fill="#000" stroke="none" font-weight="700">Delivery selected automatically</text>
<text x="16" y="1032" font-size="12" fill="#666" stroke="none" >Public instances use the verified callback</text>
<text x="16" y="1048" font-size="12" fill="#666" stroke="none" >directly; private instances use the configured</text>
<text x="16" y="1064" font-size="12" fill="#666" stroke="none" >outbound relay. Socket Mode is an…</text>
<line x1="16" y1="1064" x2="359" y2="1064" />
<text x="24" y="1088" font-size="14" fill="#000" stroke="none" font-weight="600">This instance</text>
