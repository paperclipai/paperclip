<text x="16" y="472" font-size="20" fill="#000" stroke="none" font-weight="700">Verification results</text>
<text x="16" y="496" font-size="12" fill="#666" stroke="none" >Each check has one provider-specific</text>
<text x="16" y="512" font-size="12" fill="#666" stroke="none" >remediation rather than another configuration</text>
<text x="16" y="528" font-size="12" fill="#666" stroke="none" >panel.</text>
