<text x="64" y="269" font-size="14" fill="#000" stroke="none" font-weight="700">Verify</text>
<text x="16" y="360" font-size="20" fill="#000" stroke="none" font-weight="700">Verify the custom Slack app</text>
<text x="16" y="392" font-size="12" fill="#666" stroke="none" >Paperclip checks identity, callbacks,</text>
