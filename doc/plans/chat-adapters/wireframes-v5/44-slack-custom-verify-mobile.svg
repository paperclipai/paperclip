<text x="24" y="574" font-size="12" fill="#666" stroke="none" >auth.test returned Maya in the Acme</text>
<text x="24" y="590" font-size="12" fill="#666" stroke="none" >workspace.</text>
<text x="351" y="624" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Passed</text>
