<text x="24" y="664" font-size="14" fill="#000" stroke="none" font-weight="600">Request verification</text>
<text x="24" y="686" font-size="12" fill="#666" stroke="none" >Signing challenge and timestamp validation</text>
<text x="24" y="702" font-size="12" fill="#666" stroke="none" >succeeded.</text>
<text x="351" y="736" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Passed</text>
<line x1="24" y1="752" x2="351" y2="752" stroke="#e6e6e6"/>
<text x="24" y="776" font-size="14" fill="#000" stroke="none" font-weight="600">Scopes and features</text>
<text x="24" y="798" font-size="12" fill="#666" stroke="none" >Messages, threads, reactions, files,</text>
<text x="24" y="814" font-size="12" fill="#666" stroke="none" >actions, modals, commands, and DMs.</text>
