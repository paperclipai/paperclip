<rect x="8" y="536" width="224" height="40" rx="4" fill="#e6e6e6"/><circle cx="32" cy="552" r="6" fill="#e6e6e6"/><text x="56" y="556" font-size="14" fill="#000" stroke="none" font-weight="600">Connectors</text>
<circle cx="32" cy="600" r="6" fill="#e6e6e6"/><text x="56" y="604" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="936" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="960" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="992" /></g><g data-region="topbar"><line x1="240" y1="64" x2="1280" y2="64" /><text x="264" y="40" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  Slack  ›  Chat with an agent</text><circle cx="1240" cy="32" r="16" fill="#e6e6e6"/></g><text x="264" y="104" font-size="12" fill="#666" stroke="none" font-weight="700">ADVANCED SETUP</text>
<text x="264" y="128" font-size="14" fill="#000" stroke="none" font-weight="700">Slack</text>
<line x1="520" y1="64" x2="520" y2="992" />
<line x1="288" y1="152" x2="288" y2="392" />
<circle cx="288" cy="152" r="16" fill="#000"/>
<text x="288" y="157" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="320" y="148" font-size="14" fill="#000" stroke="none" >Agent selected</text>
<circle cx="288" cy="232" r="16" fill="#fff"/>
<text x="288" y="237" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">2</text>
<text x="320" y="228" font-size="14" fill="#000" stroke="none" font-weight="700">Create Slack app</text>
<circle cx="288" cy="312" r="16" fill="#fff"/>
<text x="288" y="317" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">3</text>
<text x="320" y="308" font-size="14" fill="#666" stroke="none" >Connect app</text>
<circle cx="288" cy="392" r="16" fill="#fff"/>
<text x="288" y="397" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">4</text>
<text x="320" y="388" font-size="14" fill="#666" stroke="none" >Verify</text>
<text x="264" y="944" font-size="12" fill="#666" stroke="none" >Progress is saved automatically.</text><text x="560" y="112" font-size="28" fill="#000" stroke="none" font-weight="700">Create a custom Slack app</text>
<text x="560" y="144" font-size="14" fill="#666" stroke="none" >Advanced path for self-hosted deployments or organizations that require a customer-owned</text>
<text x="560" y="164" font-size="14" fill="#666" stroke="none" >app.</text>
<text x="560" y="200" font-size="20" fill="#000" stroke="none" font-weight="700">Agent</text>
<text x="560" y="224" font-size="12" fill="#666" stroke="none" >The custom Slack app will always represent this agent.</text>
<line x1="560" y1="248" x2="1224" y2="248" />
<text x="576" y="272" font-size="14" fill="#000" stroke="none" font-weight="600">Maya</text>
<text x="576" y="294" font-size="12" fill="#666" stroke="none" >Support engineer · a new connection is required for another agent</text>
<text x="1208" y="276" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Locked</text>
<text x="560" y="352" font-size="20" fill="#000" stroke="none" font-weight="700">Paperclip prepared the app</text>
<text x="560" y="376" font-size="12" fill="#666" stroke="none" >A versioned Slack manifest contains the bot name, callback URLs, scopes, events, actions,</text>
<text x="560" y="392" font-size="12" fill="#666" stroke="none" >modals, commands, and files configuration.</text>
<line x1="560" y1="400" x2="1224" y2="400" />
<text x="576" y="424" font-size="14" fill="#000" stroke="none" font-weight="600">App identity</text>
<text x="576" y="446" font-size="12" fill="#666" stroke="none" >Maya · unique native Slack app and mention</text>
<text x="1208" y="428" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Prepared</text>
<line x1="576" y1="472" x2="1208" y2="472" stroke="#e6e6e6"/>
<text x="576" y="496" font-size="14" fill="#000" stroke="none" font-weight="600">Callback</text>
<text x="576" y="518" font-size="12" fill="#666" stroke="none" >Chosen automatically for this Paperclip deployment.</text>
<text x="1208" y="500" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Prepared</text>
<line x1="576" y1="544" x2="1208" y2="544" stroke="#e6e6e6"/>
<text x="576" y="568" font-size="14" fill="#000" stroke="none" font-weight="600">Permissions</text>
<text x="576" y="590" font-size="12" fill="#666" stroke="none" >Maximum safe Slack chat capability set; no tool permissions.</text>
<text x="1208" y="572" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Prepared</text>
<text x="560" y="648" font-size="20" fill="#000" stroke="none" font-weight="700">Create it in Slack</text>
<text x="560" y="672" font-size="12" fill="#666" stroke="none" >The shared manifest URL opens Slack with the configuration prefilled; there is no</text>
<text x="560" y="688" font-size="12" fill="#666" stroke="none" >copy-and-paste step.</text>
<line x1="560" y1="696" x2="1224" y2="696" />
<text x="576" y="720" font-size="14" fill="#000" stroke="none" font-weight="600">Workspace owner</text>
<text x="576" y="742" font-size="12" fill="#666" stroke="none" >Slack may require an app manager or administrator to approve</text>
<text x="576" y="758" font-size="12" fill="#666" stroke="none" >creation.</text>
<text x="1208" y="724" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Provider policy</text>
<line x1="576" y1="768" x2="1208" y2="768" stroke="#e6e6e6"/>
<text x="576" y="792" font-size="14" fill="#000" stroke="none" font-weight="600">After creation</text>
<text x="576" y="814" font-size="12" fill="#666" stroke="none" >Return here for the two values Slack cannot send back through this</text>
<text x="576" y="830" font-size="12" fill="#666" stroke="none" >custom-app path.</text>
<text x="1208" y="796" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Next step</text><rect x="560" y="904" width="208" height="48" rx="4" fill="#fff"/><text x="664" y="934" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Back to Add to Slack</text><rect x="784" y="904" width="440" height="48" rx="4" fill="#000"/><text x="1004" y="934" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Open prefilled Slack setup</text><g data-region="annotations"><rect x="256" y="88" width="248" height="520" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="256" cy="88" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="256" y="92" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
