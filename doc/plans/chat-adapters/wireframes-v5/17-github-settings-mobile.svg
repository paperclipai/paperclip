<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1564" viewBox="0 0 375 1564" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect width="375" height="1564"/><rect x="0" y="0" width="375" height="56" rx="6" /><text x="16" y="35" font-size="14" fill="#000" stroke="none" font-weight="600">‹  Maya on GitHub</text><text x="359" y="35" font-size="12" fill="#666" stroke="none" text-anchor="end">Menu</text><rect x="16" y="72" width="343" height="48" rx="6" fill="#fff"/><text x="32" y="102" font-size="14" fill="#000" stroke="none" font-weight="600">Settings</text><text x="343" y="102" font-size="14" fill="#666" stroke="none" text-anchor="end">⌄</text><text x="16" y="152" font-size="20" fill="#000" stroke="none" font-weight="700">GitHub settings</text><text x="16" y="176" font-size="12" fill="#666" stroke="none" >Only scope, task boundaries, access, and</text>
<text x="16" y="192" font-size="12" fill="#666" stroke="none" >necessary provider operations.</text><text x="16" y="222" font-size="20" fill="#000" stroke="none" font-weight="700">Repository reach</text>
<text x="16" y="248" font-size="12" fill="#666" stroke="none" >Paperclip can only narrow repositories selected</text>
<text x="16" y="264" font-size="12" fill="#666" stroke="none" >in the GitHub App installation.</text>
<line x1="16" y1="276" x2="359" y2="276" />
<text x="24" y="300" font-size="14" fill="#000" stroke="none" font-weight="600">Installation</text>
<text x="24" y="322" font-size="12" fill="#666" stroke="none" >Acme organization · installation 48219</text>
<rect x="223" y="332" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="362" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Change install</text>
<line x1="24" y1="388" x2="351" y2="388" stroke="#e6e6e6"/>
<text x="24" y="412" font-size="14" fill="#000" stroke="none" font-weight="600">Allowed repositories</text>
<text x="24" y="434" font-size="12" fill="#666" stroke="none" >acme/api, acme/web</text>
<rect x="223" y="444" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="474" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">2 repositories</text>
<line x1="24" y1="500" x2="351" y2="500" stroke="#e6e6e6"/>
<text x="24" y="524" font-size="14" fill="#000" stroke="none" font-weight="600">Conversation surfaces</text>
<text x="24" y="546" font-size="12" fill="#666" stroke="none" >Issues, PR conversations, and inline review</text>
<text x="24" y="562" font-size="12" fill="#666" stroke="none" >threads.</text>
<rect x="223" y="556" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="586" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">All supported</text>
<text x="16" y="642" font-size="20" fill="#000" stroke="none" font-weight="700">Task boundaries</text>
<text x="16" y="668" font-size="12" fill="#666" stroke="none" >GitHub's existing object or review thread is</text>
<text x="16" y="684" font-size="12" fill="#666" stroke="none" >the durable conversation boundary.</text>
<line x1="16" y1="696" x2="359" y2="696" />
<text x="24" y="720" font-size="14" fill="#000" stroke="none" font-weight="600">Activation</text>
<text x="24" y="742" font-size="12" fill="#666" stroke="none" >A direct @paperclip-maya mention binds the</text>
<text x="24" y="758" font-size="12" fill="#666" stroke="none" >addressed conversation.</text>
<rect x="223" y="752" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="782" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Mention</text>
<line x1="24" y1="808" x2="351" y2="808" stroke="#e6e6e6"/>
<text x="24" y="832" font-size="14" fill="#000" stroke="none" font-weight="600">Pull requests</text>
<text x="24" y="854" font-size="12" fill="#666" stroke="none" >The PR conversation and each inline review</text>
<text x="24" y="870" font-size="12" fill="#666" stroke="none" >thread remain distinct.</text>
<rect x="223" y="864" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="894" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Separate</text>
<line x1="24" y1="920" x2="351" y2="920" stroke="#e6e6e6"/>
<text x="24" y="944" font-size="14" fill="#000" stroke="none" font-weight="600">Trusted automation</text>
<text x="24" y="966" font-size="12" fill="#666" stroke="none" >Optional label or trusted-author activation</text>
<text x="24" y="982" font-size="12" fill="#666" stroke="none" >creates work without a mention.</text>
<rect x="223" y="976" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1006" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Off</text>
<text x="16" y="1062" font-size="20" fill="#000" stroke="none" font-weight="700">Delivery and security</text>
<text x="16" y="1088" font-size="12" fill="#666" stroke="none" >These settings control the App and webhook—not</text>
<text x="16" y="1104" font-size="12" fill="#666" stroke="none" >individual response capabilities.</text>
<line x1="16" y1="1116" x2="359" y2="1116" />
<text x="24" y="1140" font-size="14" fill="#000" stroke="none" font-weight="600">GitHub host</text>
<text x="24" y="1162" font-size="12" fill="#666" stroke="none" >github.com</text>
<rect x="223" y="1172" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1202" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Change host</text>
<line x1="24" y1="1228" x2="351" y2="1228" stroke="#e6e6e6"/>
<text x="24" y="1252" font-size="14" fill="#000" stroke="none" font-weight="600">Private key</text>
<text x="24" y="1274" font-size="12" fill="#666" stroke="none" >Secret ref · github/maya-app ·•••• A19C</text>
<rect x="223" y="1284" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1314" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Rotate</text>
<line x1="24" y1="1340" x2="351" y2="1340" stroke="#e6e6e6"/>
<text x="24" y="1364" font-size="14" fill="#000" stroke="none" font-weight="600">Installation drift</text>
<text x="24" y="1386" font-size="12" fill="#666" stroke="none" >Pause affected repositories after</text>
<text x="24" y="1402" font-size="12" fill="#666" stroke="none" >suspension or permission change.</text>
<rect x="223" y="1396" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1426" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Automatic</text><rect x="16" y="1492" width="343" height="48" rx="6" fill="#000"/><text x="187.5" y="1522" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Save changes</text><g data-region="annotations"><rect x="8" y="192" width="359" height="428" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="192" r="9" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="196" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
<rect x="8" y="612" width="359" height="428" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="612" r="9" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="616" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">2</text>
<rect x="8" y="1032" width="359" height="428" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="1032" r="9" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="1036" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text></g></svg>
