<text x="24" y="838" font-size="12" fill="#666" stroke="none" >Authenticated Bot Framework activity</text>
<text x="351" y="888" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Passed</text>
<line x1="24" y1="904" x2="351" y2="904" stroke="#e6e6e6"/>
<text x="24" y="928" font-size="14" fill="#000" stroke="none" font-weight="600">Teams installation</text>
<text x="24" y="950" font-size="12" fill="#666" stroke="none" >No message received from an installed scope</text>
<text x="24" y="966" font-size="12" fill="#666" stroke="none" >yet.</text>
<text x="351" y="1000" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Waiting</text>
<text x="16" y="1048" font-size="20" fill="#000" stroke="none" font-weight="700">Start the first task</text>
<text x="16" y="1072" font-size="12" fill="#666" stroke="none" >The test reflects the conversation type people</text>
<text x="16" y="1088" font-size="12" fill="#666" stroke="none" >will use.</text>
