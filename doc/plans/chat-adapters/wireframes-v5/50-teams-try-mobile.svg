<text x="24" y="1150" font-size="12" fill="#666" stroke="none" >Create a new post with @Maya; its replies</text>
<text x="24" y="1166" font-size="12" fill="#666" stroke="none" >become one Paperclip task.</text>
<text x="351" y="1200" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Post thread</text>
<line x1="24" y1="1216" x2="351" y2="1216" stroke="#e6e6e6"/>
<text x="24" y="1240" font-size="14" fill="#000" stroke="none" font-weight="600">Personal or group chat</text>
<text x="24" y="1262" font-size="12" fill="#666" stroke="none" >Send a message; the conversation exposes</text>
