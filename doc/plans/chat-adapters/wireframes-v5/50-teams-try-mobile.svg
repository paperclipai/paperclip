<text x="32" y="269" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="64" y="269" font-size="14" fill="#000" stroke="none" >Install app</text>
<circle cx="32" cy="320" r="16" fill="#fff"/>
<text x="32" y="325" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">5</text>
<text x="64" y="325" font-size="14" fill="#000" stroke="none" font-weight="700">Try Maya</text>
<text x="16" y="416" font-size="20" fill="#000" stroke="none" font-weight="700">Try Maya in Microsoft Teams</text>
<text x="16" y="448" font-size="12" fill="#666" stroke="none" >Mention Maya in an installed channel post or</text>
<text x="16" y="464" font-size="12" fill="#666" stroke="none" >start a personal chat.</text>
<text x="16" y="512" font-size="20" fill="#000" stroke="none" font-weight="700">Installation checks</text>
<text x="16" y="536" font-size="12" fill="#666" stroke="none" >Paperclip verifies Microsoft identity and</text>
<text x="16" y="552" font-size="12" fill="#666" stroke="none" >waits for the installed package to deliver a</text>
<text x="16" y="568" font-size="12" fill="#666" stroke="none" >real activity.</text>
