<text x="351" y="1312" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Active task</text>
<line x1="24" y1="1328" x2="351" y2="1328" stroke="#e6e6e6"/>
<text x="24" y="1352" font-size="14" fill="#000" stroke="none" font-weight="600">Unmentioned channel replies</text>
<text x="24" y="1374" font-size="12" fill="#666" stroke="none" >Paperclip detects actual manifest/RSC</text>
<text x="24" y="1390" font-size="12" fill="#666" stroke="none" >delivery and explains if another mention is…</text>
<text x="351" y="1424" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Verified live</text>
<rect x="16" y="1480" width="343" height="48" rx="4" fill="#fff"/><text x="187.5" y="1510" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Finish without testing</text>
