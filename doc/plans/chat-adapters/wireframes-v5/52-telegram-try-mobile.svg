<text x="24" y="536" font-size="14" fill="#000" stroke="none" font-weight="600">Agent</text>
<text x="24" y="558" font-size="12" fill="#666" stroke="none" >Maya · permanently assigned</text>
<text x="351" y="608" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Locked</text>
<line x1="24" y1="624" x2="351" y2="624" stroke="#e6e6e6"/>
<text x="24" y="648" font-size="14" fill="#000" stroke="none" font-weight="600">Bot API</text>
<text x="24" y="670" font-size="12" fill="#666" stroke="none" >getMe and command registration</text>
<text x="351" y="720" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Passed</text>
