<text x="24" y="760" font-size="14" fill="#000" stroke="none" font-weight="600">Delivery</text>
<text x="24" y="782" font-size="12" fill="#666" stroke="none" >Secret-token webhook · zero pending updates</text>
<text x="351" y="832" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Passed</text>
<line x1="24" y1="848" x2="351" y2="848" stroke="#e6e6e6"/>
<text x="24" y="872" font-size="14" fill="#000" stroke="none" font-weight="600">First addressed update</text>
<text x="24" y="894" font-size="12" fill="#666" stroke="none" >No test message received yet.</text>
<text x="351" y="944" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Waiting</text>
<text x="16" y="992" font-size="20" fill="#000" stroke="none" font-weight="700">Start the first task</text>
<text x="16" y="1016" font-size="12" fill="#666" stroke="none" >Choose one native Telegram context.</text>
<line x1="16" y1="1048" x2="359" y2="1048" />
<text x="24" y="1072" font-size="14" fill="#000" stroke="none" font-weight="600">Direct message</text>
<text x="24" y="1094" font-size="12" fill="#666" stroke="none" >Send any message; it creates Maya's active</text>
<text x="24" y="1110" font-size="12" fill="#666" stroke="none" >Paperclip task.</text>
<text x="351" y="1144" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">DM</text>
<line x1="24" y1="1160" x2="351" y2="1160" stroke="#e6e6e6"/>
<text x="24" y="1184" font-size="14" fill="#000" stroke="none" font-weight="600">Ordinary group</text>
<text x="24" y="1206" font-size="12" fill="#666" stroke="none" >Mention @maya_acme_bot; replies to Maya</text>
<text x="24" y="1222" font-size="12" fill="#666" stroke="none" >continue the active task.</text>
<text x="351" y="1256" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Addressed</text>
<line x1="24" y1="1272" x2="351" y2="1272" stroke="#e6e6e6"/>
<text x="24" y="1296" font-size="14" fill="#000" stroke="none" font-weight="600">Forum topic</text>
<text x="24" y="1318" font-size="12" fill="#666" stroke="none" >Mention Maya inside a topic;</text>
<text x="24" y="1334" font-size="12" fill="#666" stroke="none" >message_thread_id becomes the issue…</text>
<text x="351" y="1368" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Topic</text>
<text x="16" y="1416" font-size="20" fill="#000" stroke="none" font-weight="700">Live verification</text>
<text x="16" y="1440" font-size="12" fill="#666" stroke="none" >Paperclip records the first stable chat/user</text>
<text x="16" y="1456" font-size="12" fill="#666" stroke="none" >IDs and verifies a safe reply, post/edit</text>
<text x="16" y="1472" font-size="12" fill="#666" stroke="none" >behavior, and callbacks.</text>
