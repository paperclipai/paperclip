<text x="64" y="269" font-size="14" fill="#000" stroke="none" font-weight="700">Try Maya</text>
<text x="16" y="360" font-size="20" fill="#000" stroke="none" font-weight="700">Try Maya in Telegram</text>
<text x="16" y="392" font-size="12" fill="#666" stroke="none" >Send one addressed message so Paperclip can</text>
<text x="16" y="408" font-size="12" fill="#666" stroke="none" >verify the bot, chat, and task boundary.</text>
<text x="16" y="456" font-size="20" fill="#000" stroke="none" font-weight="700">Connection checks</text>
<text x="16" y="480" font-size="12" fill="#666" stroke="none" >Provider identity, delivery, and privacy are</text>
<text x="16" y="496" font-size="12" fill="#666" stroke="none" >ready before the first task.</text>
