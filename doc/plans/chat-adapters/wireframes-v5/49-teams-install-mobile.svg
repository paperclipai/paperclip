<rect x="8" y="904" width="359" height="424" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="904" r="8" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="908" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text>
