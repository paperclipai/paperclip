<circle cx="32" cy="600" r="6" fill="#e6e6e6"/><text x="56" y="604" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="1080" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="1104" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1136" /></g><g data-region="topbar"><line x1="240" y1="64" x2="1280" y2="64" /><text x="264" y="40" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  GitHub  ›  Chat with an agent</text><circle cx="1240" cy="32" r="16" fill="#e6e6e6"/></g><text x="264" y="104" font-size="12" fill="#666" stroke="none" font-weight="700">SETUP</text>
<text x="264" y="128" font-size="14" fill="#000" stroke="none" font-weight="700">GitHub</text>
<line x1="520" y1="64" x2="520" y2="1136" />
<line x1="288" y1="152" x2="288" y2="392" />
<circle cx="288" cy="152" r="16" fill="#000"/>
<text x="288" y="157" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="320" y="148" font-size="14" fill="#000" stroke="none" >Agent selected</text>
<circle cx="288" cy="232" r="16" fill="#000"/>
<text x="288" y="237" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="320" y="228" font-size="14" fill="#000" stroke="none" >Create GitHub App</text>
<circle cx="288" cy="312" r="16" fill="#fff"/>
<text x="288" y="317" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">3</text>
<text x="320" y="308" font-size="14" fill="#000" stroke="none" font-weight="700">Choose repositories</text>
<circle cx="288" cy="392" r="16" fill="#fff"/>
<text x="288" y="397" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">4</text>
<text x="320" y="388" font-size="14" fill="#666" stroke="none" >Try Maya</text>
<text x="264" y="1088" font-size="12" fill="#666" stroke="none" >Progress is saved automatically.</text><text x="560" y="112" font-size="28" fill="#000" stroke="none" font-weight="700">Choose GitHub repositories</text>
<text x="560" y="144" font-size="14" fill="#666" stroke="none" >Install Maya on an organization or account, then choose all or selected repositories in</text>
<text x="560" y="164" font-size="14" fill="#666" stroke="none" >GitHub.</text>
<text x="560" y="200" font-size="20" fill="#000" stroke="none" font-weight="700">App created</text>
<text x="560" y="224" font-size="12" fill="#666" stroke="none" >GitHub returned the dedicated App configuration successfully.</text>
<line x1="560" y1="248" x2="1224" y2="248" />
<text x="576" y="272" font-size="14" fill="#000" stroke="none" font-weight="600">Agent</text>
<text x="576" y="294" font-size="12" fill="#666" stroke="none" >Maya · permanently assigned</text>
<text x="1208" y="276" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Locked</text>
<line x1="576" y1="320" x2="1208" y2="320" stroke="#e6e6e6"/>
<text x="576" y="344" font-size="14" fill="#000" stroke="none" font-weight="600">GitHub App</text>
<text x="576" y="366" font-size="12" fill="#666" stroke="none" >paperclip-maya[bot]</text>
<text x="1208" y="348" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Created</text>
<line x1="576" y1="392" x2="1208" y2="392" stroke="#e6e6e6"/>
<text x="576" y="416" font-size="14" fill="#000" stroke="none" font-weight="600">Webhook</text>
<text x="576" y="438" font-size="12" fill="#666" stroke="none" >Signed delivery endpoint</text>
<text x="1208" y="420" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Verified</text>
<text x="560" y="496" font-size="20" fill="#000" stroke="none" font-weight="700">Install it in GitHub</text>
<text x="560" y="520" font-size="12" fill="#666" stroke="none" >GitHub owns organization approval and repository selection.</text>
<line x1="560" y1="544" x2="1224" y2="544" />
<text x="576" y="568" font-size="14" fill="#000" stroke="none" font-weight="600">Account or organization</text>
<text x="576" y="590" font-size="12" fill="#666" stroke="none" >Choose the GitHub owner where people will mention Maya.</text>
<text x="1208" y="572" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">In GitHub</text>
<line x1="576" y1="616" x2="1208" y2="616" stroke="#e6e6e6"/>
<text x="576" y="640" font-size="14" fill="#000" stroke="none" font-weight="600">Repository access</text>
<text x="576" y="662" font-size="12" fill="#666" stroke="none" >Choose all repositories or a selected set; Paperclip can narrow</text>
<text x="576" y="678" font-size="12" fill="#666" stroke="none" >this later.</text>
<text x="1208" y="644" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">In GitHub</text>
<line x1="576" y1="688" x2="1208" y2="688" stroke="#e6e6e6"/>
<text x="576" y="712" font-size="14" fill="#000" stroke="none" font-weight="600">Permissions</text>
<text x="576" y="734" font-size="12" fill="#666" stroke="none" >Review the prepared Issues, Pull requests, and Metadata grant.</text>
<text x="1208" y="716" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">In GitHub</text>
<text x="560" y="792" font-size="20" fill="#000" stroke="none" font-weight="700">What returns</text>
<text x="560" y="816" font-size="12" fill="#666" stroke="none" >The installation callback contains an installation ID, not another long-lived credential for</text>
<text x="560" y="832" font-size="12" fill="#666" stroke="none" >the user to copy.</text>
<line x1="560" y1="840" x2="1224" y2="840" />
<text x="576" y="864" font-size="14" fill="#000" stroke="none" font-weight="600">Installation</text>
<text x="576" y="886" font-size="12" fill="#666" stroke="none" >Paperclip links the App installation to this endpoint.</text>
<text x="1208" y="868" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Automatic return</text>
<line x1="576" y1="912" x2="1208" y2="912" stroke="#e6e6e6"/>
<text x="576" y="936" font-size="14" fill="#000" stroke="none" font-weight="600">Repository inventory</text>
<text x="576" y="958" font-size="12" fill="#666" stroke="none" >Paperclip reads the installed repository IDs and labels.</text>
