<text x="280" y="386" font-size="14" fill="#666" stroke="none" >Activity</text><line x1="480" y1="60" x2="480" y2="1472" /></g><text x="504" y="108" font-size="28" fill="#000" stroke="none" font-weight="700">Slack overview</text><text x="504" y="138" font-size="14" fill="#666" stroke="none" >Identity, installation health, automatic capabilities, and connector lifecycle.</text><text x="504" y="198" font-size="20" fill="#000" stroke="none" font-weight="700">Connection</text>
<text x="504" y="223" font-size="12" fill="#666" stroke="none" >One bot identity represents Maya in one Slack installation.</text>
