<text x="520" y="882" font-size="12" fill="#666" stroke="none" >Root mention creates a native thread; subscribed replies continue the</text>
<text x="520" y="898" font-size="12" fill="#666" stroke="none" >same issue.</text>
<rect x="1032" y="846" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="876" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Included</text>
<line x1="520" y1="906" x2="1208" y2="906" stroke="#e6e6e6"/>
<text x="520" y="932" font-size="14" fill="#000" stroke="none" font-weight="600">Output</text>
<text x="520" y="954" font-size="12" fill="#666" stroke="none" >Reaction receipt, native streaming or post/edit, safe milestones, final</text>
<text x="520" y="970" font-size="12" fill="#666" stroke="none" >reply.</text>
<rect x="1032" y="918" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="948" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Included</text>
<line x1="520" y1="978" x2="1208" y2="978" stroke="#e6e6e6"/>
<text x="520" y="1004" font-size="14" fill="#000" stroke="none" font-weight="600">Rich interaction</text>
<text x="520" y="1026" font-size="12" fill="#666" stroke="none" >Block Kit, buttons, selects, modals, slash commands, emoji, and stop.</text>
<rect x="1032" y="990" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1020" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Included</text>
<line x1="520" y1="1050" x2="1208" y2="1050" stroke="#e6e6e6"/>
<text x="520" y="1076" font-size="14" fill="#000" stroke="none" font-weight="600">Files and privacy</text>
<text x="520" y="1098" font-size="12" fill="#666" stroke="none" >Bounded files, DMs, ephemeral response with DM/text fallback.</text>
<rect x="1032" y="1062" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1092" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Included</text>
<text x="504" y="1152" font-size="20" fill="#000" stroke="none" font-weight="700">Lifecycle</text>
<text x="504" y="1177" font-size="12" fill="#666" stroke="none" >Connection actions preserve the endpoint and its audit history.</text>
<line x1="504" y1="1200" x2="1224" y2="1200" />
<text x="520" y="1226" font-size="14" fill="#000" stroke="none" font-weight="600">Connection test</text>
<text x="520" y="1248" font-size="12" fill="#666" stroke="none" >Verify identity, permissions, events, and a private response.</text>
<rect x="1032" y="1212" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1242" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Test</text>
<line x1="520" y1="1272" x2="1208" y2="1272" stroke="#e6e6e6"/>
