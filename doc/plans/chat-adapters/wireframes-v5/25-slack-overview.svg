<text x="504" y="492" font-size="20" fill="#000" stroke="none" font-weight="700">Installation and delivery</text>
<text x="504" y="517" font-size="12" fill="#666" stroke="none" >Operational details remain visible without reopening setup.</text>
<line x1="504" y1="540" x2="1224" y2="540" />
<text x="520" y="566" font-size="14" fill="#000" stroke="none" font-weight="600">Installation</text>
<text x="520" y="588" font-size="12" fill="#666" stroke="none" >OAuth workspace · 2 invited channels</text>
<rect x="1032" y="552" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="582" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Connected</text>
