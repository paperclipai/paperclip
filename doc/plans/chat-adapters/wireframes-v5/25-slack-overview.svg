<text x="520" y="638" font-size="14" fill="#000" stroke="none" font-weight="600">Ingress</text>
<text x="520" y="660" font-size="12" fill="#666" stroke="none" >Verified direct webhook · p95 acknowledgement 420 ms</text>
<rect x="1032" y="624" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="654" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Healthy</text>
