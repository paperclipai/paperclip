<text x="504" y="786" font-size="20" fill="#000" stroke="none" font-weight="700">Available automatically</text>
<text x="504" y="811" font-size="12" fill="#666" stroke="none" >Paperclip always uses the richest safe Slack behavior permitted by this installation.</text>
<line x1="504" y1="834" x2="1224" y2="834" />
