<rect x="8" y="536" width="224" height="40" rx="4" fill="#e6e6e6"/><circle cx="32" cy="552" r="6" fill="#e6e6e6"/><text x="56" y="556" font-size="14" fill="#000" stroke="none" font-weight="600">Connectors</text>
<circle cx="32" cy="600" r="6" fill="#e6e6e6"/><text x="56" y="604" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="1008" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="1032" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1064" /></g><g data-region="topbar"><line x1="240" y1="64" x2="1280" y2="64" /><text x="264" y="40" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  Microsoft Teams  ›  Chat with an agent</text><circle cx="1240" cy="32" r="16" fill="#e6e6e6"/></g><text x="264" y="104" font-size="12" fill="#666" stroke="none" font-weight="700">SETUP</text>
<text x="264" y="128" font-size="14" fill="#000" stroke="none" font-weight="700">Microsoft Teams</text>
<line x1="520" y1="64" x2="520" y2="1064" />
<line x1="288" y1="152" x2="288" y2="472" />
<circle cx="288" cy="152" r="16" fill="#000"/>
<text x="288" y="157" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="320" y="148" font-size="14" fill="#000" stroke="none" >Agent selected</text>
<circle cx="288" cy="232" r="16" fill="#fff"/>
<text x="288" y="237" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">2</text>
<text x="320" y="228" font-size="14" fill="#000" stroke="none" font-weight="700">Register Teams bot</text>
<circle cx="288" cy="312" r="16" fill="#fff"/>
<text x="288" y="317" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">3</text>
<text x="320" y="308" font-size="14" fill="#666" stroke="none" >Connect identity</text>
<circle cx="288" cy="392" r="16" fill="#fff"/>
<text x="288" y="397" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">4</text>
<text x="320" y="388" font-size="14" fill="#666" stroke="none" >Install app</text>
<circle cx="288" cy="472" r="16" fill="#fff"/>
<text x="288" y="477" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">5</text>
<text x="320" y="468" font-size="14" fill="#666" stroke="none" >Try Maya</text>
<text x="264" y="1016" font-size="12" fill="#666" stroke="none" >Progress is saved automatically.</text><text x="560" y="112" font-size="28" fill="#000" stroke="none" font-weight="700">Register Maya for Microsoft Teams</text>
<text x="560" y="144" font-size="14" fill="#666" stroke="none" >Run one guided Microsoft command to create the customer-owned bot identity and point it</text>
<text x="560" y="164" font-size="14" fill="#666" stroke="none" >at Paperclip.</text>
<text x="560" y="200" font-size="20" fill="#000" stroke="none" font-weight="700">Agent</text>
<text x="560" y="224" font-size="12" fill="#666" stroke="none" >The Microsoft bot and Teams app package are permanently assigned to this agent.</text>
<line x1="560" y1="248" x2="1224" y2="248" />
<text x="576" y="272" font-size="14" fill="#000" stroke="none" font-weight="600">Maya</text>
<text x="576" y="294" font-size="12" fill="#666" stroke="none" >Support engineer · a new connection is required for another agent</text>
<text x="1208" y="276" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Locked</text>
<text x="560" y="352" font-size="20" fill="#000" stroke="none" font-weight="700">Recommended Microsoft setup</text>
<text x="560" y="376" font-size="12" fill="#666" stroke="none" >Teams Developer CLI creates the Entra App, Azure Bot resource, Teams channel, and install</text>
<text x="560" y="392" font-size="12" fill="#666" stroke="none" >metadata with Microsoft-owned sign-in and policy checks.</text>
<line x1="560" y1="400" x2="1224" y2="400" />
<text x="576" y="424" font-size="14" fill="#000" stroke="none" font-weight="600">Prerequisites</text>
<text x="576" y="446" font-size="12" fill="#666" stroke="none" >Microsoft 365 account, Azure subscription, and permission to</text>
<text x="576" y="462" font-size="12" fill="#666" stroke="none" >create the resources.</text>
<text x="1208" y="428" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Required</text>
<line x1="576" y1="472" x2="1208" y2="472" stroke="#e6e6e6"/>
<text x="576" y="496" font-size="14" fill="#000" stroke="none" font-weight="600">Messaging endpoint</text>
<text x="576" y="518" font-size="12" fill="#666" stroke="none" >Paperclip generated the verified endpoint used by the command.</text>
<text x="1208" y="500" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Prepared</text>
<line x1="576" y1="544" x2="1208" y2="544" stroke="#e6e6e6"/>
<text x="576" y="568" font-size="14" fill="#000" stroke="none" font-weight="600">Tenant policy</text>
<text x="576" y="590" font-size="12" fill="#666" stroke="none" >The CLI reports when custom-app upload or resource creation needs</text>
<text x="576" y="606" font-size="12" fill="#666" stroke="none" >an administrator.</text>
<text x="1208" y="572" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Checked by Microsoft</text>
<text x="560" y="648" font-size="20" fill="#000" stroke="none" font-weight="700">What the command does</text>
<text x="560" y="672" font-size="12" fill="#666" stroke="none" >The copied command contains Maya's name and Paperclip endpoint; it never contains a</text>
<text x="560" y="688" font-size="12" fill="#666" stroke="none" >Paperclip secret.</text>
<line x1="560" y1="696" x2="1224" y2="696" />
<text x="576" y="720" font-size="14" fill="#000" stroke="none" font-weight="600">Microsoft sign-in</text>
<text x="576" y="742" font-size="12" fill="#666" stroke="none" >The CLI asks Microsoft to authenticate the operator.</text>
<text x="1208" y="724" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">External</text>
<line x1="576" y1="768" x2="1208" y2="768" stroke="#e6e6e6"/>
<text x="576" y="792" font-size="14" fill="#000" stroke="none" font-weight="600">Resource creation</text>
<text x="576" y="814" font-size="12" fill="#666" stroke="none" >Creates one single-tenant bot identity and enables the Teams</text>
<text x="576" y="830" font-size="12" fill="#666" stroke="none" >channel.</text>
<text x="1208" y="796" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">External</text>
<line x1="576" y1="840" x2="1208" y2="840" stroke="#e6e6e6"/>
<text x="576" y="864" font-size="14" fill="#000" stroke="none" font-weight="600">Credential output</text>
<text x="576" y="886" font-size="12" fill="#666" stroke="none" >Writes Client ID, Tenant ID, and a generated secret for the next</text>
<text x="576" y="902" font-size="12" fill="#666" stroke="none" >step.</text>
<text x="1208" y="868" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Local output</text><rect x="560" y="976" width="208" height="48" rx="4" fill="#fff"/><text x="664" y="1006" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Use Azure Portal instead</text><rect x="784" y="976" width="440" height="48" rx="4" fill="#000"/><text x="1004" y="1006" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Copy setup command</text><g data-region="annotations"><rect x="256" y="88" width="248" height="520" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="256" cy="88" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="256" y="92" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
<rect x="552" y="168" width="680" height="152" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="552" cy="168" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="552" y="172" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">2</text>
<rect x="552" y="320" width="680" height="592" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="552" cy="320" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="552" y="324" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text>
<rect x="552" y="960" width="680" height="72" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="552" cy="960" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="552" y="964" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">4</text></g></svg>
