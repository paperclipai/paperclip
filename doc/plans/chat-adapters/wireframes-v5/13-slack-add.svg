<text x="264" y="1016" font-size="12" fill="#666" stroke="none" >Progress is saved automatically.</text><text x="560" y="112" font-size="28" fill="#000" stroke="none" font-weight="700">Add Maya to Slack</text>
<text x="560" y="144" font-size="14" fill="#666" stroke="none" >Approve one agent installation. Paperclip handles credentials and delivery in the</text>
<text x="560" y="164" font-size="14" fill="#666" stroke="none" >background.</text>
<text x="560" y="200" font-size="20" fill="#000" stroke="none" font-weight="700">Agent</text>
<text x="560" y="224" font-size="12" fill="#666" stroke="none" >This connection is permanently assigned to one Paperclip agent.</text>
<line x1="560" y1="248" x2="1224" y2="248" />
<text x="576" y="272" font-size="14" fill="#000" stroke="none" font-weight="600">Maya</text>
<text x="576" y="294" font-size="12" fill="#666" stroke="none" >Support engineer · active</text>
<text x="1208" y="276" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Locked</text>
<text x="560" y="352" font-size="20" fill="#000" stroke="none" font-weight="700">What Slack will ask</text>
<text x="560" y="376" font-size="12" fill="#666" stroke="none" >Slack owns workspace selection, administrator approval, and the final permission screen.</text>
<line x1="560" y1="400" x2="1224" y2="400" />
<text x="576" y="424" font-size="14" fill="#000" stroke="none" font-weight="600">Workspace</text>
<text x="576" y="446" font-size="12" fill="#666" stroke="none" >Choose the Slack workspace where Maya should appear.</text>
<text x="1208" y="428" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">In Slack</text>
<line x1="576" y1="472" x2="1208" y2="472" stroke="#e6e6e6"/>
<text x="576" y="496" font-size="14" fill="#000" stroke="none" font-weight="600">Permissions</text>
<text x="576" y="518" font-size="12" fill="#666" stroke="none" >Review mentions, thread replies, messages, reactions, files,</text>
<text x="576" y="534" font-size="12" fill="#666" stroke="none" >actions, modals, commands, and DMs.</text>
<text x="1208" y="500" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Review in Slack</text>
<line x1="576" y1="544" x2="1208" y2="544" stroke="#e6e6e6"/>
<text x="576" y="568" font-size="14" fill="#000" stroke="none" font-weight="600">Installation</text>
<text x="576" y="590" font-size="12" fill="#666" stroke="none" >Slack returns the authorized agent installation to this Paperclip</text>
<text x="576" y="606" font-size="12" fill="#666" stroke="none" >company.</text>
<text x="1208" y="572" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Automatic return</text>
<text x="560" y="648" font-size="20" fill="#000" stroke="none" font-weight="700">What Paperclip handles</text>
<text x="560" y="672" font-size="12" fill="#666" stroke="none" >No token, signing secret, webhook, relay, or Socket Mode choice appears in this path.</text>
<line x1="560" y1="696" x2="1224" y2="696" />
<text x="576" y="720" font-size="14" fill="#000" stroke="none" font-weight="600">Credentials</text>
<text x="576" y="742" font-size="12" fill="#666" stroke="none" >Store the returned Slack installation in Paperclip's secret store;</text>
<text x="576" y="758" font-size="12" fill="#666" stroke="none" >never reveal it in connector settings.</text>
<text x="1208" y="724" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Automatic</text>
<line x1="576" y1="768" x2="1208" y2="768" stroke="#e6e6e6"/>
<text x="576" y="792" font-size="14" fill="#000" stroke="none" font-weight="600">Delivery</text>
<text x="576" y="814" font-size="12" fill="#666" stroke="none" >Select and verify the correct callback path for this Paperclip</text>
<text x="576" y="830" font-size="12" fill="#666" stroke="none" >deployment.</text>
<text x="1208" y="796" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Automatic</text>
<line x1="576" y1="840" x2="1208" y2="840" stroke="#e6e6e6"/>
<text x="576" y="864" font-size="14" fill="#000" stroke="none" font-weight="600">Capabilities</text>
<text x="576" y="886" font-size="12" fill="#666" stroke="none" >Enable every safe Slack feature granted by the installation.</text>
