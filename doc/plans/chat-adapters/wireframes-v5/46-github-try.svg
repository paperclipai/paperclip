<text x="576" y="438" font-size="12" fill="#666" stroke="none" >Chat-only; no repository code authority</text>
<text x="1208" y="420" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Passed</text>
<text x="560" y="496" font-size="20" fill="#000" stroke="none" font-weight="700">Start the first task</text>
<text x="560" y="520" font-size="12" fill="#666" stroke="none" >Use an existing GitHub conversation; Paperclip does not create a second native thread.</text>
<line x1="560" y1="544" x2="1224" y2="544" />
<text x="576" y="568" font-size="14" fill="#000" stroke="none" font-weight="600">1. Open an issue or PR</text>
<text x="576" y="590" font-size="12" fill="#666" stroke="none" >Use either installed repository.</text>
<text x="1208" y="572" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">In GitHub</text>
<line x1="576" y1="616" x2="1208" y2="616" stroke="#e6e6e6"/>
<text x="576" y="640" font-size="14" fill="#000" stroke="none" font-weight="600">2. Mention the App</text>
<text x="576" y="662" font-size="12" fill="#666" stroke="none" >Comment “@paperclip-maya investigate this.”</text>
<text x="1208" y="644" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Starts task</text>
<line x1="576" y1="688" x2="1208" y2="688" stroke="#e6e6e6"/>
<text x="576" y="712" font-size="14" fill="#000" stroke="none" font-weight="600">3. Watch the comment</text>
<text x="576" y="734" font-size="12" fill="#666" stroke="none" >Maya reacts, posts progress, and edits the final GFM response.</text>
<text x="1208" y="716" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Expected</text>
<text x="560" y="792" font-size="20" fill="#000" stroke="none" font-weight="700">Live verification</text>
<text x="560" y="816" font-size="12" fill="#666" stroke="none" >The first signed webhook proves the selected installation and native conversation boundary.</text>
