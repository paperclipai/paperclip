<line x1="576" y1="320" x2="1208" y2="320" stroke="#e6e6e6"/>
<text x="576" y="344" font-size="14" fill="#000" stroke="none" font-weight="600">Installation</text>
<text x="576" y="366" font-size="12" fill="#666" stroke="none" >Acme · acme/api and acme/web</text>
<text x="1208" y="348" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Connected</text>
