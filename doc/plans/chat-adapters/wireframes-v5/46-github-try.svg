<text x="264" y="1016" font-size="12" fill="#666" stroke="none" >Progress is saved automatically.</text><text x="560" y="112" font-size="28" fill="#000" stroke="none" font-weight="700">Try Maya in GitHub</text>
<text x="560" y="144" font-size="14" fill="#666" stroke="none" >Mention Maya in an allowed issue, pull-request conversation, or review thread.</text>
<text x="560" y="200" font-size="20" fill="#000" stroke="none" font-weight="700">Installation complete</text>
<text x="560" y="224" font-size="12" fill="#666" stroke="none" >Paperclip verified the App, installation, selected repositories, events, and signatures.</text>
