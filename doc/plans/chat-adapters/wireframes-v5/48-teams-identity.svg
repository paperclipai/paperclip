<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1024" viewBox="0 0 1280 1024" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect x="0" y="0" width="1280" height="1024"/><g data-region="global-sidebar"><text x="24" y="40" font-size="20" fill="#000" stroke="none" font-weight="700">Paperclip</text><circle cx="32" cy="72" r="6" fill="#e6e6e6"/><text x="56" y="76" font-size="14" fill="#666" stroke="none" >New Task</text>
<circle cx="32" cy="120" r="6" fill="#e6e6e6"/><text x="56" y="124" font-size="14" fill="#666" stroke="none" >Search</text>
<circle cx="32" cy="168" r="6" fill="#e6e6e6"/><text x="56" y="172" font-size="14" fill="#666" stroke="none" >Dashboard</text>
<circle cx="32" cy="216" r="6" fill="#e6e6e6"/><text x="56" y="220" font-size="14" fill="#666" stroke="none" >Inbox</text>
<circle cx="32" cy="264" r="6" fill="#e6e6e6"/><text x="56" y="268" font-size="14" fill="#666" stroke="none" >Tasks</text>
<circle cx="32" cy="312" r="6" fill="#e6e6e6"/><text x="56" y="316" font-size="14" fill="#666" stroke="none" >Projects</text>
<circle cx="32" cy="360" r="6" fill="#e6e6e6"/><text x="56" y="364" font-size="14" fill="#666" stroke="none" >Routines</text>
<circle cx="32" cy="408" r="6" fill="#e6e6e6"/><text x="56" y="412" font-size="14" fill="#666" stroke="none" >Artifacts</text>
<circle cx="32" cy="456" r="6" fill="#e6e6e6"/><text x="56" y="460" font-size="14" fill="#666" stroke="none" >Agents</text>
<circle cx="32" cy="504" r="6" fill="#e6e6e6"/><text x="56" y="508" font-size="14" fill="#666" stroke="none" >Skills</text>
<rect x="8" y="536" width="224" height="40" rx="4" fill="#e6e6e6"/><circle cx="32" cy="552" r="6" fill="#e6e6e6"/><text x="56" y="556" font-size="14" fill="#000" stroke="none" font-weight="600">Connectors</text>
<circle cx="32" cy="600" r="6" fill="#e6e6e6"/><text x="56" y="604" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="968" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="992" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1024" /></g><g data-region="topbar"><line x1="240" y1="64" x2="1280" y2="64" /><text x="264" y="40" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  Microsoft Teams  ›  Chat with an agent</text><circle cx="1240" cy="32" r="16" fill="#e6e6e6"/></g><text x="264" y="104" font-size="12" fill="#666" stroke="none" font-weight="700">SETUP</text>
<text x="264" y="128" font-size="14" fill="#000" stroke="none" font-weight="700">Microsoft Teams</text>
<line x1="520" y1="64" x2="520" y2="1024" />
<line x1="288" y1="152" x2="288" y2="472" />
<circle cx="288" cy="152" r="16" fill="#000"/>
<text x="288" y="157" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="320" y="148" font-size="14" fill="#000" stroke="none" >Agent selected</text>
<circle cx="288" cy="232" r="16" fill="#000"/>
<text x="288" y="237" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="320" y="228" font-size="14" fill="#000" stroke="none" >Register Teams bot</text>
<circle cx="288" cy="312" r="16" fill="#fff"/>
<text x="288" y="317" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">3</text>
<text x="320" y="308" font-size="14" fill="#000" stroke="none" font-weight="700">Connect identity</text>
<circle cx="288" cy="392" r="16" fill="#fff"/>
<text x="288" y="397" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">4</text>
<text x="320" y="388" font-size="14" fill="#666" stroke="none" >Install app</text>
<circle cx="288" cy="472" r="16" fill="#fff"/>
<text x="288" y="477" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">5</text>
<text x="320" y="468" font-size="14" fill="#666" stroke="none" >Try Maya</text>
<text x="264" y="976" font-size="12" fill="#666" stroke="none" >Progress is saved automatically.</text><text x="560" y="112" font-size="28" fill="#000" stroke="none" font-weight="700">Connect the Microsoft bot identity</text>
<text x="560" y="144" font-size="14" fill="#666" stroke="none" >Paste the three values created by Microsoft so Paperclip can authenticate as Maya.</text>
<text x="560" y="192" font-size="14" fill="#000" stroke="none" font-weight="600">Application (client) ID</text><rect x="560" y="208" width="640" height="48" rx="4" fill="#fff"/><text x="576" y="238" font-size="14" fill="#666" stroke="none" >00000000-0000-0000-0000-000000000000</text><text x="560" y="280" font-size="12" fill="#666" stroke="none" >Identifies Maya's Entra application and Azure Bot.</text>
<text x="560" y="328" font-size="14" fill="#000" stroke="none" font-weight="600">Directory (tenant) ID</text><rect x="560" y="344" width="640" height="48" rx="4" fill="#fff"/><text x="576" y="374" font-size="14" fill="#666" stroke="none" >00000000-0000-0000-0000-000000000000</text><text x="560" y="416" font-size="12" fill="#666" stroke="none" >Limits the bot to the company tenant.</text>
<text x="560" y="464" font-size="14" fill="#000" stroke="none" font-weight="600">Client secret</text><rect x="560" y="480" width="640" height="48" rx="4" fill="#fff"/><text x="576" y="510" font-size="14" fill="#666" stroke="none" >••••••••••••</text><text x="560" y="552" font-size="12" fill="#666" stroke="none" >Lets Paperclip authenticate outbound bot messages; stored write-only.</text>
<text x="560" y="608" font-size="20" fill="#000" stroke="none" font-weight="700">Why these values are visible</text>
<text x="560" y="632" font-size="12" fill="#666" stroke="none" >Microsoft created a customer-owned identity. It does not send those credentials to Paperclip</text>
<text x="560" y="648" font-size="12" fill="#666" stroke="none" >through an installation callback.</text>
<line x1="560" y1="656" x2="1224" y2="656" />
<text x="576" y="680" font-size="14" fill="#000" stroke="none" font-weight="600">Storage</text>
<text x="576" y="702" font-size="12" fill="#666" stroke="none" >Client secret enters Paperclip's secret store; configuration keeps</text>
<text x="576" y="718" font-size="12" fill="#666" stroke="none" >only its reference.</text>
<text x="1208" y="684" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Write only</text>
<line x1="576" y1="728" x2="1208" y2="728" stroke="#e6e6e6"/>
<text x="576" y="752" font-size="14" fill="#000" stroke="none" font-weight="600">Rotation</text>
<text x="576" y="774" font-size="12" fill="#666" stroke="none" >A replacement secret can be saved later without changing task</text>
<text x="576" y="790" font-size="12" fill="#666" stroke="none" >bindings.</text>
<text x="1208" y="756" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Supported</text>
<line x1="576" y1="800" x2="1208" y2="800" stroke="#e6e6e6"/>
<text x="576" y="824" font-size="14" fill="#000" stroke="none" font-weight="600">Managed identity</text>
<text x="576" y="846" font-size="12" fill="#666" stroke="none" >Available only when the Paperclip deployment already runs with a</text>
<text x="576" y="862" font-size="12" fill="#666" stroke="none" >compatible Azure identity.</text>
<text x="1208" y="828" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Instance advanced</text><rect x="560" y="936" width="208" height="48" rx="4" fill="#fff"/><text x="664" y="966" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Back</text><rect x="784" y="936" width="440" height="48" rx="4" fill="#000"/><text x="1004" y="966" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Save and verify</text><g data-region="annotations"><rect x="256" y="88" width="248" height="520" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="256" cy="88" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="256" y="92" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
<rect x="552" y="168" width="680" height="408" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="552" cy="168" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="552" y="172" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">2</text>
<rect x="552" y="576" width="680" height="296" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="552" cy="576" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="552" y="580" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text>
<rect x="552" y="920" width="680" height="72" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="552" cy="920" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="552" y="924" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">4</text></g></svg>
