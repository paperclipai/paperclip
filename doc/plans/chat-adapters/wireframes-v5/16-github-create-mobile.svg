<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1664" viewBox="0 0 375 1664" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect x="0" y="0" width="375" height="1664"/><rect x="0" y="0" width="375" height="56" rx="4" /><text x="16" y="36" font-size="14" fill="#000" stroke="none" font-weight="600">‹  GitHub</text><text x="359" y="36" font-size="12" fill="#666" stroke="none" text-anchor="end">Save &amp; exit</text>
<text x="16" y="72" font-size="12" fill="#666" stroke="none" font-weight="700">SETUP</text>
<line x1="32" y1="96" x2="32" y2="264" />
<circle cx="32" cy="96" r="16" fill="#000"/>
<text x="32" y="101" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="64" y="101" font-size="14" fill="#000" stroke="none" >Agent selected</text>
<circle cx="32" cy="152" r="16" fill="#fff"/>
<text x="32" y="157" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">2</text>
<text x="64" y="157" font-size="14" fill="#000" stroke="none" font-weight="700">Create GitHub App</text>
<circle cx="32" cy="208" r="16" fill="#fff"/>
<text x="32" y="213" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">3</text>
<text x="64" y="213" font-size="14" fill="#666" stroke="none" >Choose repositories</text>
<circle cx="32" cy="264" r="16" fill="#fff"/>
<text x="32" y="269" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">4</text>
<text x="64" y="269" font-size="14" fill="#666" stroke="none" >Try Maya</text>
<text x="16" y="360" font-size="20" fill="#000" stroke="none" font-weight="700">Create Maya in GitHub</text>
<text x="16" y="392" font-size="12" fill="#666" stroke="none" >GitHub creates a dedicated App from</text>
<text x="16" y="408" font-size="12" fill="#666" stroke="none" >Paperclip's manifest and returns its</text>
<text x="16" y="424" font-size="12" fill="#666" stroke="none" >credentials automatically.</text>
<text x="16" y="472" font-size="20" fill="#000" stroke="none" font-weight="700">Agent</text>
<text x="16" y="496" font-size="12" fill="#666" stroke="none" >The GitHub App is permanently assigned to this</text>
<text x="16" y="512" font-size="12" fill="#666" stroke="none" >Paperclip agent.</text>
<line x1="16" y1="528" x2="359" y2="528" />
<text x="24" y="552" font-size="14" fill="#000" stroke="none" font-weight="600">Maya</text>
<text x="24" y="574" font-size="12" fill="#666" stroke="none" >Support engineer · separate from Maya's</text>
<text x="24" y="590" font-size="12" fill="#666" stroke="none" >GitHub tool connection</text>
<text x="351" y="624" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Locked</text>
<text x="16" y="672" font-size="20" fill="#000" stroke="none" font-weight="700">What GitHub will create</text>
<text x="16" y="696" font-size="12" fill="#666" stroke="none" >Paperclip submits an App Manifest; GitHub</text>
<text x="16" y="712" font-size="12" fill="#666" stroke="none" >shows the owner and app-name confirmation.</text>
<line x1="16" y1="728" x2="359" y2="728" />
<text x="24" y="752" font-size="14" fill="#000" stroke="none" font-weight="600">App identity</text>
<text x="24" y="774" font-size="12" fill="#666" stroke="none" >paperclip-maya[bot] · native mention and</text>
<text x="24" y="790" font-size="12" fill="#666" stroke="none" >avatar</text>
<text x="351" y="824" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Dedicated</text>
<line x1="24" y1="840" x2="351" y2="840" stroke="#e6e6e6"/>
<text x="24" y="864" font-size="14" fill="#000" stroke="none" font-weight="600">Chat permissions</text>
<text x="24" y="886" font-size="12" fill="#666" stroke="none" >Issues write · Pull requests write ·</text>
<text x="24" y="902" font-size="12" fill="#666" stroke="none" >Metadata read</text>
<text x="351" y="936" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Least privilege</text>
<line x1="24" y1="952" x2="351" y2="952" stroke="#e6e6e6"/>
<text x="24" y="976" font-size="14" fill="#000" stroke="none" font-weight="600">Events</text>
<text x="24" y="998" font-size="12" fill="#666" stroke="none" >Issue comments and pull-request review</text>
<text x="24" y="1014" font-size="12" fill="#666" stroke="none" >comments</text>
<text x="351" y="1048" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Prepared</text>
<text x="16" y="1096" font-size="20" fill="#000" stroke="none" font-weight="700">What returns automatically</text>
<text x="16" y="1120" font-size="12" fill="#666" stroke="none" >GitHub redirects with a one-time code that</text>
<text x="16" y="1136" font-size="12" fill="#666" stroke="none" >Paperclip exchanges within the provider</text>
<text x="16" y="1152" font-size="12" fill="#666" stroke="none" >deadline.</text>
<line x1="16" y1="1152" x2="359" y2="1152" />
<text x="24" y="1176" font-size="14" fill="#000" stroke="none" font-weight="600">App ID and private key</text>
<text x="24" y="1198" font-size="12" fill="#666" stroke="none" >Stored directly in Paperclip's secret</text>
<text x="24" y="1214" font-size="12" fill="#666" stroke="none" >store.</text>
<text x="351" y="1248" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Automatic</text>
<line x1="24" y1="1264" x2="351" y2="1264" stroke="#e6e6e6"/>
<text x="24" y="1288" font-size="14" fill="#000" stroke="none" font-weight="600">Webhook secret</text>
<text x="24" y="1310" font-size="12" fill="#666" stroke="none" >Stored directly and used for signature</text>
<text x="24" y="1326" font-size="12" fill="#666" stroke="none" >verification.</text>
<text x="351" y="1360" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Automatic</text>
<line x1="24" y1="1376" x2="351" y2="1376" stroke="#e6e6e6"/>
<text x="24" y="1400" font-size="14" fill="#000" stroke="none" font-weight="600">Code access</text>
<text x="24" y="1422" font-size="12" fill="#666" stroke="none" >Contents and Actions are intentionally</text>
<text x="24" y="1438" font-size="12" fill="#666" stroke="none" >absent; use a separate tool connection.</text>
<text x="351" y="1472" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Not granted</text>
<rect x="16" y="1528" width="343" height="48" rx="4" fill="#fff"/><text x="187.5" y="1558" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Use an existing GitHub App</text>
<rect x="16" y="1592" width="343" height="48" rx="4" fill="#000"/><text x="187.5" y="1622" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Create in GitHub</text>
<g data-region="annotations"><rect x="8" y="64" width="359" height="272" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="64" r="8" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="68" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
<rect x="8" y="440" width="359" height="200" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="440" r="8" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="444" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">2</text>
<rect x="8" y="640" width="359" height="848" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="640" r="8" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="644" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text>
<rect x="8" y="1520" width="359" height="120" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="1520" r="8" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="1524" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">4</text></g></svg>
