<text x="576" y="416" font-size="14" fill="#000" stroke="none" font-weight="600">Scopes and features</text>
<text x="576" y="438" font-size="12" fill="#666" stroke="none" >Messages, threads, reactions, files, actions, modals, commands,</text>
<text x="576" y="454" font-size="12" fill="#666" stroke="none" >and DMs.</text>
