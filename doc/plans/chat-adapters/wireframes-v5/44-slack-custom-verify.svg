<text x="560" y="568" font-size="20" fill="#000" stroke="none" font-weight="700">Delivery selected automatically</text>
<text x="560" y="592" font-size="12" fill="#666" stroke="none" >Public instances use the verified callback directly; private instances use the configured</text>
<text x="560" y="608" font-size="12" fill="#666" stroke="none" >outbound relay. Socket Mode is an instance-admin escape hatch only.</text>
