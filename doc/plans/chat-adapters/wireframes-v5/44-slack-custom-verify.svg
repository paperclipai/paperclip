<text x="576" y="294" font-size="12" fill="#666" stroke="none" >auth.test returned Maya in the Acme workspace.</text>
<text x="1208" y="276" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Passed</text>
