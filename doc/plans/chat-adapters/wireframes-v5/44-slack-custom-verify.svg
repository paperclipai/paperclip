<text x="264" y="872" font-size="12" fill="#666" stroke="none" >Progress is saved automatically.</text><text x="560" y="112" font-size="28" fill="#000" stroke="none" font-weight="700">Verify the custom Slack app</text>
<text x="560" y="144" font-size="14" fill="#666" stroke="none" >Paperclip checks identity, callbacks, permissions, and installation before activation.</text>
<text x="560" y="200" font-size="20" fill="#000" stroke="none" font-weight="700">Verification results</text>
<text x="560" y="224" font-size="12" fill="#666" stroke="none" >Each check has one provider-specific remediation rather than another configuration panel.</text>
