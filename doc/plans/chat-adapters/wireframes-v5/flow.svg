<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect x="0" y="0" width="1280" height="1040"/><text x="48" y="48" font-size="28" fill="#000" stroke="none" font-weight="700">Chat connector setup · minimal defaults with explicit provider handoffs</text><text x="48" y="80" font-size="14" fill="#666" stroke="none" >Agent choice is immutable. Normal setup hides delivery mechanics and provider secrets whenever an authenticated handoff can return them.</text>
    <rect x="48" y="128" width="176" height="88" rx="4" fill="#e6e6e6"/><text x="64" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Connectors</text><text x="64" y="188" font-size="12" fill="#666" stroke="none" >Choose provider</text><line x1="224" y1="172" x2="264" y2="172" /><polygon points="264,172 256,166 256,178" fill="#000" stroke="none"/><rect x="264" y="128" width="192" height="88" rx="4" fill="#fff"/><text x="280" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Purpose?</text><text x="280" y="188" font-size="12" fill="#666" stroke="none" >Only for dual-purpose</text><line x1="456" y1="172" x2="496" y2="172" /><polygon points="496,172 488,166 488,178" fill="#000" stroke="none"/><rect x="496" y="128" width="184" height="88" rx="4" fill="#fff"/><text x="512" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Choose agent</text><text x="512" y="188" font-size="12" fill="#666" stroke="none" >Exactly once</text><line x1="680" y1="172" x2="720" y2="172" /><polygon points="720,172 712,166 712,178" fill="#000" stroke="none"/><rect x="720" y="128" width="216" height="88" rx="4" fill="#fff"/><text x="736" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Provider wizard</text><text x="736" y="188" font-size="12" fill="#666" stroke="none" >One phase at a time</text><line x1="936" y1="172" x2="976" y2="172" /><polygon points="976,172 968,166 968,178" fill="#000" stroke="none"/><rect x="976" y="128" width="208" height="88" rx="4" fill="#e6e6e6"/><text x="992" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Try agent</text><text x="992" y="188" font-size="12" fill="#666" stroke="none" >Real provider event</text>
    <text x="48" y="304" font-size="12" fill="#666" stroke="none" font-weight="700">DEFAULT PROVIDER HANDOFFS</text><rect x="48" y="336" width="232" height="88" rx="4" fill="#fff"/><text x="64" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">Slack</text><text x="64" y="396" font-size="12" fill="#666" stroke="none" >Add to Slack → try</text><rect x="296" y="336" width="232" height="88" rx="4" fill="#fff"/><text x="312" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">GitHub</text><text x="312" y="396" font-size="12" fill="#666" stroke="none" >Manifest → repos → try</text><rect x="544" y="336" width="232" height="88" rx="4" fill="#fff"/><text x="560" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">Microsoft Teams</text><text x="560" y="396" font-size="12" fill="#666" stroke="none" >Register → identity → app → try</text><rect x="792" y="336" width="232" height="88" rx="4" fill="#fff"/><text x="808" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">Telegram</text><text x="808" y="396" font-size="12" fill="#666" stroke="none" >BotFather token → chats → try</text>
    <text x="48" y="512" font-size="12" fill="#666" stroke="none" font-weight="700">AUTOMATIC IN EVERY DEFAULT PATH</text><rect x="48" y="544" width="216" height="88" rx="4" fill="#fff"/><text x="64" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Delivery</text><text x="64" y="604" font-size="12" fill="#666" stroke="none" >Webhook / relay selected</text><rect x="280" y="544" width="216" height="88" rx="4" fill="#fff"/><text x="296" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Capabilities</text><text x="296" y="604" font-size="12" fill="#666" stroke="none" >Maximum safe set</text><rect x="512" y="544" width="216" height="88" rx="4" fill="#fff"/><text x="528" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Secrets</text><text x="528" y="604" font-size="12" fill="#666" stroke="none" >Stored, never revealed</text><rect x="744" y="544" width="216" height="88" rx="4" fill="#fff"/><text x="760" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Verification</text><text x="760" y="604" font-size="12" fill="#666" stroke="none" >Provider checks + event</text>
    <text x="48" y="720" font-size="12" fill="#666" stroke="none" font-weight="700">ADVANCED BRANCHES</text><rect x="48" y="752" width="272" height="88" rx="4" fill="#fff"/><text x="64" y="784" font-size="14" fill="#000" stroke="none" font-weight="700">Custom Slack app</text><text x="64" y="812" font-size="12" fill="#666" stroke="none" >Manifest → 2 secrets → verify</text><rect x="344" y="752" width="272" height="88" rx="4" fill="#fff"/><text x="360" y="784" font-size="14" fill="#000" stroke="none" font-weight="700">Existing GitHub App</text><text x="360" y="812" font-size="12" fill="#666" stroke="none" >App ID + key + hook secret</text><rect x="640" y="752" width="272" height="88" rx="4" fill="#fff"/><text x="656" y="784" font-size="14" fill="#000" stroke="none" font-weight="700">Microsoft portal</text><text x="656" y="812" font-size="12" fill="#666" stroke="none" >Same required identity values</text><rect x="936" y="752" width="248" height="88" rx="4" fill="#fff"/><text x="952" y="784" font-size="14" fill="#000" stroke="none" font-weight="700">Instance transport</text><text x="952" y="812" font-size="12" fill="#666" stroke="none" >Admin operations only</text>
    <text x="48" y="920" font-size="20" fill="#000" stroke="none" font-weight="700">After activation</text><text x="48" y="952" font-size="14" fill="#666" stroke="none" >Every endpoint enters provider-specific Overview, Settings, Access, Conversations, and Activity tabs. Setup progress and external approvals remain resumable.</text>
