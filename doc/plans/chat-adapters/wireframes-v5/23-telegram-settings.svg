<circle cx="32" cy="574" r="6" fill="#e6e6e6"/><text x="52" y="579" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="1266" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="1294" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1322" /></g><g><line x1="240" y1="60" x2="1280" y2="60" /><text x="264" y="36" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  Maya on Telegram  ›  Settings</text><circle cx="1240" cy="30" r="16" fill="#e6e6e6"/></g><g><text x="264" y="94" font-size="12" fill="#666" stroke="none" >‹  All connectors</text><circle cx="280" cy="132" r="18" fill="#e6e6e6"/><text x="308" y="138" font-size="14" fill="#000" stroke="none" font-weight="700">Maya on Telegram</text><text x="280" y="194" font-size="14" fill="#666" stroke="none" >Overview</text>
<rect x="252" y="216" width="216" height="40" rx="6" fill="#e6e6e6"/><text x="280" y="242" font-size="14" fill="#000" stroke="none" font-weight="600">Settings</text>
<text x="280" y="290" font-size="14" fill="#666" stroke="none" >Access</text>
<text x="280" y="338" font-size="14" fill="#666" stroke="none" >Conversations</text>
<text x="280" y="386" font-size="14" fill="#666" stroke="none" >Activity</text><line x1="480" y1="60" x2="480" y2="1322" /></g><text x="504" y="108" font-size="28" fill="#000" stroke="none" font-weight="700">Telegram settings</text><text x="504" y="138" font-size="14" fill="#666" stroke="none" >Only scope, task boundaries, access, and necessary provider operations.</text><text x="504" y="198" font-size="20" fill="#000" stroke="none" font-weight="700">Chat and participant reach</text>
<text x="504" y="223" font-size="12" fill="#666" stroke="none" >Allowed IDs narrow Telegram membership and BotFather group policy.</text>
<line x1="504" y1="246" x2="1224" y2="246" />
<text x="520" y="272" font-size="14" fill="#000" stroke="none" font-weight="600">Allowed chats</text>
<text x="520" y="294" font-size="12" fill="#666" stroke="none" >Operations group and Support forum</text>
<rect x="1032" y="258" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="288" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">2 chats</text>
<line x1="520" y1="318" x2="1208" y2="318" stroke="#e6e6e6"/>
<text x="520" y="344" font-size="14" fill="#000" stroke="none" font-weight="600">Allowed topics</text>
<text x="520" y="366" font-size="12" fill="#666" stroke="none" >Support forum · topic 381</text>
<rect x="1032" y="330" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="360" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">1 topic</text>
<line x1="520" y1="390" x2="1208" y2="390" stroke="#e6e6e6"/>
<text x="520" y="416" font-size="14" fill="#000" stroke="none" font-weight="600">Direct messages</text>
<text x="520" y="438" font-size="12" fill="#666" stroke="none" >People may start active tasks in private chat.</text>
<rect x="1032" y="402" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="432" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Allowed</text>
<line x1="520" y1="462" x2="1208" y2="462" stroke="#e6e6e6"/>
<text x="520" y="488" font-size="14" fill="#000" stroke="none" font-weight="600">Allowed users</text>
<text x="520" y="510" font-size="12" fill="#666" stroke="none" >No additional principal allowlist inside the saved chat scope.</text>
<rect x="1032" y="474" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="504" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">All scoped</text>
<text x="504" y="564" font-size="20" fill="#000" stroke="none" font-weight="700">Task boundaries</text>
<text x="504" y="589" font-size="12" fill="#666" stroke="none" >Linear chats use an explicit active issue instead of pretending Telegram has Slack-style</text>
<text x="504" y="605" font-size="12" fill="#666" stroke="none" >threads.</text>
<line x1="504" y1="612" x2="1224" y2="612" />
<text x="520" y="638" font-size="14" fill="#000" stroke="none" font-weight="600">Direct message</text>
<text x="520" y="660" font-size="12" fill="#666" stroke="none" >First message starts the active issue; New task or /new starts another.</text>
<rect x="1032" y="624" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="654" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Active task</text>
<line x1="520" y1="684" x2="1208" y2="684" stroke="#e6e6e6"/>
<text x="520" y="710" font-size="14" fill="#000" stroke="none" font-weight="600">Ordinary group</text>
<text x="520" y="732" font-size="12" fill="#666" stroke="none" >@maya activates; replies to Maya or new mentions continue.</text>
<rect x="1032" y="696" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="726" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Addressed</text>
<line x1="520" y1="756" x2="1208" y2="756" stroke="#e6e6e6"/>
<text x="520" y="782" font-size="14" fill="#000" stroke="none" font-weight="600">Forum topic</text>
<text x="520" y="804" font-size="12" fill="#666" stroke="none" >Stable message_thread_id maps one topic to one issue.</text>
<rect x="1032" y="768" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="798" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Topic</text>
<text x="504" y="858" font-size="20" fill="#000" stroke="none" font-weight="700">BotFather policy and delivery</text>
<text x="504" y="883" font-size="12" fill="#666" stroke="none" >Paperclip reports the deployment-selected path; it is not an endpoint preference.</text>
<line x1="504" y1="906" x2="1224" y2="906" />
<text x="520" y="932" font-size="14" fill="#000" stroke="none" font-weight="600">Delivery path</text>
<text x="520" y="954" font-size="12" fill="#666" stroke="none" >Selected from instance reachability and verified continuously.</text>
<rect x="1032" y="918" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="948" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Automatic</text>
<line x1="520" y1="978" x2="1208" y2="978" stroke="#e6e6e6"/>
<text x="520" y="1004" font-size="14" fill="#000" stroke="none" font-weight="600">Privacy mode</text>
<text x="520" y="1026" font-size="12" fill="#666" stroke="none" >Remain on so unrelated group traffic is not consumed.</text>
<rect x="1032" y="990" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1020" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Required</text>
<line x1="520" y1="1050" x2="1208" y2="1050" stroke="#e6e6e6"/>
<text x="520" y="1076" font-size="14" fill="#000" stroke="none" font-weight="600">Token rotation</text>
<text x="520" y="1098" font-size="12" fill="#666" stroke="none" >Replace the secret reference after rotating with BotFather.</text>
<rect x="1032" y="1062" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1092" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Manage secret</text>
<line x1="520" y1="1122" x2="1208" y2="1122" stroke="#e6e6e6"/>
<text x="520" y="1148" font-size="14" fill="#000" stroke="none" font-weight="600">Delivery changes</text>
<text x="520" y="1170" font-size="12" fill="#666" stroke="none" >Paperclip drains pending updates if instance delivery changes.</text>
<rect x="1032" y="1134" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1164" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Automatic</text><rect x="1048" y="1250" width="176" height="48" rx="6" fill="#000"/><text x="1136" y="1280" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Save changes</text><g data-region="annotations"><rect x="496" y="168" width="736" height="374" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="168" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="172" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
<rect x="496" y="534" width="736" height="302" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="534" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="538" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">2</text>
<rect x="496" y="828" width="736" height="374" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="828" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="832" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text></g></svg>
