<circle cx="32" cy="600" r="6" fill="#e6e6e6"/><text x="56" y="604" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="1008" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="1032" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1064" /></g><g data-region="topbar"><line x1="240" y1="64" x2="1280" y2="64" /><text x="264" y="40" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  GitHub  ›  Chat with an agent</text><circle cx="1240" cy="32" r="16" fill="#e6e6e6"/></g><text x="264" y="104" font-size="12" fill="#666" stroke="none" font-weight="700">SETUP</text>
<text x="264" y="128" font-size="14" fill="#000" stroke="none" font-weight="700">GitHub</text>
<line x1="520" y1="64" x2="520" y2="1064" />
<line x1="288" y1="152" x2="288" y2="392" />
<circle cx="288" cy="152" r="16" fill="#000"/>
<text x="288" y="157" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="320" y="148" font-size="14" fill="#000" stroke="none" >Agent selected</text>
<circle cx="288" cy="232" r="16" fill="#fff"/>
<text x="288" y="237" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">2</text>
<text x="320" y="228" font-size="14" fill="#000" stroke="none" font-weight="700">Create GitHub App</text>
<circle cx="288" cy="312" r="16" fill="#fff"/>
<text x="288" y="317" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">3</text>
<text x="320" y="308" font-size="14" fill="#666" stroke="none" >Choose repositories</text>
<circle cx="288" cy="392" r="16" fill="#fff"/>
<text x="288" y="397" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">4</text>
<text x="320" y="388" font-size="14" fill="#666" stroke="none" >Try Maya</text>
<text x="264" y="1016" font-size="12" fill="#666" stroke="none" >Progress is saved automatically.</text><text x="560" y="112" font-size="28" fill="#000" stroke="none" font-weight="700">Create Maya in GitHub</text>
<text x="560" y="144" font-size="14" fill="#666" stroke="none" >GitHub creates a dedicated App from Paperclip's manifest and returns its credentials</text>
<text x="560" y="164" font-size="14" fill="#666" stroke="none" >automatically.</text>
<text x="560" y="200" font-size="20" fill="#000" stroke="none" font-weight="700">Agent</text>
<text x="560" y="224" font-size="12" fill="#666" stroke="none" >The GitHub App is permanently assigned to this Paperclip agent.</text>
<line x1="560" y1="248" x2="1224" y2="248" />
<text x="576" y="272" font-size="14" fill="#000" stroke="none" font-weight="600">Maya</text>
<text x="576" y="294" font-size="12" fill="#666" stroke="none" >Support engineer · separate from Maya's GitHub tool connection</text>
<text x="1208" y="276" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Locked</text>
<text x="560" y="352" font-size="20" fill="#000" stroke="none" font-weight="700">What GitHub will create</text>
<text x="560" y="376" font-size="12" fill="#666" stroke="none" >Paperclip submits an App Manifest; GitHub shows the owner and app-name confirmation.</text>
<line x1="560" y1="400" x2="1224" y2="400" />
<text x="576" y="424" font-size="14" fill="#000" stroke="none" font-weight="600">App identity</text>
<text x="576" y="446" font-size="12" fill="#666" stroke="none" >paperclip-maya[bot] · native mention and avatar</text>
<text x="1208" y="428" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Dedicated</text>
<line x1="576" y1="472" x2="1208" y2="472" stroke="#e6e6e6"/>
<text x="576" y="496" font-size="14" fill="#000" stroke="none" font-weight="600">Chat permissions</text>
<text x="576" y="518" font-size="12" fill="#666" stroke="none" >Issues write · Pull requests write · Metadata read</text>
<text x="1208" y="500" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Least privilege</text>
<line x1="576" y1="544" x2="1208" y2="544" stroke="#e6e6e6"/>
<text x="576" y="568" font-size="14" fill="#000" stroke="none" font-weight="600">Events</text>
<text x="576" y="590" font-size="12" fill="#666" stroke="none" >Issue comments and pull-request review comments</text>
<text x="1208" y="572" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Prepared</text>
<text x="560" y="648" font-size="20" fill="#000" stroke="none" font-weight="700">What returns automatically</text>
<text x="560" y="672" font-size="12" fill="#666" stroke="none" >GitHub redirects with a one-time code that Paperclip exchanges within the provider deadline.</text>
<line x1="560" y1="696" x2="1224" y2="696" />
<text x="576" y="720" font-size="14" fill="#000" stroke="none" font-weight="600">App ID and private key</text>
<text x="576" y="742" font-size="12" fill="#666" stroke="none" >Stored directly in Paperclip's secret store.</text>
<text x="1208" y="724" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Automatic</text>
<line x1="576" y1="768" x2="1208" y2="768" stroke="#e6e6e6"/>
<text x="576" y="792" font-size="14" fill="#000" stroke="none" font-weight="600">Webhook secret</text>
<text x="576" y="814" font-size="12" fill="#666" stroke="none" >Stored directly and used for signature verification.</text>
<text x="1208" y="796" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Automatic</text>
<line x1="576" y1="840" x2="1208" y2="840" stroke="#e6e6e6"/>
<text x="576" y="864" font-size="14" fill="#000" stroke="none" font-weight="600">Code access</text>
<text x="576" y="886" font-size="12" fill="#666" stroke="none" >Contents and Actions are intentionally absent; use a separate tool</text>
<text x="576" y="902" font-size="12" fill="#666" stroke="none" >connection.</text>
<text x="1208" y="868" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Not granted</text><rect x="560" y="976" width="208" height="48" rx="4" fill="#fff"/><text x="664" y="1006" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Use an existing GitHub App</text><rect x="784" y="976" width="440" height="48" rx="4" fill="#000"/><text x="1004" y="1006" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Create in GitHub</text><g data-region="annotations"><rect x="256" y="88" width="248" height="520" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="256" cy="88" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="256" y="92" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
