<circle cx="32" cy="600" r="6" fill="#e6e6e6"/><text x="56" y="604" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="1080" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="1104" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1136" /></g><g data-region="topbar"><line x1="240" y1="64" x2="1280" y2="64" /><text x="264" y="40" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  Telegram  ›  Chat with an agent</text><circle cx="1240" cy="32" r="16" fill="#e6e6e6"/></g><text x="264" y="104" font-size="12" fill="#666" stroke="none" font-weight="700">SETUP</text>
<text x="264" y="128" font-size="14" fill="#000" stroke="none" font-weight="700">Telegram</text>
<line x1="520" y1="64" x2="520" y2="1136" />
<line x1="288" y1="152" x2="288" y2="392" />
<circle cx="288" cy="152" r="16" fill="#000"/>
<text x="288" y="157" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="320" y="148" font-size="14" fill="#000" stroke="none" >Agent selected</text>
<circle cx="288" cy="232" r="16" fill="#000"/>
<text x="288" y="237" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="320" y="228" font-size="14" fill="#000" stroke="none" >Create Telegram bot</text>
<circle cx="288" cy="312" r="16" fill="#fff"/>
<text x="288" y="317" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">3</text>
<text x="320" y="308" font-size="14" fill="#000" stroke="none" font-weight="700">Add to chats</text>
<circle cx="288" cy="392" r="16" fill="#fff"/>
<text x="288" y="397" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">4</text>
<text x="320" y="388" font-size="14" fill="#666" stroke="none" >Try Maya</text>
<text x="264" y="1088" font-size="12" fill="#666" stroke="none" >Progress is saved automatically.</text><text x="560" y="112" font-size="28" fill="#000" stroke="none" font-weight="700">Add Maya to Telegram chats</text>
<text x="560" y="144" font-size="14" fill="#666" stroke="none" >Open Maya's Telegram profile, then add the bot wherever people should start tasks.</text>
<text x="560" y="200" font-size="20" fill="#000" stroke="none" font-weight="700">Bot connected</text>
<text x="560" y="224" font-size="12" fill="#666" stroke="none" >Paperclip verified the BotFather token and configured delivery automatically.</text>
<line x1="560" y1="248" x2="1224" y2="248" />
<text x="576" y="272" font-size="14" fill="#000" stroke="none" font-weight="600">Agent</text>
<text x="576" y="294" font-size="12" fill="#666" stroke="none" >Maya · permanently assigned</text>
<text x="1208" y="276" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Locked</text>
<line x1="576" y1="320" x2="1208" y2="320" stroke="#e6e6e6"/>
<text x="576" y="344" font-size="14" fill="#000" stroke="none" font-weight="600">Telegram identity</text>
<text x="576" y="366" font-size="12" fill="#666" stroke="none" >@maya_acme_bot · numeric ID verified</text>
<text x="1208" y="348" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Connected</text>
<line x1="576" y1="392" x2="1208" y2="392" stroke="#e6e6e6"/>
<text x="576" y="416" font-size="14" fill="#000" stroke="none" font-weight="600">Delivery</text>
<text x="576" y="438" font-size="12" fill="#666" stroke="none" >Verified webhook selected for this deployment</text>
<text x="1208" y="420" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Healthy</text>
<text x="560" y="496" font-size="20" fill="#000" stroke="none" font-weight="700">Choose reach in Telegram</text>
<text x="560" y="520" font-size="12" fill="#666" stroke="none" >Telegram owns chat membership; Paperclip learns stable IDs when the bot receives an</text>
<text x="560" y="536" font-size="12" fill="#666" stroke="none" >addressed message.</text>
<line x1="560" y1="544" x2="1224" y2="544" />
<text x="576" y="568" font-size="14" fill="#000" stroke="none" font-weight="600">Direct messages</text>
<text x="576" y="590" font-size="12" fill="#666" stroke="none" >Anyone who opens the bot can start an active task, subject to</text>
<text x="576" y="606" font-size="12" fill="#666" stroke="none" >Paperclip access policy.</text>
<text x="1208" y="572" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Available</text>
<line x1="576" y1="616" x2="1208" y2="616" stroke="#e6e6e6"/>
<text x="576" y="640" font-size="14" fill="#000" stroke="none" font-weight="600">Groups</text>
<text x="576" y="662" font-size="12" fill="#666" stroke="none" >Add Maya to a group; keep BotFather privacy mode on.</text>
<text x="1208" y="644" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">In Telegram</text>
<line x1="576" y1="688" x2="1208" y2="688" stroke="#e6e6e6"/>
<text x="576" y="712" font-size="14" fill="#000" stroke="none" font-weight="600">Forum topics</text>
<text x="576" y="734" font-size="12" fill="#666" stroke="none" >Add Maya to the forum; an addressed topic message establishes the</text>
<text x="576" y="750" font-size="12" fill="#666" stroke="none" >stable topic binding.</text>
<text x="1208" y="716" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">In Telegram</text>
<text x="560" y="792" font-size="20" fill="#000" stroke="none" font-weight="700">No admin rights by default</text>
<text x="560" y="816" font-size="12" fill="#666" stroke="none" >Ordinary conversation does not need topic creation, member management, or broad group</text>
<text x="560" y="832" font-size="12" fill="#666" stroke="none" >visibility.</text>
<line x1="560" y1="840" x2="1224" y2="840" />
<text x="576" y="864" font-size="14" fill="#000" stroke="none" font-weight="600">Privacy mode</text>
<text x="576" y="886" font-size="12" fill="#666" stroke="none" >Unrelated group traffic is not delivered to Maya.</text>
<text x="1208" y="868" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Keep on</text>
<line x1="576" y1="912" x2="1208" y2="912" stroke="#e6e6e6"/>
<text x="576" y="936" font-size="14" fill="#000" stroke="none" font-weight="600">Admin upgrade</text>
<text x="576" y="958" font-size="12" fill="#666" stroke="none" >Request only later if a separately planned capability truly</text>
<text x="576" y="974" font-size="12" fill="#666" stroke="none" >requires it.</text>
<text x="1208" y="940" font-size="12" fill="#000" stroke="none" text-anchor="end" font-weight="600">Not requested</text><rect x="560" y="1048" width="208" height="48" rx="4" fill="#fff"/><text x="664" y="1078" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Continue</text><rect x="784" y="1048" width="440" height="48" rx="4" fill="#000"/><text x="1004" y="1078" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Open Maya in Telegram</text><g data-region="annotations"><rect x="256" y="88" width="248" height="520" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="256" cy="88" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="256" y="92" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
