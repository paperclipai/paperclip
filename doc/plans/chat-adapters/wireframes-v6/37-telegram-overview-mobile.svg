<text x="24" y="1364" font-size="14" fill="#000" stroke="none" font-weight="600">Rich interaction</text>
<text x="24" y="1386" font-size="12" fill="#666" stroke="none" >Inline callback and URL buttons, Markdown</text>
<text x="24" y="1402" font-size="12" fill="#666" stroke="none" >rendering, documents and media groups.</text>
