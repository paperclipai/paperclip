<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1928" viewBox="0 0 375 1928" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect width="375" height="1928"/><rect x="0" y="0" width="375" height="56" rx="6" /><text x="16" y="35" font-size="14" fill="#000" stroke="none" font-weight="600">‹  Maya on Telegram</text><text x="359" y="35" font-size="12" fill="#666" stroke="none" text-anchor="end">Menu</text><rect x="16" y="72" width="343" height="48" rx="6" fill="#fff"/><text x="32" y="102" font-size="14" fill="#000" stroke="none" font-weight="600">Overview</text><text x="343" y="102" font-size="14" fill="#666" stroke="none" text-anchor="end">⌄</text><text x="16" y="152" font-size="20" fill="#000" stroke="none" font-weight="700">Telegram overview</text><text x="16" y="176" font-size="12" fill="#666" stroke="none" >Identity, installation health, automatic</text>
