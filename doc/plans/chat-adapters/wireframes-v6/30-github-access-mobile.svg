<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1592" viewBox="0 0 375 1592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect width="375" height="1592"/><rect x="0" y="0" width="375" height="56" rx="6" /><text x="16" y="35" font-size="14" fill="#000" stroke="none" font-weight="600">‹  Maya on GitHub</text><text x="359" y="35" font-size="12" fill="#666" stroke="none" text-anchor="end">Menu</text><rect x="16" y="72" width="343" height="48" rx="6" fill="#fff"/><text x="32" y="102" font-size="14" fill="#000" stroke="none" font-weight="600">Access</text><text x="343" y="102" font-size="14" fill="#666" stroke="none" text-anchor="end">⌄</text><text x="16" y="152" font-size="20" fill="#000" stroke="none" font-weight="700">GitHub access</text><text x="16" y="176" font-size="12" fill="#666" stroke="none" >External identities, linked Paperclip users,</text>
<text x="16" y="192" font-size="12" fill="#666" stroke="none" >sponsored guests, and effective authority.</text><text x="16" y="222" font-size="20" fill="#000" stroke="none" font-weight="700">Endpoint sponsor</text>
<text x="16" y="248" font-size="12" fill="#666" stroke="none" >Sponsored authority is restricted to this</text>
<text x="16" y="264" font-size="12" fill="#666" stroke="none" >installation and repository allowlist.</text>
<line x1="16" y1="276" x2="359" y2="276" />
<text x="24" y="300" font-size="14" fill="#000" stroke="none" font-weight="600">Sponsor</text>
<text x="24" y="322" font-size="12" fill="#666" stroke="none" >Dana · Company admin</text>
<rect x="223" y="332" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="362" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Change sponsor</text>
<line x1="24" y1="388" x2="351" y2="388" stroke="#e6e6e6"/>
<text x="24" y="412" font-size="14" fill="#000" stroke="none" font-weight="600">Endpoint scope</text>
<text x="24" y="434" font-size="12" fill="#666" stroke="none" >Support project · acme/api and acme/web</text>
<rect x="223" y="444" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="474" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">View scope</text>
<text x="16" y="530" font-size="20" fill="#000" stroke="none" font-weight="700">Linked GitHub people</text>
<text x="16" y="556" font-size="12" fill="#666" stroke="none" >The durable GitHub numeric user ID is linked</text>
<text x="16" y="572" font-size="12" fill="#666" stroke="none" >after Paperclip authentication.</text>
