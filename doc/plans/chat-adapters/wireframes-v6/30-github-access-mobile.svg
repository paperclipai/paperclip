<line x1="24" y1="808" x2="351" y2="808" stroke="#e6e6e6"/>
<text x="24" y="832" font-size="14" fill="#000" stroke="none" font-weight="600">Link another person</text>
<text x="24" y="854" font-size="12" fill="#666" stroke="none" >Create an expiring company-confirmation</text>
<text x="24" y="870" font-size="12" fill="#666" stroke="none" >link.</text>
<rect x="223" y="864" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="894" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Create link</text>
<text x="16" y="950" font-size="20" fill="#000" stroke="none" font-weight="700">Unlinked contributors</text>
<text x="16" y="976" font-size="12" fill="#666" stroke="none" >Public or outside contributors never inherit</text>
<text x="16" y="992" font-size="12" fill="#666" stroke="none" >repository or company governance authority.</text>
<line x1="16" y1="1004" x2="359" y2="1004" />
<text x="24" y="1028" font-size="14" fill="#000" stroke="none" font-weight="600">Restricted guest profile</text>
<text x="24" y="1050" font-size="12" fill="#666" stroke="none" >Comment and receive safe output only inside</text>
<text x="24" y="1066" font-size="12" fill="#666" stroke="none" >an allowed bound issue.</text>
<rect x="223" y="1060" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1090" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Default</text>
<line x1="24" y1="1116" x2="351" y2="1116" stroke="#e6e6e6"/>
<text x="24" y="1140" font-size="14" fill="#000" stroke="none" font-weight="600">Governance</text>
<text x="24" y="1162" font-size="12" fill="#666" stroke="none" >No approvals, budgets, hiring, permissions,</text>
<text x="24" y="1178" font-size="12" fill="#666" stroke="none" >connection management, or reassignment.</text>
<rect x="223" y="1172" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1202" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Denied</text>
<text x="16" y="1258" font-size="20" fill="#000" stroke="none" font-weight="700">GitHub identity rules</text>
<text x="16" y="1284" font-size="12" fill="#666" stroke="none" >Login names may change; installation ID and</text>
<text x="16" y="1300" font-size="12" fill="#666" stroke="none" >numeric actor ID remain authoritative.</text>
<line x1="16" y1="1312" x2="359" y2="1312" />
<text x="24" y="1336" font-size="14" fill="#000" stroke="none" font-weight="600">Bot comments</text>
<text x="24" y="1358" font-size="12" fill="#666" stroke="none" >Self-authored comments and duplicate</text>
<text x="24" y="1374" font-size="12" fill="#666" stroke="none" >webhook deliveries are suppressed.</text>
<rect x="223" y="1368" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1398" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Ignored</text>
