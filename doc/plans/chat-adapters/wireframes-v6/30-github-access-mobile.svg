<text x="24" y="630" font-size="12" fill="#666" stroke="none" >ari@acme.com · Member · confirmed Sep 3</text>
<rect x="223" y="640" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="670" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Revoke</text>
