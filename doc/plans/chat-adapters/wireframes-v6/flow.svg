<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect x="0" y="0" width="1280" height="880"/><text x="48" y="48" font-size="28" fill="#000" stroke="none" font-weight="700">Minimum chat-connector setup</text><text x="48" y="80" font-size="14" fill="#666" stroke="none" >Every setup screen contains only actions or values the operator must provide.</text>
    <rect x="48" y="128" width="176" height="88" rx="4" fill="#e6e6e6"/><text x="64" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Connectors</text><text x="64" y="188" font-size="12" fill="#666" stroke="none" >Choose provider</text><line x1="224" y1="172" x2="264" y2="172" /><polygon points="264,172 256,166 256,178" fill="#000" stroke="none"/><rect x="264" y="128" width="192" height="88" rx="4" fill="#fff"/><text x="280" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Purpose?</text><text x="280" y="188" font-size="12" fill="#666" stroke="none" >Only if dual-surface</text><line x1="456" y1="172" x2="496" y2="172" /><polygon points="496,172 488,166 488,178" fill="#000" stroke="none"/><rect x="496" y="128" width="184" height="88" rx="4" fill="#fff"/><text x="512" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Choose agent</text><text x="512" y="188" font-size="12" fill="#666" stroke="none" >Once</text><line x1="680" y1="172" x2="720" y2="172" /><polygon points="720,172 712,166 712,178" fill="#000" stroke="none"/><rect x="720" y="128" width="216" height="88" rx="4" fill="#fff"/><text x="736" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Provider actions</text><text x="736" y="188" font-size="12" fill="#666" stroke="none" >Minimum required</text><line x1="936" y1="172" x2="976" y2="172" /><polygon points="976,172 968,166 968,178" fill="#000" stroke="none"/><rect x="976" y="128" width="208" height="88" rx="4" fill="#e6e6e6"/><text x="992" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Test</text><text x="992" y="188" font-size="12" fill="#666" stroke="none" >Real message</text>
    <text x="48" y="304" font-size="12" fill="#666" stroke="none" font-weight="700">NORMAL PATHS</text><rect x="48" y="336" width="248" height="88" rx="4" fill="#fff"/><text x="64" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">Slack</text><text x="64" y="396" font-size="12" fill="#666" stroke="none" >Add to Slack → test</text><rect x="312" y="336" width="248" height="88" rx="4" fill="#fff"/><text x="328" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">GitHub</text><text x="328" y="396" font-size="12" fill="#666" stroke="none" >Create → repos → test</text><rect x="576" y="336" width="264" height="88" rx="4" fill="#fff"/><text x="592" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">Microsoft Teams</text><text x="592" y="396" font-size="12" fill="#666" stroke="none" >Command → install → test</text><rect x="856" y="336" width="248" height="88" rx="4" fill="#fff"/><text x="872" y="368" font-size="14" fill="#000" stroke="none" font-weight="700">Telegram</text><text x="872" y="396" font-size="12" fill="#666" stroke="none" >BotFather token → test</text>
    <text x="48" y="512" font-size="12" fill="#666" stroke="none" font-weight="700">ONLY WHEN THE NORMAL PATH IS UNAVAILABLE</text><rect x="48" y="544" width="320" height="88" rx="4" fill="#fff"/><text x="64" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Customer-owned Slack App</text><text x="64" y="604" font-size="12" fill="#666" stroke="none" >Manifest → install → 2 secrets</text><rect x="392" y="544" width="320" height="88" rx="4" fill="#fff"/><text x="408" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Existing GitHub App</text><text x="408" y="604" font-size="12" fill="#666" stroke="none" >Webhook settings → ID + key</text><rect x="736" y="544" width="320" height="88" rx="4" fill="#fff"/><text x="752" y="576" font-size="14" fill="#000" stroke="none" font-weight="700">Manual Microsoft setup</text><text x="752" y="604" font-size="12" fill="#666" stroke="none" >Endpoint → 3 identity values</text>
    <text x="48" y="728" font-size="20" fill="#000" stroke="none" font-weight="700">After setup</text><text x="48" y="760" font-size="14" fill="#666" stroke="none" >Overview shows automatic health and capabilities. Settings contains only real scope, boundary, access, and repair decisions.</text>
