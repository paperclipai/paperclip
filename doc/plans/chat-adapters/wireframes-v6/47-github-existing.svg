<rect x="552" y="608" width="680" height="200" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="552" cy="608" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="552" y="612" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text>
<rect x="552" y="840" width="680" height="72" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="552" cy="840" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="552" y="844" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">4</text></g></svg>
