<circle cx="32" cy="600" r="6" fill="#e6e6e6"/><text x="56" y="604" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="904" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="928" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="960" /></g><g data-region="topbar"><line x1="240" y1="64" x2="1280" y2="64" /><text x="264" y="40" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  GitHub  ›  Chat with an agent</text><circle cx="1240" cy="32" r="16" fill="#e6e6e6"/></g><text x="264" y="104" font-size="12" fill="#666" stroke="none" font-weight="700">CUSTOM SETUP</text>
<text x="264" y="128" font-size="14" fill="#000" stroke="none" font-weight="700">GitHub</text>
<line x1="520" y1="64" x2="520" y2="960" />
<line x1="288" y1="152" x2="288" y2="392" />
<circle cx="288" cy="152" r="16" fill="#000"/>
<text x="288" y="157" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="700">✓</text>
<text x="320" y="148" font-size="14" fill="#000" stroke="none" >Agent selected</text>
<circle cx="288" cy="232" r="16" fill="#fff"/>
<text x="288" y="237" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">2</text>
<text x="320" y="228" font-size="14" fill="#000" stroke="none" font-weight="700">Configure existing App</text>
<circle cx="288" cy="312" r="16" fill="#fff"/>
<text x="288" y="317" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">3</text>
<text x="320" y="308" font-size="14" fill="#666" stroke="none" >Choose repositories</text>
<circle cx="288" cy="392" r="16" fill="#fff"/>
<text x="288" y="397" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">4</text>
<text x="320" y="388" font-size="14" fill="#666" stroke="none" >Try Maya</text><text x="560" y="112" font-size="28" fill="#000" stroke="none" font-weight="700">Connect an existing GitHub App</text>
<text x="560" y="144" font-size="14" fill="#666" stroke="none" >Update the App in GitHub, then provide its identity credentials.</text>
<text x="560" y="192" font-size="14" fill="#000" stroke="none" font-weight="600">Webhook URL and secret</text><rect x="904" y="176" width="320" height="48" rx="4" fill="#fff"/><text x="1064" y="206" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Copy Paperclip webhook settings</text>

<text x="560" y="280" font-size="20" fill="#000" stroke="none" font-weight="700">Do this</text>
<circle cx="584" cy="336" r="16" fill="#fff"/>
<text x="584" y="341" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">1</text>
<text x="616" y="332" font-size="14" fill="#000" stroke="none" font-weight="600">Update the webhook</text>
<text x="616" y="356" font-size="12" fill="#666" stroke="none" >In the GitHub App settings, paste Paperclip's URL and generated secret, then</text>
<text x="616" y="372" font-size="12" fill="#666" stroke="none" >make the webhook active.</text>
<line x1="616" y1="392" x2="1224" y2="392" stroke="#e6e6e6"/>
<circle cx="584" cy="432" r="16" fill="#fff"/>
<text x="584" y="437" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">2</text>
<text x="616" y="428" font-size="14" fill="#000" stroke="none" font-weight="600">Set permissions and events</text>
<text x="616" y="452" font-size="12" fill="#666" stroke="none" >Grant Issues: write, Pull requests: write, Metadata: read; subscribe to</text>
<text x="616" y="468" font-size="12" fill="#666" stroke="none" >Issue comment and Pull request review comment.</text>
<line x1="616" y1="488" x2="1224" y2="488" stroke="#e6e6e6"/>
<circle cx="584" cy="528" r="16" fill="#fff"/>
<text x="584" y="533" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">3</text>
<text x="616" y="524" font-size="14" fill="#000" stroke="none" font-weight="600">Create a private key</text>
<text x="616" y="548" font-size="12" fill="#666" stroke="none" >In the App settings, click Generate a private key and download the PEM file.</text>
<text x="560" y="632" font-size="14" fill="#000" stroke="none" font-weight="600">GitHub App ID</text>
<rect x="560" y="648" width="664" height="48" rx="4" fill="#fff"/>
<text x="576" y="678" font-size="14" fill="#666" stroke="none" >123456</text>
<text x="560" y="736" font-size="14" fill="#000" stroke="none" font-weight="600">Private key</text>
<rect x="560" y="752" width="664" height="48" rx="4" fill="#fff"/>
<text x="576" y="782" font-size="14" fill="#666" stroke="none" >Choose PEM file</text>
<rect x="560" y="856" width="256" height="48" rx="4" fill="#fff"/><text x="688" y="886" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Back</text>
<rect x="832" y="856" width="392" height="48" rx="4" fill="#000"/><text x="1028" y="886" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Connect and verify</text><g data-region="annotations"><rect x="256" y="88" width="248" height="440" rx="4" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="256" cy="88" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="256" y="92" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
