<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1788" viewBox="0 0 375 1788" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect width="375" height="1788"/><rect x="0" y="0" width="375" height="56" rx="6" /><text x="16" y="35" font-size="14" fill="#000" stroke="none" font-weight="600">‹  Maya on Telegram</text><text x="359" y="35" font-size="12" fill="#666" stroke="none" text-anchor="end">Menu</text><rect x="16" y="72" width="343" height="48" rx="6" fill="#fff"/><text x="32" y="102" font-size="14" fill="#000" stroke="none" font-weight="600">Settings</text><text x="343" y="102" font-size="14" fill="#666" stroke="none" text-anchor="end">⌄</text><text x="16" y="152" font-size="20" fill="#000" stroke="none" font-weight="700">Telegram settings</text><text x="16" y="176" font-size="12" fill="#666" stroke="none" >Only scope, task boundaries, access, and</text>
<text x="16" y="192" font-size="12" fill="#666" stroke="none" >necessary provider operations.</text><text x="16" y="222" font-size="20" fill="#000" stroke="none" font-weight="700">Chat and participant reach</text>
<text x="16" y="248" font-size="12" fill="#666" stroke="none" >Allowed IDs narrow Telegram membership and</text>
<text x="16" y="264" font-size="12" fill="#666" stroke="none" >BotFather group policy.</text>
<line x1="16" y1="276" x2="359" y2="276" />
<text x="24" y="300" font-size="14" fill="#000" stroke="none" font-weight="600">Allowed chats</text>
<text x="24" y="322" font-size="12" fill="#666" stroke="none" >Operations group and Support forum</text>
<rect x="223" y="332" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="362" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">2 chats</text>
<line x1="24" y1="388" x2="351" y2="388" stroke="#e6e6e6"/>
<text x="24" y="412" font-size="14" fill="#000" stroke="none" font-weight="600">Allowed topics</text>
<text x="24" y="434" font-size="12" fill="#666" stroke="none" >Support forum · topic 381</text>
<rect x="223" y="444" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="474" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">1 topic</text>
<line x1="24" y1="500" x2="351" y2="500" stroke="#e6e6e6"/>
<text x="24" y="524" font-size="14" fill="#000" stroke="none" font-weight="600">Direct messages</text>
<text x="24" y="546" font-size="12" fill="#666" stroke="none" >People may start active tasks in private</text>
<text x="24" y="562" font-size="12" fill="#666" stroke="none" >chat.</text>
<rect x="223" y="556" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="586" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Allowed</text>
<line x1="24" y1="612" x2="351" y2="612" stroke="#e6e6e6"/>
<text x="24" y="636" font-size="14" fill="#000" stroke="none" font-weight="600">Allowed users</text>
<text x="24" y="658" font-size="12" fill="#666" stroke="none" >No additional principal allowlist inside</text>
<text x="24" y="674" font-size="12" fill="#666" stroke="none" >the saved chat scope.</text>
<rect x="223" y="668" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="698" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">All scoped</text>
<text x="16" y="754" font-size="20" fill="#000" stroke="none" font-weight="700">Task boundaries</text>
<text x="16" y="780" font-size="12" fill="#666" stroke="none" >Linear chats use an explicit active issue</text>
<text x="16" y="796" font-size="12" fill="#666" stroke="none" >instead of pretending Telegram has Slack-style…</text>
<line x1="16" y1="808" x2="359" y2="808" />
<text x="24" y="832" font-size="14" fill="#000" stroke="none" font-weight="600">Direct message</text>
<text x="24" y="854" font-size="12" fill="#666" stroke="none" >First message starts the active issue; New</text>
<text x="24" y="870" font-size="12" fill="#666" stroke="none" >task or /new starts another.</text>
<rect x="223" y="864" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="894" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Active task</text>
<line x1="24" y1="920" x2="351" y2="920" stroke="#e6e6e6"/>
<text x="24" y="944" font-size="14" fill="#000" stroke="none" font-weight="600">Ordinary group</text>
<text x="24" y="966" font-size="12" fill="#666" stroke="none" >@maya activates; replies to Maya or new</text>
<text x="24" y="982" font-size="12" fill="#666" stroke="none" >mentions continue.</text>
<rect x="223" y="976" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1006" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Addressed</text>
<line x1="24" y1="1032" x2="351" y2="1032" stroke="#e6e6e6"/>
<text x="24" y="1056" font-size="14" fill="#000" stroke="none" font-weight="600">Forum topic</text>
<text x="24" y="1078" font-size="12" fill="#666" stroke="none" >Stable message_thread_id maps one topic to</text>
<text x="24" y="1094" font-size="12" fill="#666" stroke="none" >one issue.</text>
<rect x="223" y="1088" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1118" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Topic</text>
<text x="16" y="1174" font-size="20" fill="#000" stroke="none" font-weight="700">BotFather policy and delivery</text>
<text x="16" y="1200" font-size="12" fill="#666" stroke="none" >Paperclip reports the deployment-selected path;</text>
<text x="16" y="1216" font-size="12" fill="#666" stroke="none" >it is not an endpoint preference.</text>
<line x1="16" y1="1228" x2="359" y2="1228" />
<text x="24" y="1252" font-size="14" fill="#000" stroke="none" font-weight="600">Delivery path</text>
<text x="24" y="1274" font-size="12" fill="#666" stroke="none" >Selected from instance reachability and</text>
<text x="24" y="1290" font-size="12" fill="#666" stroke="none" >verified continuously.</text>
<rect x="223" y="1284" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1314" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Automatic</text>
<line x1="24" y1="1340" x2="351" y2="1340" stroke="#e6e6e6"/>
<text x="24" y="1364" font-size="14" fill="#000" stroke="none" font-weight="600">Privacy mode</text>
<text x="24" y="1386" font-size="12" fill="#666" stroke="none" >Remain on so unrelated group traffic is not</text>
<text x="24" y="1402" font-size="12" fill="#666" stroke="none" >consumed.</text>
<rect x="223" y="1396" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1426" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Required</text>
<line x1="24" y1="1452" x2="351" y2="1452" stroke="#e6e6e6"/>
<text x="24" y="1476" font-size="14" fill="#000" stroke="none" font-weight="600">Token rotation</text>
<text x="24" y="1498" font-size="12" fill="#666" stroke="none" >Replace the secret reference after rotating</text>
<text x="24" y="1514" font-size="12" fill="#666" stroke="none" >with BotFather.</text>
<rect x="223" y="1508" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1538" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Manage secret</text>
<line x1="24" y1="1564" x2="351" y2="1564" stroke="#e6e6e6"/>
<text x="24" y="1588" font-size="14" fill="#000" stroke="none" font-weight="600">Delivery changes</text>
<text x="24" y="1610" font-size="12" fill="#666" stroke="none" >Paperclip drains pending updates if</text>
<text x="24" y="1626" font-size="12" fill="#666" stroke="none" >instance delivery changes.</text>
<rect x="223" y="1620" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1650" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Automatic</text><rect x="16" y="1716" width="343" height="48" rx="6" fill="#000"/><text x="187.5" y="1746" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Save changes</text><g data-region="annotations"><rect x="8" y="192" width="359" height="540" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="192" r="9" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="196" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
<rect x="8" y="724" width="359" height="428" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="724" r="9" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="728" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">2</text>
<rect x="8" y="1144" width="359" height="540" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="1144" r="9" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="1148" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text></g></svg>
