<circle cx="32" cy="574" r="6" fill="#e6e6e6"/><text x="52" y="579" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="1122" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="1150" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1178" /></g><g><line x1="240" y1="60" x2="1280" y2="60" /><text x="264" y="36" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  Maya on GitHub  ›  Settings</text><circle cx="1240" cy="30" r="16" fill="#e6e6e6"/></g><g><text x="264" y="94" font-size="12" fill="#666" stroke="none" >‹  All connectors</text><circle cx="280" cy="132" r="18" fill="#e6e6e6"/><text x="308" y="138" font-size="14" fill="#000" stroke="none" font-weight="700">Maya on GitHub</text><text x="280" y="194" font-size="14" fill="#666" stroke="none" >Overview</text>
<rect x="252" y="216" width="216" height="40" rx="6" fill="#e6e6e6"/><text x="280" y="242" font-size="14" fill="#000" stroke="none" font-weight="600">Settings</text>
<text x="280" y="290" font-size="14" fill="#666" stroke="none" >Access</text>
<text x="280" y="338" font-size="14" fill="#666" stroke="none" >Conversations</text>
<text x="280" y="386" font-size="14" fill="#666" stroke="none" >Activity</text><line x1="480" y1="60" x2="480" y2="1178" /></g><text x="504" y="108" font-size="28" fill="#000" stroke="none" font-weight="700">GitHub settings</text><text x="504" y="138" font-size="14" fill="#666" stroke="none" >Only scope, task boundaries, access, and necessary provider operations.</text><text x="504" y="198" font-size="20" fill="#000" stroke="none" font-weight="700">Repository reach</text>
<text x="504" y="223" font-size="12" fill="#666" stroke="none" >Paperclip can only narrow repositories selected in the GitHub App installation.</text>
<line x1="504" y1="246" x2="1224" y2="246" />
<text x="520" y="272" font-size="14" fill="#000" stroke="none" font-weight="600">Installation</text>
<text x="520" y="294" font-size="12" fill="#666" stroke="none" >Acme organization · installation 48219</text>
<rect x="1032" y="258" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="288" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Change install</text>
<line x1="520" y1="318" x2="1208" y2="318" stroke="#e6e6e6"/>
<text x="520" y="344" font-size="14" fill="#000" stroke="none" font-weight="600">Allowed repositories</text>
<text x="520" y="366" font-size="12" fill="#666" stroke="none" >acme/api, acme/web</text>
<rect x="1032" y="330" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="360" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">2 repositories</text>
<line x1="520" y1="390" x2="1208" y2="390" stroke="#e6e6e6"/>
<text x="520" y="416" font-size="14" fill="#000" stroke="none" font-weight="600">Conversation surfaces</text>
<text x="520" y="438" font-size="12" fill="#666" stroke="none" >Issues, PR conversations, and inline review threads.</text>
<rect x="1032" y="402" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="432" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">All supported</text>
<text x="504" y="492" font-size="20" fill="#000" stroke="none" font-weight="700">Task boundaries</text>
<text x="504" y="517" font-size="12" fill="#666" stroke="none" >GitHub's existing object or review thread is the durable conversation boundary.</text>
<line x1="504" y1="540" x2="1224" y2="540" />
<text x="520" y="566" font-size="14" fill="#000" stroke="none" font-weight="600">Activation</text>
<text x="520" y="588" font-size="12" fill="#666" stroke="none" >A direct @paperclip-maya mention binds the addressed conversation.</text>
<rect x="1032" y="552" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="582" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Mention</text>
<line x1="520" y1="612" x2="1208" y2="612" stroke="#e6e6e6"/>
<text x="520" y="638" font-size="14" fill="#000" stroke="none" font-weight="600">Pull requests</text>
<text x="520" y="660" font-size="12" fill="#666" stroke="none" >The PR conversation and each inline review thread remain distinct.</text>
<rect x="1032" y="624" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="654" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Separate</text>
<line x1="520" y1="684" x2="1208" y2="684" stroke="#e6e6e6"/>
<text x="520" y="710" font-size="14" fill="#000" stroke="none" font-weight="600">Trusted automation</text>
<text x="520" y="732" font-size="12" fill="#666" stroke="none" >Optional label or trusted-author activation creates work without a</text>
<text x="520" y="748" font-size="12" fill="#666" stroke="none" >mention.</text>
<rect x="1032" y="696" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="726" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Off</text>
<text x="504" y="786" font-size="20" fill="#000" stroke="none" font-weight="700">Delivery and security</text>
<text x="504" y="811" font-size="12" fill="#666" stroke="none" >These settings control the App and webhook—not individual response capabilities.</text>
<line x1="504" y1="834" x2="1224" y2="834" />
<text x="520" y="860" font-size="14" fill="#000" stroke="none" font-weight="600">GitHub host</text>
<text x="520" y="882" font-size="12" fill="#666" stroke="none" >github.com</text>
<rect x="1032" y="846" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="876" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Change host</text>
<line x1="520" y1="906" x2="1208" y2="906" stroke="#e6e6e6"/>
<text x="520" y="932" font-size="14" fill="#000" stroke="none" font-weight="600">Private key</text>
<text x="520" y="954" font-size="12" fill="#666" stroke="none" >Secret ref · github/maya-app ·•••• A19C</text>
<rect x="1032" y="918" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="948" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Rotate</text>
<line x1="520" y1="978" x2="1208" y2="978" stroke="#e6e6e6"/>
<text x="520" y="1004" font-size="14" fill="#000" stroke="none" font-weight="600">Installation drift</text>
<text x="520" y="1026" font-size="12" fill="#666" stroke="none" >Pause affected repositories after suspension or permission change.</text>
