<text x="320" y="388" font-size="14" fill="#666" stroke="none" >Try Maya</text><text x="560" y="112" font-size="28" fill="#000" stroke="none" font-weight="700">Create Maya for Microsoft Teams</text>
<text x="560" y="144" font-size="14" fill="#666" stroke="none" >Run one command to register Maya with Microsoft.</text>

<text x="560" y="192" font-size="14" fill="#000" stroke="none" font-weight="600">Setup command</text><rect x="560" y="208" width="664" height="56" rx="4" fill="#e6e6e6"/><text x="576" y="242" font-size="14" fill="#000" stroke="none" >npx @paperclipai/teams-connect --setup PC-7K4M</text>
<text x="560" y="312" font-size="20" fill="#000" stroke="none" font-weight="700">Do this</text>
<circle cx="584" cy="368" r="16" fill="#fff"/>
<text x="584" y="373" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">1</text>
<text x="616" y="364" font-size="14" fill="#000" stroke="none" font-weight="600">Copy and run the command</text>
<text x="616" y="388" font-size="12" fill="#666" stroke="none" >Run it in a terminal on a computer where you can sign in to Microsoft 365.</text>
<line x1="616" y1="424" x2="1224" y2="424" stroke="#e6e6e6"/>
<circle cx="584" cy="464" r="16" fill="#fff"/>
<text x="584" y="469" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="700">2</text>
<text x="616" y="460" font-size="14" fill="#000" stroke="none" font-weight="600">Sign in to Microsoft</text>
<text x="616" y="484" font-size="12" fill="#666" stroke="none" >Approve the Microsoft login when the browser opens. The command creates the</text>
<text x="616" y="500" font-size="12" fill="#666" stroke="none" >bot and returns here when it is ready.</text>

<rect x="560" y="568" width="256" height="48" rx="4" fill="#fff"/><text x="688" y="598" font-size="14" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Set up Microsoft manually</text>
