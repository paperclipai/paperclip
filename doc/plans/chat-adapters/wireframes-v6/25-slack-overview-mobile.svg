<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1928" viewBox="0 0 375 1928" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect width="375" height="1928"/><rect x="0" y="0" width="375" height="56" rx="6" /><text x="16" y="35" font-size="14" fill="#000" stroke="none" font-weight="600">‹  Maya on Slack</text><text x="359" y="35" font-size="12" fill="#666" stroke="none" text-anchor="end">Menu</text><rect x="16" y="72" width="343" height="48" rx="6" fill="#fff"/><text x="32" y="102" font-size="14" fill="#000" stroke="none" font-weight="600">Overview</text><text x="343" y="102" font-size="14" fill="#666" stroke="none" text-anchor="end">⌄</text><text x="16" y="152" font-size="20" fill="#000" stroke="none" font-weight="700">Slack overview</text><text x="16" y="176" font-size="12" fill="#666" stroke="none" >Identity, installation health, automatic</text>
<text x="16" y="192" font-size="12" fill="#666" stroke="none" >capabilities, and connector lifecycle.</text><text x="16" y="222" font-size="20" fill="#000" stroke="none" font-weight="700">Connection</text>
<text x="16" y="248" font-size="12" fill="#666" stroke="none" >One bot identity represents Maya in one Slack</text>
<text x="16" y="264" font-size="12" fill="#666" stroke="none" >installation.</text>
<line x1="16" y1="276" x2="359" y2="276" />
<text x="24" y="300" font-size="14" fill="#000" stroke="none" font-weight="600">Status</text>
<text x="24" y="322" font-size="12" fill="#666" stroke="none" >Active · last event 18 seconds ago</text>
<rect x="223" y="332" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="362" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Healthy</text>
<line x1="24" y1="388" x2="351" y2="388" stroke="#e6e6e6"/>
<text x="24" y="412" font-size="14" fill="#000" stroke="none" font-weight="600">Agent</text>
<text x="24" y="434" font-size="12" fill="#666" stroke="none" >Maya · Support engineer</text>
<rect x="223" y="444" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="474" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Open agent</text>
<line x1="24" y1="500" x2="351" y2="500" stroke="#e6e6e6"/>
<text x="24" y="524" font-size="14" fill="#000" stroke="none" font-weight="600">Slack identity</text>
<text x="24" y="546" font-size="12" fill="#666" stroke="none" >@maya · Acme workspace</text>
<rect x="223" y="556" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="586" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Open Slack</text>
<text x="16" y="642" font-size="20" fill="#000" stroke="none" font-weight="700">Installation and delivery</text>
<text x="16" y="668" font-size="12" fill="#666" stroke="none" >Operational details remain visible without</text>
<text x="16" y="684" font-size="12" fill="#666" stroke="none" >reopening setup.</text>
<line x1="16" y1="696" x2="359" y2="696" />
<text x="24" y="720" font-size="14" fill="#000" stroke="none" font-weight="600">Installation</text>
<text x="24" y="742" font-size="12" fill="#666" stroke="none" >OAuth workspace · 2 invited channels</text>
<rect x="223" y="752" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="782" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Connected</text>
<line x1="24" y1="808" x2="351" y2="808" stroke="#e6e6e6"/>
<text x="24" y="832" font-size="14" fill="#000" stroke="none" font-weight="600">Ingress</text>
<text x="24" y="854" font-size="12" fill="#666" stroke="none" >Verified direct webhook · p95</text>
<text x="24" y="870" font-size="12" fill="#666" stroke="none" >acknowledgement 420 ms</text>
<rect x="223" y="864" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="894" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Healthy</text>
<line x1="24" y1="920" x2="351" y2="920" stroke="#e6e6e6"/>
<text x="24" y="944" font-size="14" fill="#000" stroke="none" font-weight="600">Credentials</text>
<text x="24" y="966" font-size="12" fill="#666" stroke="none" >Bot token and signing secret</text>
<rect x="223" y="976" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1006" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">No drift</text>
<text x="16" y="1062" font-size="20" fill="#000" stroke="none" font-weight="700">Available automatically</text>
<text x="16" y="1088" font-size="12" fill="#666" stroke="none" >Paperclip always uses the richest safe Slack</text>
<text x="16" y="1104" font-size="12" fill="#666" stroke="none" >behavior permitted by this installation.</text>
<line x1="16" y1="1116" x2="359" y2="1116" />
<text x="24" y="1140" font-size="14" fill="#000" stroke="none" font-weight="600">Conversation</text>
<text x="24" y="1162" font-size="12" fill="#666" stroke="none" >Root mention creates a native thread;</text>
<text x="24" y="1178" font-size="12" fill="#666" stroke="none" >subscribed replies continue the same issue.</text>
<rect x="223" y="1172" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1202" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Included</text>
<line x1="24" y1="1228" x2="351" y2="1228" stroke="#e6e6e6"/>
<text x="24" y="1252" font-size="14" fill="#000" stroke="none" font-weight="600">Output</text>
<text x="24" y="1274" font-size="12" fill="#666" stroke="none" >Reaction receipt, native streaming or</text>
<text x="24" y="1290" font-size="12" fill="#666" stroke="none" >post/edit, safe milestones, final reply.</text>
<rect x="223" y="1284" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1314" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Included</text>
<line x1="24" y1="1340" x2="351" y2="1340" stroke="#e6e6e6"/>
<text x="24" y="1364" font-size="14" fill="#000" stroke="none" font-weight="600">Rich interaction</text>
<text x="24" y="1386" font-size="12" fill="#666" stroke="none" >Block Kit, buttons, selects, modals, slash</text>
<text x="24" y="1402" font-size="12" fill="#666" stroke="none" >commands, emoji, and stop.</text>
<rect x="223" y="1396" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1426" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Included</text>
<line x1="24" y1="1452" x2="351" y2="1452" stroke="#e6e6e6"/>
<text x="24" y="1476" font-size="14" fill="#000" stroke="none" font-weight="600">Files and privacy</text>
<text x="24" y="1498" font-size="12" fill="#666" stroke="none" >Bounded files, DMs, ephemeral response with</text>
<text x="24" y="1514" font-size="12" fill="#666" stroke="none" >DM/text fallback.</text>
<rect x="223" y="1508" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1538" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Included</text>
<text x="16" y="1594" font-size="20" fill="#000" stroke="none" font-weight="700">Lifecycle</text>
<text x="16" y="1620" font-size="12" fill="#666" stroke="none" >Connection actions preserve the endpoint and</text>
<text x="16" y="1636" font-size="12" fill="#666" stroke="none" >its audit history.</text>
<line x1="16" y1="1648" x2="359" y2="1648" />
<text x="24" y="1672" font-size="14" fill="#000" stroke="none" font-weight="600">Connection test</text>
<text x="24" y="1694" font-size="12" fill="#666" stroke="none" >Verify identity, permissions, events, and a</text>
<text x="24" y="1710" font-size="12" fill="#666" stroke="none" >private response.</text>
<rect x="223" y="1704" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1734" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Test</text>
<line x1="24" y1="1760" x2="351" y2="1760" stroke="#e6e6e6"/>
<text x="24" y="1784" font-size="14" fill="#000" stroke="none" font-weight="600">Maintenance</text>
<text x="24" y="1806" font-size="12" fill="#666" stroke="none" >Pause delivery, reconnect OAuth, rotate</text>
<text x="24" y="1822" font-size="12" fill="#666" stroke="none" >secrets, or remove endpoint.</text>
