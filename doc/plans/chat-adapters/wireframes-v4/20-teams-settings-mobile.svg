<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1788" viewBox="0 0 375 1788" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect width="375" height="1788"/><rect x="0" y="0" width="375" height="56" rx="6" /><text x="16" y="35" font-size="14" fill="#000" stroke="none" font-weight="600">‹  Maya on Teams</text><text x="359" y="35" font-size="12" fill="#666" stroke="none" text-anchor="end">Menu</text><rect x="16" y="72" width="343" height="48" rx="6" fill="#fff"/><text x="32" y="102" font-size="14" fill="#000" stroke="none" font-weight="600">Settings</text><text x="343" y="102" font-size="14" fill="#666" stroke="none" text-anchor="end">⌄</text><text x="16" y="152" font-size="20" fill="#000" stroke="none" font-weight="700">Teams settings</text><text x="16" y="176" font-size="12" fill="#666" stroke="none" >Only scope, task boundaries, access, and</text>
<text x="16" y="192" font-size="12" fill="#666" stroke="none" >necessary provider operations.</text><text x="16" y="222" font-size="20" fill="#000" stroke="none" font-weight="700">Tenant and conversation reach</text>
<text x="16" y="248" font-size="12" fill="#666" stroke="none" >Paperclip narrows the scopes where the Teams</text>
<text x="16" y="264" font-size="12" fill="#666" stroke="none" >app is installed.</text>
<line x1="16" y1="276" x2="359" y2="276" />
<text x="24" y="300" font-size="14" fill="#000" stroke="none" font-weight="600">Tenant</text>
<text x="24" y="322" font-size="12" fill="#666" stroke="none" >Acme · 0f3c••••</text>
<rect x="223" y="332" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="362" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Change install</text>
<line x1="24" y1="388" x2="351" y2="388" stroke="#e6e6e6"/>
<text x="24" y="412" font-size="14" fill="#000" stroke="none" font-weight="600">Teams and channels</text>
<text x="24" y="434" font-size="12" fill="#666" stroke="none" >Support / General</text>
<rect x="223" y="444" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="474" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">1 channel</text>
<line x1="24" y1="500" x2="351" y2="500" stroke="#e6e6e6"/>
<text x="24" y="524" font-size="14" fill="#000" stroke="none" font-weight="600">Personal scope</text>
<text x="24" y="546" font-size="12" fill="#666" stroke="none" >Allow installed users to start work in a</text>
<text x="24" y="562" font-size="12" fill="#666" stroke="none" >DM.</text>
<rect x="223" y="556" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="586" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Allowed</text>
<line x1="24" y1="612" x2="351" y2="612" stroke="#e6e6e6"/>
<text x="24" y="636" font-size="14" fill="#000" stroke="none" font-weight="600">Group chats</text>
<text x="24" y="658" font-size="12" fill="#666" stroke="none" >Allow installed group chats to start work.</text>
<rect x="223" y="668" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="698" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Allowed</text>
<text x="16" y="754" font-size="20" fill="#000" stroke="none" font-weight="700">Task boundaries</text>
<text x="16" y="780" font-size="12" fill="#666" stroke="none" >The Teams conversation type determines the</text>
<text x="16" y="796" font-size="12" fill="#666" stroke="none" >durable issue boundary.</text>
<line x1="16" y1="808" x2="359" y2="808" />
<text x="24" y="832" font-size="14" fill="#000" stroke="none" font-weight="600">Channel posts</text>
<text x="24" y="854" font-size="12" fill="#666" stroke="none" >A root mention and the replies beneath that</text>
<text x="24" y="870" font-size="12" fill="#666" stroke="none" >post map to one issue.</text>
<rect x="223" y="864" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="894" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Post thread</text>
<line x1="24" y1="920" x2="351" y2="920" stroke="#e6e6e6"/>
<text x="24" y="944" font-size="14" fill="#000" stroke="none" font-weight="600">DM and group chat</text>
<text x="24" y="966" font-size="12" fill="#666" stroke="none" >One active issue until a participant</text>
<text x="24" y="982" font-size="12" fill="#666" stroke="none" >chooses New task.</text>
<rect x="223" y="976" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1006" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Active task</text>
<line x1="24" y1="1032" x2="351" y2="1032" stroke="#e6e6e6"/>
<text x="24" y="1056" font-size="14" fill="#000" stroke="none" font-weight="600">Unmentioned replies</text>
<text x="24" y="1078" font-size="12" fill="#666" stroke="none" >Consume when the installed manifest</text>
<text x="24" y="1094" font-size="12" fill="#666" stroke="none" >permits; otherwise ask for another mention.</text>
<rect x="223" y="1088" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1118" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Detect</text>
<text x="16" y="1174" font-size="20" fill="#000" stroke="none" font-weight="700">Delivery and Microsoft consent</text>
<text x="16" y="1200" font-size="12" fill="#666" stroke="none" >Consent changes what Microsoft delivers; it</text>
<text x="16" y="1216" font-size="12" fill="#666" stroke="none" >does not switch rendering features on and off.</text>
<line x1="16" y1="1228" x2="359" y2="1228" />
<text x="24" y="1252" font-size="14" fill="#000" stroke="none" font-weight="600">Bot identity</text>
<text x="24" y="1274" font-size="12" fill="#666" stroke="none" >Federated workload identity · single tenant</text>
<rect x="223" y="1284" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1314" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Manage</text>
<line x1="24" y1="1340" x2="351" y2="1340" stroke="#e6e6e6"/>
<text x="24" y="1364" font-size="14" fill="#000" stroke="none" font-weight="600">Resource-specific consent</text>
<text x="24" y="1386" font-size="12" fill="#666" stroke="none" >Optional all-message delivery for one</text>
<text x="24" y="1402" font-size="12" fill="#666" stroke="none" >installed team or chat.</text>
<rect x="223" y="1396" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1426" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Not granted</text>
<line x1="24" y1="1452" x2="351" y2="1452" stroke="#e6e6e6"/>
<text x="24" y="1476" font-size="14" fill="#000" stroke="none" font-weight="600">Graph directory/history</text>
<text x="24" y="1498" font-size="12" fill="#666" stroke="none" >Privileged admin consent remains separate</text>
<text x="24" y="1514" font-size="12" fill="#666" stroke="none" >from basic live chat.</text>
<rect x="223" y="1508" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1538" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Not granted</text>
<line x1="24" y1="1564" x2="351" y2="1564" stroke="#e6e6e6"/>
<text x="24" y="1588" font-size="14" fill="#000" stroke="none" font-weight="600">Installation drift</text>
<text x="24" y="1610" font-size="12" fill="#666" stroke="none" >Pause an affected scope after package</text>
<text x="24" y="1626" font-size="12" fill="#666" stroke="none" >removal or consent revocation.</text>
<rect x="223" y="1620" width="128" height="48" rx="6" fill="#fff"/><text x="287" y="1650" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Automatic</text><rect x="16" y="1716" width="343" height="48" rx="6" fill="#000"/><text x="187.5" y="1746" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Save changes</text><g data-region="annotations"><rect x="8" y="192" width="359" height="540" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="192" r="9" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="196" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
<rect x="8" y="724" width="359" height="428" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="724" r="9" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="728" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">2</text>
<rect x="8" y="1144" width="359" height="540" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="8" cy="1144" r="9" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="8" y="1148" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text></g></svg>
