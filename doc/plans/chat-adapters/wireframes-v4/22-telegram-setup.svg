<circle cx="32" cy="574" r="6" fill="#e6e6e6"/><text x="52" y="579" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="1710" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="1738" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1766" /></g><g><line x1="240" y1="60" x2="1280" y2="60" /><text x="264" y="36" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  Telegram  ›  Chat with an agent</text><circle cx="1240" cy="30" r="16" fill="#e6e6e6"/></g><text x="288" y="108" font-size="28" fill="#000" stroke="none" font-weight="700">Invite Maya to Telegram</text><text x="288" y="138" font-size="14" fill="#666" stroke="none" >Create one BotFather bot, choose a delivery mode, add it to chats, and verify privacy behavior.</text><line x1="264" y1="160" x2="1224" y2="160" /><g transform="translate(-216,0)"><text x="504" y="198" font-size="20" fill="#000" stroke="none" font-weight="700">Agent and Telegram identity</text>
<text x="504" y="223" font-size="12" fill="#666" stroke="none" >One Telegram username represents exactly one Paperclip agent.</text>
<line x1="504" y1="246" x2="1224" y2="246" />
<text x="520" y="272" font-size="14" fill="#000" stroke="none" font-weight="600">Paperclip agent</text>
<text x="520" y="294" font-size="12" fill="#666" stroke="none" >Maya · Support engineer</text>
<rect x="1032" y="258" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="288" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Change agent</text>
<line x1="520" y1="318" x2="1208" y2="318" stroke="#e6e6e6"/>
<text x="520" y="344" font-size="14" fill="#000" stroke="none" font-weight="600">Telegram bot</text>
<text x="520" y="366" font-size="12" fill="#666" stroke="none" >Maya · @maya_acme_bot · avatar/about preview</text>
<rect x="1032" y="330" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="360" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Preview</text>
<text x="504" y="420" font-size="20" fill="#000" stroke="none" font-weight="700">Create the bot with BotFather</text>
<text x="504" y="445" font-size="12" fill="#666" stroke="none" >Telegram owns username uniqueness, profile, group eligibility, and token issuance.</text>
<line x1="504" y1="468" x2="1224" y2="468" />
<text x="520" y="494" font-size="14" fill="#000" stroke="none" font-weight="600">1. Create bot</text>
<text x="520" y="516" font-size="12" fill="#666" stroke="none" >Use /newbot, then set display name and unique username.</text>
<rect x="1032" y="480" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="510" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Open Telegram</text>
<line x1="520" y1="540" x2="1208" y2="540" stroke="#e6e6e6"/>
<text x="520" y="566" font-size="14" fill="#000" stroke="none" font-weight="600">2. Configure profile</text>
<text x="520" y="588" font-size="12" fill="#666" stroke="none" >Set avatar, about text, and group-joining policy.</text>
<rect x="1032" y="552" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="582" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Copy values</text>
<line x1="520" y1="612" x2="1208" y2="612" stroke="#e6e6e6"/>
<text x="520" y="638" font-size="14" fill="#000" stroke="none" font-weight="600">3. Keep privacy mode on</text>
<text x="520" y="660" font-size="12" fill="#666" stroke="none" >The bot sees addressed group messages without consuming ambient traffic.</text>
<rect x="1032" y="624" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="654" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Required</text>
<text x="504" y="714" font-size="20" fill="#000" stroke="none" font-weight="700">Choose delivery</text>
<text x="504" y="739" font-size="12" fill="#666" stroke="none" >Webhook and polling are mutually exclusive.</text>
<line x1="504" y1="762" x2="1224" y2="762" />
<text x="520" y="788" font-size="14" fill="#000" stroke="none" font-weight="600">Production</text>
<text x="520" y="810" font-size="12" fill="#666" stroke="none" >HTTPS webhook with Telegram secret-token verification.</text>
<rect x="1032" y="774" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="804" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Webhook</text>
<line x1="520" y1="834" x2="1208" y2="834" stroke="#e6e6e6"/>
<text x="520" y="860" font-size="14" fill="#000" stroke="none" font-weight="600">Private Paperclip</text>
<text x="520" y="882" font-size="12" fill="#666" stroke="none" >Use the outbound relay to reach the same verified webhook handler.</text>
<rect x="1032" y="846" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="876" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Use relay</text>
<line x1="520" y1="906" x2="1208" y2="906" stroke="#e6e6e6"/>
<text x="520" y="932" font-size="14" fill="#000" stroke="none" font-weight="600">Local development</text>
<text x="520" y="954" font-size="12" fill="#666" stroke="none" >One long-running poller; Paperclip removes any webhook first.</text>
<rect x="1032" y="918" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="948" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Advanced</text>
<text x="504" y="1008" font-size="20" fill="#000" stroke="none" font-weight="700">Connect token and chats</text>
<text x="504" y="1033" font-size="12" fill="#666" stroke="none" >The bot token is a Paperclip secret reference and can be rotated independently.</text>
<line x1="504" y1="1056" x2="1224" y2="1056" />
<text x="520" y="1082" font-size="14" fill="#000" stroke="none" font-weight="600">Bot token</text>
<text x="520" y="1104" font-size="12" fill="#666" stroke="none" >Secret ref · telegram/maya-bot ·•••• 471A</text>
<rect x="1032" y="1068" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1098" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Replace</text>
<line x1="520" y1="1128" x2="1208" y2="1128" stroke="#e6e6e6"/>
<text x="520" y="1154" font-size="14" fill="#000" stroke="none" font-weight="600">Webhook URL and secret</text>
<text x="520" y="1176" font-size="12" fill="#666" stroke="none" >Generated endpoint and secret-token header value.</text>
<rect x="1032" y="1140" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1170" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Copy</text>
<line x1="520" y1="1200" x2="1208" y2="1200" stroke="#e6e6e6"/>
<text x="520" y="1226" font-size="14" fill="#000" stroke="none" font-weight="600">Add Maya to chats</text>
<text x="520" y="1248" font-size="12" fill="#666" stroke="none" >Invite the bot to groups or forums; topic administration is optional.</text>
<rect x="1032" y="1212" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1242" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Instructions</text>
<text x="504" y="1302" font-size="20" fill="#000" stroke="none" font-weight="700">Verify and activate</text>
<text x="504" y="1327" font-size="12" fill="#666" stroke="none" >Verification checks both provider state and the expected addressed-message behavior.</text>
<line x1="504" y1="1350" x2="1224" y2="1350" />
<text x="520" y="1376" font-size="14" fill="#000" stroke="none" font-weight="600">Bot identity</text>
<text x="520" y="1398" font-size="12" fill="#666" stroke="none" >getMe → @maya_acme_bot</text>
<rect x="1032" y="1362" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1392" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Passed</text>
<line x1="520" y1="1422" x2="1208" y2="1422" stroke="#e6e6e6"/>
<text x="520" y="1448" font-size="14" fill="#000" stroke="none" font-weight="600">Delivery</text>
<text x="520" y="1470" font-size="12" fill="#666" stroke="none" >getWebhookInfo · URL · secret · zero pending updates</text>
<rect x="1032" y="1434" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1464" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Passed</text>
<line x1="520" y1="1494" x2="1208" y2="1494" stroke="#e6e6e6"/>
<text x="520" y="1520" font-size="14" fill="#000" stroke="none" font-weight="600">Privacy and membership</text>
<text x="520" y="1542" font-size="12" fill="#666" stroke="none" >Privacy on · 2 allowed chats · forum topic access</text>
<rect x="1032" y="1506" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1536" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Passed</text>
<line x1="520" y1="1566" x2="1208" y2="1566" stroke="#e6e6e6"/>
<text x="520" y="1592" font-size="14" fill="#000" stroke="none" font-weight="600">Test message</text>
<text x="520" y="1614" font-size="12" fill="#666" stroke="none" >Send a DM or addressed group message before activation.</text>
