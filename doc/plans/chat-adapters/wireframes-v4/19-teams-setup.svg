<rect x="496" y="1050" width="736" height="302" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="1050" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="1054" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">4</text>
<rect x="496" y="1344" width="736" height="374" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="1344" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="1348" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">5</text></g></g><rect x="1008" y="1766" width="216" height="48" rx="6" fill="#000"/><text x="1116" y="1796" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Activate Teams</text><text x="288" y="1796" font-size="12" fill="#666" stroke="none" >All provider-owned approvals and installation steps stay visible and resumable.</text></svg>
