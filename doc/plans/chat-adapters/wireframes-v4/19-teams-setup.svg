<circle cx="32" cy="574" r="6" fill="#e6e6e6"/><text x="52" y="579" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="1782" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="1810" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1838" /></g><g><line x1="240" y1="60" x2="1280" y2="60" /><text x="264" y="36" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  Microsoft Teams  ›  Chat with an agent</text><circle cx="1240" cy="30" r="16" fill="#e6e6e6"/></g><text x="288" y="108" font-size="28" fill="#000" stroke="none" font-weight="700">Invite Maya to Microsoft Teams</text><text x="288" y="138" font-size="14" fill="#666" stroke="none" >Register the bot, package the Teams app, install it to the intended scopes, and verify delivery.</text><line x1="264" y1="160" x2="1224" y2="160" /><g transform="translate(-216,0)"><text x="504" y="198" font-size="20" fill="#000" stroke="none" font-weight="700">Agent and Teams identity</text>
<text x="504" y="223" font-size="12" fill="#666" stroke="none" >One Teams bot application represents exactly one Paperclip agent.</text>
<line x1="504" y1="246" x2="1224" y2="246" />
<text x="520" y="272" font-size="14" fill="#000" stroke="none" font-weight="600">Paperclip agent</text>
<text x="520" y="294" font-size="12" fill="#666" stroke="none" >Maya · Support engineer</text>
<rect x="1032" y="258" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="288" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Change agent</text>
<line x1="520" y1="318" x2="1208" y2="318" stroke="#e6e6e6"/>
<text x="520" y="344" font-size="14" fill="#000" stroke="none" font-weight="600">Teams bot</text>
<text x="520" y="366" font-size="12" fill="#666" stroke="none" >Maya · app and avatar preview</text>
<rect x="1032" y="330" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="360" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Preview</text>
<line x1="520" y1="390" x2="1208" y2="390" stroke="#e6e6e6"/>
<text x="520" y="416" font-size="14" fill="#000" stroke="none" font-weight="600">Messaging endpoint</text>
<text x="520" y="438" font-size="12" fill="#666" stroke="none" >https://chat.paperclip.app/in/••••/teams</text>
<rect x="1032" y="402" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="432" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Copy</text>
<text x="504" y="492" font-size="20" fill="#000" stroke="none" font-weight="700">Choose Microsoft environment</text>
<text x="504" y="517" font-size="12" fill="#666" stroke="none" >Tenant and identity model must be known before app registration.</text>
<line x1="504" y1="540" x2="1224" y2="540" />
<text x="520" y="566" font-size="14" fill="#000" stroke="none" font-weight="600">Cloud</text>
<text x="520" y="588" font-size="12" fill="#666" stroke="none" >Microsoft commercial cloud</text>
<rect x="1032" y="552" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="582" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Change</text>
<line x1="520" y1="612" x2="1208" y2="612" stroke="#e6e6e6"/>
<text x="520" y="638" font-size="14" fill="#000" stroke="none" font-weight="600">Tenant mode</text>
<text x="520" y="660" font-size="12" fill="#666" stroke="none" >Single tenant · Acme</text>
<rect x="1032" y="624" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="654" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Change</text>
<line x1="520" y1="684" x2="1208" y2="684" stroke="#e6e6e6"/>
<text x="520" y="710" font-size="14" fill="#000" stroke="none" font-weight="600">Bot authentication</text>
<text x="520" y="732" font-size="12" fill="#666" stroke="none" >Federated workload identity</text>
<rect x="1032" y="696" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="726" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Recommended</text>
<text x="504" y="786" font-size="20" fill="#000" stroke="none" font-weight="700">Register and package the Teams app</text>
<text x="504" y="811" font-size="12" fill="#666" stroke="none" >Teams Developer CLI is the shortest supported handoff; manual registration remains available.</text>
<line x1="504" y1="834" x2="1224" y2="834" />
<text x="520" y="860" font-size="14" fill="#000" stroke="none" font-weight="600">1. Verify tenant policy</text>
<text x="520" y="882" font-size="12" fill="#666" stroke="none" >Custom app upload or tenant-admin distribution must be allowed.</text>
<rect x="1032" y="846" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="876" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Open policy</text>
<line x1="520" y1="906" x2="1208" y2="906" stroke="#e6e6e6"/>
<text x="520" y="932" font-size="14" fill="#000" stroke="none" font-weight="600">2. Create app and bot</text>
<text x="520" y="954" font-size="12" fill="#666" stroke="none" >Use the copied endpoint and generated manifest values.</text>
<rect x="1032" y="918" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="948" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Copy command</text>
<line x1="520" y1="978" x2="1208" y2="978" stroke="#e6e6e6"/>
<text x="520" y="1004" font-size="14" fill="#000" stroke="none" font-weight="600">3. Download app package</text>
<text x="520" y="1026" font-size="12" fill="#666" stroke="none" >Paperclip validates scopes, IDs, endpoint, and package consistency.</text>
<rect x="1032" y="990" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1020" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Download</text>
<text x="504" y="1080" font-size="20" fill="#000" stroke="none" font-weight="700">Install in Teams</text>
<text x="504" y="1105" font-size="12" fill="#666" stroke="none" >Microsoft owns tenant approval and the personal, team, channel, or group-chat installation.</text>
<line x1="504" y1="1128" x2="1224" y2="1128" />
<text x="520" y="1154" font-size="14" fill="#000" stroke="none" font-weight="600">Install link</text>
<text x="520" y="1176" font-size="12" fill="#666" stroke="none" >Open the Teams client installation flow.</text>
<rect x="1032" y="1140" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1170" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Open Teams</text>
<line x1="520" y1="1200" x2="1208" y2="1200" stroke="#e6e6e6"/>
<text x="520" y="1226" font-size="14" fill="#000" stroke="none" font-weight="600">Admin-managed tenant</text>
<text x="520" y="1248" font-size="12" fill="#666" stroke="none" >Export the package for the Teams administrator when sideloading is</text>
<text x="520" y="1264" font-size="12" fill="#666" stroke="none" >blocked.</text>
<rect x="1032" y="1212" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1242" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Export package</text>
<line x1="520" y1="1272" x2="1208" y2="1272" stroke="#e6e6e6"/>
<text x="520" y="1298" font-size="14" fill="#000" stroke="none" font-weight="600">Credentials</text>
<text x="520" y="1320" font-size="12" fill="#666" stroke="none" >Client/app ID and federated identity metadata; secret ref only if client</text>
<text x="520" y="1336" font-size="12" fill="#666" stroke="none" >secret is used.</text>
<rect x="1032" y="1284" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1314" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Review</text>
<text x="504" y="1374" font-size="20" fill="#000" stroke="none" font-weight="700">Verify and activate</text>
<text x="504" y="1399" font-size="12" fill="#666" stroke="none" >Basic mention-based chat does not require broad Graph directory or history consent.</text>
<line x1="504" y1="1422" x2="1224" y2="1422" />
<text x="520" y="1448" font-size="14" fill="#000" stroke="none" font-weight="600">Registration</text>
<text x="520" y="1470" font-size="12" fill="#666" stroke="none" >Entra app, bot ID, tenant, and messaging endpoint</text>
<rect x="1032" y="1434" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1464" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Passed</text>
<line x1="520" y1="1494" x2="1208" y2="1494" stroke="#e6e6e6"/>
<text x="520" y="1520" font-size="14" fill="#000" stroke="none" font-weight="600">Manifest and install</text>
<text x="520" y="1542" font-size="12" fill="#666" stroke="none" >Personal/team/group scopes and installed package version</text>
<rect x="1032" y="1506" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1536" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Passed</text>
<line x1="520" y1="1566" x2="1208" y2="1566" stroke="#e6e6e6"/>
<text x="520" y="1592" font-size="14" fill="#000" stroke="none" font-weight="600">Teams doctor</text>
<text x="520" y="1614" font-size="12" fill="#666" stroke="none" >Package and endpoint checks</text>
<rect x="1032" y="1578" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1608" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Passed</text>
<line x1="520" y1="1638" x2="1208" y2="1638" stroke="#e6e6e6"/>
<text x="520" y="1664" font-size="14" fill="#000" stroke="none" font-weight="600">Test message</text>
<text x="520" y="1686" font-size="12" fill="#666" stroke="none" >Send a private installation check before activation.</text>
<rect x="1032" y="1650" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1680" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Send test</text><g data-region="annotations"><rect x="496" y="168" width="736" height="302" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="168" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="172" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
