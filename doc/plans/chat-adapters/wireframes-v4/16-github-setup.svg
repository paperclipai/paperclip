<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1838" viewBox="0 0 1280 1838" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect width="1280" height="1838"/><g><text x="24" y="38" font-size="20" fill="#000" stroke="none" font-weight="700">Paperclip</text><circle cx="32" cy="68" r="6" fill="#e6e6e6"/><text x="52" y="73" font-size="14" fill="#666" stroke="none" >New Task</text>
<circle cx="32" cy="114" r="6" fill="#e6e6e6"/><text x="52" y="119" font-size="14" fill="#666" stroke="none" >Search</text>
<circle cx="32" cy="160" r="6" fill="#e6e6e6"/><text x="52" y="165" font-size="14" fill="#666" stroke="none" >Dashboard</text>
<circle cx="32" cy="206" r="6" fill="#e6e6e6"/><text x="52" y="211" font-size="14" fill="#666" stroke="none" >Inbox</text>
<circle cx="32" cy="252" r="6" fill="#e6e6e6"/><text x="52" y="257" font-size="14" fill="#666" stroke="none" >Tasks</text>
<circle cx="32" cy="298" r="6" fill="#e6e6e6"/><text x="52" y="303" font-size="14" fill="#666" stroke="none" >Projects</text>
<circle cx="32" cy="344" r="6" fill="#e6e6e6"/><text x="52" y="349" font-size="14" fill="#666" stroke="none" >Routines</text>
<circle cx="32" cy="390" r="6" fill="#e6e6e6"/><text x="52" y="395" font-size="14" fill="#666" stroke="none" >Artifacts</text>
<circle cx="32" cy="436" r="6" fill="#e6e6e6"/><text x="52" y="441" font-size="14" fill="#666" stroke="none" >Agents</text>
<circle cx="32" cy="482" r="6" fill="#e6e6e6"/><text x="52" y="487" font-size="14" fill="#666" stroke="none" >Skills</text>
<rect x="12" y="510" width="216" height="38" rx="6" fill="#e6e6e6"/><circle cx="32" cy="528" r="6" fill="#e6e6e6"/><text x="52" y="533" font-size="14" fill="#000" stroke="none" font-weight="600">Connectors</text>
<circle cx="32" cy="574" r="6" fill="#e6e6e6"/><text x="52" y="579" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="1782" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="1810" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1838" /></g><g><line x1="240" y1="60" x2="1280" y2="60" /><text x="264" y="36" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  GitHub  ›  Chat with an agent</text><circle cx="1240" cy="30" r="16" fill="#e6e6e6"/></g><text x="288" y="108" font-size="28" fill="#000" stroke="none" font-weight="700">Connect Maya to GitHub conversations</text><text x="288" y="138" font-size="14" fill="#666" stroke="none" >Install a least-privilege GitHub App on the repositories where people will talk to Maya.</text><line x1="264" y1="160" x2="1224" y2="160" /><g transform="translate(-216,0)"><text x="504" y="198" font-size="20" fill="#000" stroke="none" font-weight="700">Agent and GitHub identity</text>
<text x="504" y="223" font-size="12" fill="#666" stroke="none" >This chat endpoint is separate from any GitHub code/tool connection.</text>
<line x1="504" y1="246" x2="1224" y2="246" />
<text x="520" y="272" font-size="14" fill="#000" stroke="none" font-weight="600">Paperclip agent</text>
<text x="520" y="294" font-size="12" fill="#666" stroke="none" >Maya · Support engineer</text>
<rect x="1032" y="258" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="288" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Change agent</text>
<line x1="520" y1="318" x2="1208" y2="318" stroke="#e6e6e6"/>
<text x="520" y="344" font-size="14" fill="#000" stroke="none" font-weight="600">Purpose</text>
<text x="520" y="366" font-size="12" fill="#666" stroke="none" >People mention Maya in issues and pull requests.</text>
<rect x="1032" y="330" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="360" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Chat only</text>
<line x1="520" y1="390" x2="1208" y2="390" stroke="#e6e6e6"/>
<text x="520" y="416" font-size="14" fill="#000" stroke="none" font-weight="600">GitHub App identity</text>
<text x="520" y="438" font-size="12" fill="#666" stroke="none" >paperclip-maya[bot] · avatar preview</text>
<rect x="1032" y="402" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="432" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Preview</text>
<text x="504" y="492" font-size="20" fill="#000" stroke="none" font-weight="700">Choose GitHub host and app type</text>
<text x="504" y="517" font-size="12" fill="#666" stroke="none" >A GitHub App is the production path; PAT is only for a local test.</text>
<line x1="504" y1="540" x2="1224" y2="540" />
<text x="520" y="566" font-size="14" fill="#000" stroke="none" font-weight="600">Host</text>
<text x="520" y="588" font-size="12" fill="#666" stroke="none" >GitHub.com</text>
<rect x="1032" y="552" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="582" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Change</text>
<line x1="520" y1="612" x2="1208" y2="612" stroke="#e6e6e6"/>
<text x="520" y="638" font-size="14" fill="#000" stroke="none" font-weight="600">Authentication</text>
<text x="520" y="660" font-size="12" fill="#666" stroke="none" >GitHub App with installation-scoped credentials.</text>
<rect x="1032" y="624" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="654" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Recommended</text>
<line x1="520" y1="684" x2="1208" y2="684" stroke="#e6e6e6"/>
<text x="520" y="710" font-size="14" fill="#000" stroke="none" font-weight="600">Enterprise Server</text>
<text x="520" y="732" font-size="12" fill="#666" stroke="none" >Add a verified API and web base URL when selected.</text>
<rect x="1032" y="696" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="726" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Not used</text>
<text x="504" y="786" font-size="20" fill="#000" stroke="none" font-weight="700">Create the GitHub App</text>
<text x="504" y="811" font-size="12" fill="#666" stroke="none" >Paperclip supplies exact webhook and least-privilege permission values.</text>
<line x1="504" y1="834" x2="1224" y2="834" />
<text x="520" y="860" font-size="14" fill="#000" stroke="none" font-weight="600">Webhook URL and secret</text>
<text x="520" y="882" font-size="12" fill="#666" stroke="none" >Public endpoint plus generated high-entropy secret reference.</text>
<rect x="1032" y="846" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="876" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Copy values</text>
<line x1="520" y1="906" x2="1208" y2="906" stroke="#e6e6e6"/>
<text x="520" y="932" font-size="14" fill="#000" stroke="none" font-weight="600">Repository permissions</text>
<text x="520" y="954" font-size="12" fill="#666" stroke="none" >Issues write · Pull requests write · Metadata read.</text>
<rect x="1032" y="918" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="948" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Copy list</text>
<line x1="520" y1="978" x2="1208" y2="978" stroke="#e6e6e6"/>
<text x="520" y="1004" font-size="14" fill="#000" stroke="none" font-weight="600">Events</text>
<text x="520" y="1026" font-size="12" fill="#666" stroke="none" >Issue comments and pull-request review comments.</text>
<rect x="1032" y="990" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1020" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Copy list</text>
<text x="504" y="1080" font-size="20" fill="#000" stroke="none" font-weight="700">Install on repositories</text>
<text x="504" y="1105" font-size="12" fill="#666" stroke="none" >GitHub owns organization approval and repository selection.</text>
<line x1="504" y1="1128" x2="1224" y2="1128" />
<text x="520" y="1154" font-size="14" fill="#000" stroke="none" font-weight="600">1. Register app</text>
<text x="520" y="1176" font-size="12" fill="#666" stroke="none" >Create the app using the values above.</text>
<rect x="1032" y="1140" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1170" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Open GitHub</text>
<line x1="520" y1="1200" x2="1208" y2="1200" stroke="#e6e6e6"/>
<text x="520" y="1226" font-size="14" fill="#000" stroke="none" font-weight="600">2. Install app</text>
<text x="520" y="1248" font-size="12" fill="#666" stroke="none" >Choose Acme and only the repositories where chat is allowed.</text>
<rect x="1032" y="1212" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1242" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Open install</text>
<line x1="520" y1="1272" x2="1208" y2="1272" stroke="#e6e6e6"/>
<text x="520" y="1298" font-size="14" fill="#000" stroke="none" font-weight="600">3. Add credentials</text>
<text x="520" y="1320" font-size="12" fill="#666" stroke="none" >App ID and private key are stored as Paperclip secret references.</text>
<rect x="1032" y="1284" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1314" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Add secrets</text>
<text x="504" y="1374" font-size="20" fill="#000" stroke="none" font-weight="700">Verify and activate</text>
<text x="504" y="1399" font-size="12" fill="#666" stroke="none" >Code access is intentionally absent from this connection.</text>
<line x1="504" y1="1422" x2="1224" y2="1422" />
<text x="520" y="1448" font-size="14" fill="#000" stroke="none" font-weight="600">Webhook</text>
<text x="520" y="1470" font-size="12" fill="#666" stroke="none" >Signature, delivery ID, and subscribed event verified.</text>
<rect x="1032" y="1434" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1464" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Passed</text>
<line x1="520" y1="1494" x2="1208" y2="1494" stroke="#e6e6e6"/>
<text x="520" y="1520" font-size="14" fill="#000" stroke="none" font-weight="600">Installation</text>
<text x="520" y="1542" font-size="12" fill="#666" stroke="none" >Acme org · acme/api and acme/web</text>
<rect x="1032" y="1506" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1536" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Passed</text>
<line x1="520" y1="1566" x2="1208" y2="1566" stroke="#e6e6e6"/>
<text x="520" y="1592" font-size="14" fill="#000" stroke="none" font-weight="600">Permissions</text>
<text x="520" y="1614" font-size="12" fill="#666" stroke="none" >No Contents, Actions, or Administration grant.</text>
<rect x="1032" y="1578" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1608" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Least privilege</text>
<line x1="520" y1="1638" x2="1208" y2="1638" stroke="#e6e6e6"/>
<text x="520" y="1664" font-size="14" fill="#000" stroke="none" font-weight="600">Test mention</text>
<text x="520" y="1686" font-size="12" fill="#666" stroke="none" >Create a private test issue or use an existing allowed issue.</text>
<rect x="1032" y="1650" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1680" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Send test</text><g data-region="annotations"><rect x="496" y="168" width="736" height="302" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="168" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="172" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
<rect x="496" y="462" width="736" height="302" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="462" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="466" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">2</text>
<rect x="496" y="756" width="736" height="302" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="756" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="760" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text>
<rect x="496" y="1050" width="736" height="302" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="1050" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="1054" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">4</text>
<rect x="496" y="1344" width="736" height="374" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="1344" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="1348" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">5</text></g></g><rect x="1008" y="1766" width="216" height="48" rx="6" fill="#000"/><text x="1116" y="1796" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Activate GitHub</text><text x="288" y="1796" font-size="12" fill="#666" stroke="none" >All provider-owned approvals and installation steps stay visible and resumable.</text></svg>
