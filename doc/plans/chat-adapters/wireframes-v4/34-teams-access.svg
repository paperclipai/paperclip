<text x="520" y="788" font-size="14" fill="#000" stroke="none" font-weight="600">Restricted guest profile</text>
<text x="520" y="810" font-size="12" fill="#666" stroke="none" >Comment, attach files, and receive safe output inside an allowed issue.</text>
