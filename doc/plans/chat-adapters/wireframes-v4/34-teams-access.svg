<text x="504" y="714" font-size="20" fill="#000" stroke="none" font-weight="700">Unlinked participants</text>
<text x="504" y="739" font-size="12" fill="#666" stroke="none" >Guests, federated users, and tenant members all begin with restricted sponsored authority until</text>
<text x="504" y="755" font-size="12" fill="#666" stroke="none" >linked.</text>
