<circle cx="32" cy="574" r="6" fill="#e6e6e6"/><text x="52" y="579" font-size="14" fill="#666" stroke="none" >Audit</text><text x="24" y="1194" font-size="14" fill="#000" stroke="none" font-weight="600">Acme Company</text><text x="24" y="1222" font-size="12" fill="#666" stroke="none" >Dana · Admin</text><line x1="240" y1="0" x2="240" y2="1250" /></g><g><line x1="240" y1="60" x2="1280" y2="60" /><text x="264" y="36" font-size="14" fill="#666" stroke="none" >CONNECTORS  ›  Maya on Slack  ›  Settings</text><circle cx="1240" cy="30" r="16" fill="#e6e6e6"/></g><g><text x="264" y="94" font-size="12" fill="#666" stroke="none" >‹  All connectors</text><circle cx="280" cy="132" r="18" fill="#e6e6e6"/><text x="308" y="138" font-size="14" fill="#000" stroke="none" font-weight="700">Maya on Slack</text><text x="280" y="194" font-size="14" fill="#666" stroke="none" >Overview</text>
<rect x="252" y="216" width="216" height="40" rx="6" fill="#e6e6e6"/><text x="280" y="242" font-size="14" fill="#000" stroke="none" font-weight="600">Settings</text>
<text x="280" y="290" font-size="14" fill="#666" stroke="none" >Access</text>
<text x="280" y="338" font-size="14" fill="#666" stroke="none" >Conversations</text>
<text x="280" y="386" font-size="14" fill="#666" stroke="none" >Activity</text><line x1="480" y1="60" x2="480" y2="1250" /></g><text x="504" y="108" font-size="28" fill="#000" stroke="none" font-weight="700">Slack settings</text><text x="504" y="138" font-size="14" fill="#666" stroke="none" >Only scope, task boundaries, access, and necessary provider operations.</text><text x="504" y="198" font-size="20" fill="#000" stroke="none" font-weight="700">Conversation reach</text>
<text x="504" y="223" font-size="12" fill="#666" stroke="none" >Paperclip can narrow reach but cannot exceed Slack installation and channel membership.</text>
<line x1="504" y1="246" x2="1224" y2="246" />
<text x="520" y="272" font-size="14" fill="#000" stroke="none" font-weight="600">Workspace</text>
<text x="520" y="294" font-size="12" fill="#666" stroke="none" >Acme · T02ACME</text>
<rect x="1032" y="258" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="288" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Change install</text>
<line x1="520" y1="318" x2="1208" y2="318" stroke="#e6e6e6"/>
<text x="520" y="344" font-size="14" fill="#000" stroke="none" font-weight="600">Allowed channels</text>
<text x="520" y="366" font-size="12" fill="#666" stroke="none" >#customer-support, #incidents</text>
<rect x="1032" y="330" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="360" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">2 channels</text>
<line x1="520" y1="390" x2="1208" y2="390" stroke="#e6e6e6"/>
<text x="520" y="416" font-size="14" fill="#000" stroke="none" font-weight="600">Direct messages</text>
<text x="520" y="438" font-size="12" fill="#666" stroke="none" >People in this workspace may start a task in DM.</text>
<rect x="1032" y="402" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="432" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Allowed</text>
<text x="504" y="492" font-size="20" fill="#000" stroke="none" font-weight="700">Task boundaries</text>
<text x="504" y="517" font-size="12" fill="#666" stroke="none" >Slack's native thread is the task boundary for channel work.</text>
<line x1="504" y1="540" x2="1224" y2="540" />
<text x="520" y="566" font-size="14" fill="#000" stroke="none" font-weight="600">New channel work</text>
<text x="520" y="588" font-size="12" fill="#666" stroke="none" >A root @maya mention creates the Slack thread and one Paperclip issue.</text>
<rect x="1032" y="552" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="582" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Fixed</text>
<line x1="520" y1="612" x2="1208" y2="612" stroke="#e6e6e6"/>
<text x="520" y="638" font-size="14" fill="#000" stroke="none" font-weight="600">Bound-thread replies</text>
<text x="520" y="660" font-size="12" fill="#666" stroke="none" >Human replies continue without another mention.</text>
<rect x="1032" y="624" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="654" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Subscribed</text>
<line x1="520" y1="684" x2="1208" y2="684" stroke="#e6e6e6"/>
<text x="520" y="710" font-size="14" fill="#000" stroke="none" font-weight="600">Existing thread</text>
<text x="520" y="732" font-size="12" fill="#666" stroke="none" >The first @maya mention may claim an unbound thread once.</text>
<rect x="1032" y="696" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="726" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Allow</text>
<line x1="520" y1="756" x2="1208" y2="756" stroke="#e6e6e6"/>
<text x="520" y="782" font-size="14" fill="#000" stroke="none" font-weight="600">Direct messages</text>
<text x="520" y="804" font-size="12" fill="#666" stroke="none" >One active issue; New task starts another.</text>
<rect x="1032" y="768" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="798" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Active task</text>
<text x="504" y="858" font-size="20" fill="#000" stroke="none" font-weight="700">Security and delivery</text>
<text x="504" y="883" font-size="12" fill="#666" stroke="none" >Paperclip reports the deployment-selected path; it is not an endpoint setting.</text>
<line x1="504" y1="906" x2="1224" y2="906" />
<text x="520" y="932" font-size="14" fill="#000" stroke="none" font-weight="600">Delivery path</text>
<text x="520" y="954" font-size="12" fill="#666" stroke="none" >Selected from instance reachability and verified continuously.</text>
<rect x="1032" y="918" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="948" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Automatic</text>
<line x1="520" y1="978" x2="1208" y2="978" stroke="#e6e6e6"/>
<text x="520" y="1004" font-size="14" fill="#000" stroke="none" font-weight="600">Credential rotation</text>
<text x="520" y="1026" font-size="12" fill="#666" stroke="none" >Replace token or signing-secret references without changing bindings.</text>
<rect x="1032" y="990" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1020" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Manage secrets</text>
<line x1="520" y1="1050" x2="1208" y2="1050" stroke="#e6e6e6"/>
<text x="520" y="1076" font-size="14" fill="#000" stroke="none" font-weight="600">Installation drift</text>
<text x="520" y="1098" font-size="12" fill="#666" stroke="none" >Pause affected resources when membership, scopes, or OAuth are revoked.</text>
<rect x="1032" y="1062" width="176" height="48" rx="6" fill="#fff"/><text x="1120" y="1092" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="600">Automatic</text><rect x="1048" y="1178" width="176" height="48" rx="6" fill="#000"/><text x="1136" y="1208" font-size="14" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">Save changes</text><g data-region="annotations"><rect x="496" y="168" width="736" height="302" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="168" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="172" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">1</text>
<rect x="496" y="462" width="736" height="374" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="462" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="466" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">2</text>
<rect x="496" y="828" width="736" height="302" rx="6" fill="none" stroke="#d33" stroke-dasharray="6 4"/><circle cx="496" cy="828" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2"/><text x="496" y="832" font-size="12" fill="#d33" stroke="none" text-anchor="middle" font-weight="700">3</text></g></svg>
