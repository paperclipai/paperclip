<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5"><rect width="1280" height="980"/><text x="48" y="48" font-size="28" fill="#000" stroke="none" font-weight="700">Chat connectors · complete provider detail flow</text><text x="48" y="76" font-size="14" fill="#666" stroke="none" >Shared discovery and agent choice lead to provider setup, then the same five-tab connector shell.</text>
    <rect x="48" y="128" width="176" height="88" rx="6" fill="#e6e6e6"/><text x="64" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Connectors</text><text x="64" y="186" font-size="12" fill="#666" stroke="none" >Choose provider</text><line x1="224" y1="172" x2="264" y2="172" /><polygon points="264,172 255,166 255,178" fill="#000" stroke="none"/><rect x="264" y="128" width="192" height="88" rx="6" fill="#fff"/><text x="280" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Purpose?</text><text x="280" y="186" font-size="12" fill="#666" stroke="none" >Only if ambiguous</text><line x1="456" y1="172" x2="496" y2="172" /><polygon points="496,172 487,166 487,178" fill="#000" stroke="none"/><rect x="496" y="128" width="184" height="88" rx="6" fill="#fff"/><text x="512" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Choose agent</text><text x="512" y="186" font-size="12" fill="#666" stroke="none" >Exactly one</text><line x1="680" y1="172" x2="720" y2="172" /><polygon points="720,172 711,166 711,178" fill="#000" stroke="none"/><rect x="720" y="128" width="216" height="88" rx="6" fill="#fff"/><text x="736" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Provider setup</text><text x="736" y="186" font-size="12" fill="#666" stroke="none" >External handoff</text><line x1="936" y1="172" x2="976" y2="172" /><polygon points="976,172 967,166 967,178" fill="#000" stroke="none"/><rect x="976" y="128" width="208" height="88" rx="6" fill="#e6e6e6"/><text x="992" y="160" font-size="14" fill="#000" stroke="none" font-weight="700">Activate</text><text x="992" y="186" font-size="12" fill="#666" stroke="none" >Create endpoint</text>
    <text x="48" y="300" font-size="12" fill="#666" stroke="none" font-weight="700">EVERY PROVIDER ENDPOINT</text><rect x="48" y="326" width="176" height="88" rx="6" fill="#fff"/><text x="64" y="358" font-size="14" fill="#000" stroke="none" font-weight="700">Overview</text><text x="64" y="384" font-size="12" fill="#666" stroke="none" >Health + features</text><rect x="240" y="326" width="176" height="88" rx="6" fill="#fff"/><text x="256" y="358" font-size="14" fill="#000" stroke="none" font-weight="700">Settings</text><text x="256" y="384" font-size="12" fill="#666" stroke="none" >Scope + boundaries</text><rect x="432" y="326" width="176" height="88" rx="6" fill="#fff"/><text x="448" y="358" font-size="14" fill="#000" stroke="none" font-weight="700">Access</text><text x="448" y="384" font-size="12" fill="#666" stroke="none" >Identity + authority</text><rect x="624" y="326" width="176" height="88" rx="6" fill="#fff"/><text x="640" y="358" font-size="14" fill="#000" stroke="none" font-weight="700">Conversations</text><text x="640" y="384" font-size="12" fill="#666" stroke="none" >Native thread ↔ task</text><rect x="816" y="326" width="176" height="88" rx="6" fill="#fff"/><text x="832" y="358" font-size="14" fill="#000" stroke="none" font-weight="700">Activity</text><text x="832" y="384" font-size="12" fill="#666" stroke="none" >Durable ledger</text>
    <text x="48" y="496" font-size="12" fill="#666" stroke="none" font-weight="700">PROVIDER GROUPS</text><rect x="48" y="522" width="216" height="88" rx="6" fill="#fff"/><text x="64" y="554" font-size="14" fill="#000" stroke="none" font-weight="700">Slack</text><text x="64" y="580" font-size="12" fill="#666" stroke="none" >App + native thread</text><rect x="280" y="522" width="216" height="88" rx="6" fill="#fff"/><text x="296" y="554" font-size="14" fill="#000" stroke="none" font-weight="700">GitHub</text><text x="296" y="580" font-size="12" fill="#666" stroke="none" >App + existing object</text><rect x="512" y="522" width="216" height="88" rx="6" fill="#fff"/><text x="528" y="554" font-size="14" fill="#000" stroke="none" font-weight="700">Microsoft Teams</text><text x="528" y="580" font-size="12" fill="#666" stroke="none" >Package + post thread</text><rect x="744" y="522" width="216" height="88" rx="6" fill="#fff"/><text x="760" y="554" font-size="14" fill="#000" stroke="none" font-weight="700">Telegram</text><text x="760" y="580" font-size="12" fill="#666" stroke="none" >BotFather + active task</text>
    <text x="48" y="690" font-size="12" fill="#666" stroke="none" font-weight="700">CONVERSATION LIFECYCLE</text><rect x="48" y="716" width="216" height="88" rx="6" fill="#fff"/><text x="64" y="748" font-size="14" fill="#000" stroke="none" font-weight="700">Native activation</text><text x="64" y="774" font-size="12" fill="#666" stroke="none" >Mention / addressed</text><line x1="264" y1="760" x2="304" y2="760" /><polygon points="304,760 295,754 295,766" fill="#000" stroke="none"/><rect x="304" y="716" width="216" height="88" rx="6" fill="#e6e6e6"/><text x="320" y="748" font-size="14" fill="#000" stroke="none" font-weight="700">Paperclip issue</text><text x="320" y="774" font-size="12" fill="#666" stroke="none" >One per binding</text><line x1="520" y1="760" x2="560" y2="760" /><polygon points="560,760 551,754 551,766" fill="#000" stroke="none"/><rect x="560" y="716" width="216" height="88" rx="6" fill="#fff"/><text x="576" y="748" font-size="14" fill="#000" stroke="none" font-weight="700">Safe publication</text><text x="576" y="774" font-size="12" fill="#666" stroke="none" >Maximal capability</text><line x1="776" y1="760" x2="816" y2="760" /><polygon points="816,760 807,754 807,766" fill="#000" stroke="none"/><rect x="816" y="716" width="216" height="88" rx="6" fill="#fff"/><text x="832" y="748" font-size="14" fill="#000" stroke="none" font-weight="700">Detach</text><text x="832" y="774" font-size="12" fill="#666" stroke="none" >Preserve history</text>
    <text x="48" y="872" font-size="14" fill="#666" stroke="none" >Overview reports available features; Settings contains only scope, boundary, access, and necessary provider operations.</text>
