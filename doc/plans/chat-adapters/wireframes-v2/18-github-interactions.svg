<text x="280" y="386" font-size="14" fill="#666" stroke="none" >Activity</text><line x1="480" y1="60" x2="480" y2="800" /></g><text x="504" y="108" font-size="28" fill="#000" stroke="none" font-weight="700">GitHub interaction model</text><text x="504" y="136" font-size="14" fill="#666" stroke="none" >A mention binds the existing issue, PR, or review thread to one Paperclip issue.</text><text x="504" y="188" font-size="12" fill="#666" stroke="none" font-weight="600">NATIVE EVENT</text><text x="650" y="188" font-size="12" fill="#666" stroke="none" font-weight="600">PROVIDER + PAPERCLIP RESULT</text><rect x="504" y="218" width="720" height="82" rx="6" fill="#fff"/><rect x="520" y="235" width="104" height="48" rx="6" fill="#fff"/><text x="572" y="265" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="700">Human</text><text x="650" y="250" font-size="14" fill="#000" stroke="none" font-weight="600">@maya in issue, PR, or review comment</text><text x="650" y="277" font-size="12" fill="#666" stroke="none" >Existing GitHub object supplies the thread</text><path d="M 860 300 L 860 316"/><polygon points="860,316 854,307 866,307" fill="#000" stroke="none"/>
<rect x="504" y="316" width="720" height="82" rx="6" fill="#fff"/><rect x="520" y="333" width="104" height="48" rx="6" fill="#fff"/><text x="572" y="363" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="700">Ingress</text><text x="650" y="348" font-size="14" fill="#000" stroke="none" font-weight="600">Verify X-Hub-Signature-256 + delivery</text><text x="650" y="375" font-size="12" fill="#666" stroke="none" >Resolve installation, repository, and actor</text><path d="M 860 398 L 860 414"/><polygon points="860,414 854,405 866,405" fill="#000" stroke="none"/>
<rect x="504" y="414" width="720" height="82" rx="6" fill="#e6e6e6"/><rect x="520" y="431" width="104" height="48" rx="6" fill="#fff"/><text x="572" y="461" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="700">Binding</text><text x="650" y="446" font-size="14" fill="#000" stroke="none" font-weight="600">Object/thread key ↔ one PAP issue</text><text x="650" y="473" font-size="12" fill="#666" stroke="none" >PR conversation ≠ inline review thread</text><path d="M 860 496 L 860 512"/><polygon points="860,512 854,503 866,503" fill="#000" stroke="none"/>
<rect x="504" y="512" width="720" height="82" rx="6" fill="#fff"/><rect x="520" y="529" width="104" height="48" rx="6" fill="#fff"/><text x="572" y="559" font-size="12" fill="#000" stroke="none" text-anchor="middle" font-weight="700">Turns</text><text x="650" y="544" font-size="14" fill="#000" stroke="none" font-weight="600">Comments continue; bot comments ignored</text><text x="650" y="571" font-size="12" fill="#666" stroke="none" >No code access unless separate tool grant exists</text><path d="M 860 594 L 860 610"/><polygon points="860,610 854,601 866,601" fill="#000" stroke="none"/>
