version: 1
extends: paperclipai/paperclip/paperclip-ai-factory
topology:
  defaultExecutionLanes: 1
  maxExecutionLanes: 10
  allowParallelLanes: false
  noGrandchildren: true
roles:
  controlOwnerRole: ceo
  laneCoordinatorRole: cto
stages:
  - key: contract
    type: work
    role: cto
  - key: implementation
    type: work
    role: engineer
  - key: independent_qa
    type: verification
    role: qa
    independent: true
  - key: technical_acceptance
    type: review
    role: cto
  - key: deployment
    type: deployment
    role: devops
    optionalWhen: production
  - key: live_qa
    type: verification
    role: qa
    independent: true
    optionalWhen: production
  - key: final_acceptance
    type: approval
    role: cto
    optionalWhen: production
productionAuthority:
  mode: autonomous_unless_hold
  requireCapabilityPreflightBeforeEscalation: true
  requireBoardApprovalForIrreversibleActions: true
recovery:
  attemptMinutes: [2, 10, 30]
  maxAttemptsPerEvidenceFingerprint: 3
