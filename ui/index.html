<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-title" content="Paperclip" />
    <title>Paperclip</title>
    <!-- PAPERCLIP_RUNTIME_BRANDING_START -->
    <!-- PAPERCLIP_RUNTIME_BRANDING_END -->
    <!-- PAPERCLIP_FAVICON_START -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" data-favicon-light="/favicon.ico" data-favicon-dark="/favicon-dark.ico" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" data-favicon-light="/favicon-light.svg" data-favicon-dark="/favicon-dark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" data-favicon-light="/favicon-32x32.png" data-favicon-dark="/favicon-dark-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" data-favicon-light="/favicon-16x16.png" data-favicon-dark="/favicon-dark-16x16.png" />
    <!-- PAPERCLIP_FAVICON_END -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
    <script>
      (() => {
        const key = "paperclip.theme";
        const darkThemeColor = "#18181b";
        const lightThemeColor = "#ffffff";
        try {
          const stored = window.localStorage.getItem(key);
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const fallback = prefersDark ? "dark" : "light";
          const theme = stored === "light" || stored === "dark" ? stored : fallback;
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", isDark ? darkThemeColor : lightThemeColor);
          }
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
      (() => {
        // Browsers rasterize an SVG favicon once and cache the bitmap by URL, so
        // one icon that adapts with prefers-color-scheme can stay stuck in the
        // scheme that was active at first fetch. Point each icon at a URL with
        // fixed colours for the current browser scheme instead. Follow the
        // browser scheme, not the in-app theme: the tab strip follows the browser.
        try {
          if (typeof window.matchMedia !== "function") return;
          const query = window.matchMedia("(prefers-color-scheme: dark)");
          const applyFavicons = () => {
            const attribute = query.matches ? "data-favicon-dark" : "data-favicon-light";
            for (const link of document.querySelectorAll("link[data-favicon-light][data-favicon-dark]")) {
              const href = link.getAttribute(attribute);
              if (href && link.getAttribute("href") !== href) link.setAttribute("href", href);
            }
          };
          applyFavicons();
          if (typeof query.addEventListener === "function") {
            query.addEventListener("change", applyFavicons);
          } else if (typeof query.addListener === "function") {
            query.addListener(applyFavicons);
          }
        } catch {
          // Keep the default icons.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Keep recovery outside #root so it cannot be mistaken for a mounted app.
         It must work even when the app's JavaScript or stylesheet cannot load. -->
    <section id="paperclip-startup" role="status" aria-live="polite" hidden>
      <div class="mx-auto flex min-h-screen max-w-2xl flex-col justify-center space-y-4 px-4 py-10">
        <div>
          <h1 id="paperclip-startup-title" class="text-lg font-semibold">Paperclip couldn’t start</h1>
          <p id="paperclip-startup-message" class="mt-1 text-sm text-muted-foreground">
            Part of the app failed to load. Check your connection and reload this page to try again.
          </p>
        </div>
        <div>
          <button id="paperclip-startup-reload" type="button" class="inline-flex items-center rounded-md border border-input bg-background px-3 py-1.5 text-sm font-medium shadow-sm hover:bg-accent hover:text-accent-foreground">
            Reload page
          </button>
        </div>
      </div>
    </section>
    <script>
      // This guard is deliberately inline and independent of the module graph:
      // React's error boundary cannot catch an import that prevents React loading.
      (() => {
        const root = document.getElementById("root");
        const notice = document.getElementById("paperclip-startup");
        const title = document.getElementById("paperclip-startup-title");
        const message = document.getElementById("paperclip-startup-message");
        const reload = document.getElementById("paperclip-startup-reload");
        const retry = () => window.location.reload();
        const finished = () => root.childElementCount > 0;
        const cleanup = () => {
          clearTimeout(timer);
          observer.disconnect();
          window.removeEventListener("error", onError, true);
          window.removeEventListener("unhandledrejection", onFailure);
          reload.removeEventListener("click", retry);
          notice.remove();
        };
        const onFailure = () => {
          if (finished()) return cleanup();
          title.textContent = "Paperclip couldn’t start";
          message.textContent = "Part of the app failed to load. Check your connection and reload this page to try again.";
          notice.hidden = false;
        };
        const onError = (event) => {
          // Ignore images and other incidental resources. Preserve the original
          // error for the browser console; never display raw errors or URLs here.
          if (event instanceof ErrorEvent || event.target instanceof HTMLScriptElement ||
              (event.target instanceof HTMLLinkElement && event.target.rel === "stylesheet")) onFailure();
        };
        const observer = new MutationObserver(() => { if (finished()) cleanup(); });
        observer.observe(root, { childList: true });
        const timer = setTimeout(() => {
          if (finished()) return cleanup();
          if (!notice.hidden) return;
          title.textContent = "Paperclip is taking longer to load";
          message.textContent = "You can keep waiting, or reload this page to try again.";
          notice.hidden = false;
        }, 30_000);
        window.addEventListener("error", onError, true);
        window.addEventListener("unhandledrejection", onFailure);
        reload.addEventListener("click", retry);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
