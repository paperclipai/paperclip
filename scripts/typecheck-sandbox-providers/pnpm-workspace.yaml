# Sandbox providers stay out of the root workspace, and most of them must not
# commit a lockfile: scripts/build-standalone-public-packages.mjs uses a frozen
# install when one exists. This workspace pins their dependencies in one lockfile
# for scripts/typecheck-test-programs.mjs, without changing how they are released.
packages:
  - ../../packages/plugins/sandbox-providers/*
  - ../../packages/plugins/sandbox-providers/cloudflare/bridge-template

# e2b pins a glob with advisories (GHSA-3g3m-2fjr-6pw4, GHSA-g3hv-75wg-m249).
# tsc only reads these packages, and this override does not change what ships.
overrides:
  glob: ^14.0.2
